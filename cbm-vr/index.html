<body>
<div id="ust"><b>Champion <em>Battle</em> VR</b><span class="mod"><button id="menuB">☰ Menü</button><button id="hiz">⏩ ×1</button></span><span class="imza">Bir Mr. Anduv! yapımıdır.</span></div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from './lib/VRButton.js';
import { OrbitControls } from './lib/OrbitControls.js';
import { Ses } from './ses.js';

/* ---------- ölçek: 1 KM metresi = 1/60 m (saha 1,75 × 1,13 m bilardo masası boyunda) ---------- */
const PW = 68, PL = 105, OLC = 1 / 60, MASA_Y = 0.8, OYUNCU_BUYUT = 2.2;
const kmX = (x, y) => (y - PL / 2) * OLC;            // KM y (kale-kale) → sahne x
const kmZ = (x, y) => (x - PW / 2) * OLC;            // KM x (taç-taç)   → sahne z

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
/* Quest uygulaması olarak açıldıysa (PWA) doğrudan VR'a gir — Meta mağaza kuralı: araya 2B sayfa girmesin */
const pwaMi = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || 'getDigitalGoodsService' in window;
if (pwaMi && navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => ok && navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] })
    .then(s => renderer.xr.setSession(s)).catch(() => {}));                // izin verilmezse ENTER VR düğmesi kalır
}
const sahne = new THREE.Scene(); sahne.background = new THREE.Color('#141c1d'); sahne.fog = new THREE.Fog('#141c1d', 6, 18);
const kamera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 60);
kamera.position.set(0, 1.75, 1.35);
const orbit = new OrbitControls(kamera, renderer.domElement); orbit.target.set(0, MASA_Y, -0.9); orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI * 0.49; orbit.update();
addEventListener('resize', () => { kamera.aspect = innerWidth / innerHeight; kamera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

sahne.add(new THREE.HemisphereLight('#fff7e6', '#2a3332', 0.9));
const isik = new THREE.DirectionalLight('#ffffff', 1.4); isik.position.set(1.5, 4, 1); isik.castShadow = true;
isik.shadow.mapSize.set(2048, 2048); Object.assign(isik.shadow.camera, { left: -1.4, right: 1.4, top: 1.4, bottom: -1.4, near: 1, far: 8 }); sahne.add(isik);

/* ---------- oda ve masa ---------- */
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: '#23302f', roughness: 1 }));
zemin.rotation.x = -Math.PI / 2; zemin.receiveShadow = true; sahne.add(zemin);
const masa = new THREE.Group(); masa.position.set(0, 0, -0.9); sahne.add(masa);
const ahsap = new THREE.MeshStandardMaterial({ color: '#6b4426', roughness: 0.7 });
const tabla = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.06, 1.6), ahsap); tabla.position.y = MASA_Y - 0.03; tabla.receiveShadow = tabla.castShadow = true; masa.add(tabla);
for (const [x, z] of [[-1.02, -0.7], [1.02, -0.7], [-1.02, 0.7], [1.02, 0.7]]) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, MASA_Y - 0.06, 0.08), ahsap); b.position.set(x, (MASA_Y - 0.06) / 2, z); b.castShadow = true; masa.add(b); }

/* ---------- maket stadyum: çim, çizgiler, kaleler, tribün ve Mr. Anduv! panoları (masa grubunda; sol kavramayla döner) ---------- */
const saha = new THREE.Group(); saha.position.y = MASA_Y + 0.002; masa.add(saha);
function cimDokusu() {
  const c = document.createElement('canvas'), S = 10; c.width = (PL + 8) * S; c.height = (PW + 8) * S; const g = c.getContext('2d');
  for (let i = 0; i < 18; i++) { g.fillStyle = i % 2 ? '#3f7f2d' : '#468a32'; g.fillRect(i * c.width / 18, 0, c.width / 18 + 1, c.height); }
  const X = y => (y + 4) * S, Y = x => (x + 4) * S; g.strokeStyle = '#f6f6ee'; g.lineWidth = 0.14 * S;
  g.strokeRect(X(0), Y(0), PL * S, PW * S); g.beginPath(); g.moveTo(X(PL / 2), Y(0)); g.lineTo(X(PL / 2), Y(PW)); g.stroke();
  g.beginPath(); g.arc(X(PL / 2), Y(PW / 2), 9.15 * S, 0, 7); g.stroke();
  for (const [a, d] of [[0, 1], [PL, -1]]) {
    g.strokeRect(Math.min(X(a), X(a + d * 16.5)), Y(PW / 2 - 20.16), 16.5 * S, 40.32 * S);
    g.strokeRect(Math.min(X(a), X(a + d * 5.5)), Y(PW / 2 - 9.16), 5.5 * S, 18.32 * S);
    g.beginPath(); g.arc(X(a + d * 11), Y(PW / 2), 0.25 * S, 0, 7); g.fillStyle = '#f6f6ee'; g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const cim = new THREE.Mesh(new THREE.PlaneGeometry((PL + 8) * OLC, (PW + 8) * OLC), new THREE.MeshStandardMaterial({ map: cimDokusu(), roughness: 0.95 }));
cim.rotation.x = -Math.PI / 2; cim.receiveShadow = true; saha.add(cim);
const beyaz = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4 });
for (const s of [-1, 1]) {
  const kale = new THREE.Group(), h = 2.44 * OLC * 1.4, w = 7.32 * OLC, r = 0.004;
  const dik = () => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 8), beyaz);
  const a = dik(), b = dik(); a.position.set(0, h / 2, -w / 2); b.position.set(0, h / 2, w / 2);
  const ust = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 8), beyaz); ust.rotation.x = Math.PI / 2; ust.position.y = h;
  const ag = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
  ag.rotation.y = Math.PI / 2; ag.position.set(s * 2 * OLC, h / 2, 0);
  kale.add(a, b, ust, ag); a.castShadow = b.castShadow = ust.castShadow = true;
  kale.position.x = s * PL / 2 * OLC; saha.add(kale);
}
/* tribün basamakları ve LED panolar: yalnız Mr. Anduv! markası ve oyunları */
const PANOLAR = ['MR. ANDUV!', 'CHAMPION BATTLE MANAGER', 'KAPTAN MECİT', 'MALAZGİRT AKINCILARI', 'YOUTUBE / MR. ANDUV!', 'INSTAGRAM / MR. ANDUV!', 'SPOTIFY / MR. ANDUV!', 'KIRMIZI YALI', 'KURT YOLU', 'TIKTOK / MR. ANDUV!'];
function panoDokusu(yazi, renk) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#0c0f12'; g.fillRect(0, 0, 512, 64); g.fillStyle = renk; g.font = 'bold 38px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(yazi, 256, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const RENK = ['#e2702a', '#3e9a4c', '#f2c14e', '#d33a2e', '#5aa9e6'];
let pi = 0;
const panoEkle = (x, z, ry, uz) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(uz, 0.035), new THREE.MeshBasicMaterial({ map: panoDokusu(PANOLAR[pi % PANOLAR.length], RENK[pi % RENK.length]) })); pi++; m.position.set(x, 0.0175, z); m.rotation.y = ry; saha.add(m); };
const UZ = (PL + 6) * OLC, EN = (PW + 6) * OLC;
for (let i = 0; i < 4; i++) { const x = -UZ / 2 + UZ / 8 + i * UZ / 4; panoEkle(x, -EN / 2, 0, UZ / 4 - 0.01); }
for (let i = 0; i < 2; i++) { const z = -EN / 4 + i * EN / 2; panoEkle(-UZ / 2, z, Math.PI / 2, EN / 2 - 0.01); panoEkle(UZ / 2, z, -Math.PI / 2, EN / 2 - 0.01); }
const tribunMat = new THREE.MeshStandardMaterial({ color: '#3a4448', roughness: 0.9 });
for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(UZ + 0.1 + k * 0.08, 0.03 + k * 0.03, 0.05), tribunMat); b.position.set(0, (0.03 + k * 0.03) / 2, -EN / 2 - 0.05 - k * 0.05); b.castShadow = b.receiveShadow = true; saha.add(b); }

/* ---------- skor tabelası (masanın üstünde asılı) ---------- */
const tabelaC = document.createElement('canvas'); tabelaC.width = 1024; tabelaC.height = 160; const tabelaT = new THREE.CanvasTexture(tabelaC); tabelaT.colorSpace = THREE.SRGBColorSpace;
const tabela = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.156), new THREE.MeshBasicMaterial({ map: tabelaT, transparent: true }));
tabela.position.set(0, MASA_Y + 0.62, -EN / 2 - 0.2); masa.add(tabela);
let tabelaSon = '';
/* G: o karenin görünümü — { kit:[{c1,c2}], ad:[kısa,kısa], skor:[a,b], alt: dakika ya da olay, vurgu } */
function tabelaCiz(G) {
  const k = `${G.ad}|${G.skor}|${G.alt}|${G.vurgu}`; if (k === tabelaSon) return; tabelaSon = k;
  const g = tabelaC.getContext('2d'); g.clearRect(0, 0, 1024, 160); g.fillStyle = '#0d1314e8'; g.beginPath(); g.roundRect(8, 8, 1008, 144, 24); g.fill();
  g.textBaseline = 'middle'; g.font = 'bold 56px system-ui, sans-serif';
  g.fillStyle = G.kit[0].c1; g.fillRect(40, 50, 26, 60); g.fillStyle = G.kit[1].c1; g.fillRect(958, 50, 26, 60);
  g.fillStyle = '#f4efe2'; g.textAlign = 'left'; g.fillText(G.ad[0], 84, 82); g.textAlign = 'right'; g.fillText(G.ad[1], 940, 82);
  g.textAlign = 'center'; g.font = 'bold 76px system-ui, sans-serif'; g.fillText(`${G.skor[0]} - ${G.skor[1]}`, 512, 74);
  g.font = 'bold 36px system-ui, sans-serif'; g.fillStyle = G.vurgu ? '#f2c14e' : '#9fb3b0';
  let t = G.alt || ''; while (g.measureText(t).width > 960 && t.length > 4) t = t.slice(0, -2); if (t !== (G.alt || '')) t += '…';
  g.fillText(t, 512, 128);
  tabelaT.needsUpdate = true;
}

/* ---------- oyuncular: maket figür (gövde forma rengi, şort, kafa, saç) ---------- */
const figurler = new Map();
function figur(p, kit) {
  const g = new THREE.Group(), s = OLC * OYUNCU_BUYUT;
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 });
  const kaleci = p.role === 'G';
  const govde = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * s, 0.32 * s, 0.75 * s, 12), mat(kaleci ? '#f2c14e' : kit.c1)); govde.position.y = 1.05 * s;
  const sort = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * s, 0.3 * s, 0.3 * s, 12), mat(kaleci ? '#222' : kit.c2)); sort.position.y = 0.55 * s;
  const bacak = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.14 * s, 0.45 * s, 10), mat('#f0f0f0')); bacak.position.y = 0.22 * s;
  const kafa = new THREE.Mesh(new THREE.SphereGeometry(0.22 * s, 14, 10), mat(p.skin || '#e0ac7e')); kafa.position.y = 1.62 * s;
  const sac = new THREE.Mesh(new THREE.SphereGeometry(0.225 * s, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2.1), mat(p.hair || '#2a1a10')); sac.position.y = 1.66 * s;
  const burun = new THREE.Mesh(new THREE.SphereGeometry(0.07 * s, 8, 6), mat(p.skin || '#e0ac7e')); burun.position.set(0.21 * s, 1.6 * s, 0);
  for (const m of [govde, sort, bacak, kafa, sac]) m.castShadow = true;
  g.add(govde, sort, bacak, kafa, sac, burun);
  return g;
}
const halka = new THREE.Mesh(new THREE.TorusGeometry(0.75 * OLC * OYUNCU_BUYUT, 0.08 * OLC * OYUNCU_BUYUT, 8, 32), new THREE.MeshBasicMaterial({ color: '#ffe14a' }));
halka.rotation.x = Math.PI / 2; saha.add(halka);
const ok = new THREE.Mesh(new THREE.ConeGeometry(0.25 * OLC * OYUNCU_BUYUT, 0.5 * OLC * OYUNCU_BUYUT, 10), new THREE.MeshBasicMaterial({ color: '#ffe14a' }));
ok.rotation.x = Math.PI; saha.add(ok);
const top = new THREE.Mesh(new THREE.SphereGeometry(0.009, 16, 12), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.3 }));
top.castShadow = true; saha.add(top);
const topGolge = new THREE.Mesh(new THREE.CircleGeometry(0.008, 16), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.35 }));
topGolge.rotation.x = -Math.PI / 2; saha.add(topGolge);

/* ---------- dil (TR / EN): ilk açılışta cihaz diline göre, menüden değişir ---------- */
const sakla = (k, v) => { try { localStorage.setItem(k, v); } catch { /* depolama yok */ } };
const oku = k => { try { return localStorage.getItem(k); } catch { return null; } };
let DIL = oku('cbmvr.dil') || (/^tr/i.test(navigator.language || '') ? 'tr' : 'en');
const t = (tr, en) => DIL === 'en' ? en : tr;
/* menü durumu (aşağıda kullanılır; burada tanımlı ki çerçeve erken yüklenirse hata olmasın) */
let MENU = true, BASLADI = false, SAYFA = oku('cbmvr.ogretici') ? null : 0, LIGLER_IZ = null, sonDurum = '';
const SEC = (() => { try { const v = JSON.parse(oku('cbmvr.secim')); if (v?.izle && v?.oyna) return v; } catch { /* */ } return { mod: 'izle', izle: { lig: 0, ev: 0, dep: 1 }, oyna: { lig: 0, ev: 0, dep: 1 } }; })();
/* ---------- 🔓 Tam Sürüm (Meta Horizon Store uygulama içi satın alma, tek seferlik): Türkiye ligi ücretsiz, diğer 5 lig Tam Sürüm'de.
   Mağaza dışında (tarayıcıdan açılan web sürümü) her şey açık — telefon sürümlerindeki kuralın aynısı. ---------- */
const TAM_SKU = 'cbmvr_tamsurum', MAGAZA = 'getDigitalGoodsService' in window, UCRETSIZ_LIG = 'tr';
let TAM = !MAGAZA || oku('cbmvr.tam') === '1', TAM_FIYAT = null, DG = null, ALINIYOR = false;
async function tamHazirla() {
  if (!MAGAZA) return;
  try {
    DG = await window.getDigitalGoodsService('https://quest.meta.com/billing');
    const al = await DG.listPurchases();                         // geri yükleme: daha önce alındıysa açılır
    if ((al || []).some(x => x.itemId === TAM_SKU)) { TAM = true; sakla('cbmvr.tam', '1'); }
    const d = (await DG.getDetails([TAM_SKU]) || []).find(x => x.itemId === TAM_SKU);
    if (d?.price) TAM_FIYAT = new Intl.NumberFormat(DIL === 'tr' ? 'tr-TR' : 'en-US', { style: 'currency', currency: d.price.currency }).format(+d.price.value);
  } catch { /* mağaza servisi yok */ }
  if (typeof menuCiz === 'function') try { menuCiz(); } catch { /* menü henüz yok */ }
}
async function tamAl() {
  if (ALINIYOR) return; ALINIYOR = true;
  try {
    const r = new PaymentRequest([{ supportedMethods: 'https://quest.meta.com/billing', data: { sku: TAM_SKU } }], { total: { label: 'Total', amount: { currency: 'USD', value: '0' } } });
    const yanit = await r.show(); const jeton = yanit.details?.purchaseToken; await yanit.complete('success');
    if (jeton) { TAM = true; sakla('cbmvr.tam', '1'); }
  } catch { /* iptal ya da hata */ }
  ALINIYOR = false; menuCiz();
}
const kilitli = lig => !TAM && lig && lig.kod !== UCRETSIZ_LIG;
tamHazirla();
const ULKE = { tr: ['Türkiye', 'Turkey'], en: ['İngiltere', 'England'], es: ['İspanya', 'Spain'], it: ['İtalya', 'Italy'], de: ['Almanya', 'Germany'], fr: ['Fransa', 'France'] };

/* ---------- maç: Champion maç motoru (izle ve yönet) ---------- */
const MOD = 'izle';
let IZM = null, IZ = null, izAcc = 0, HIZ = 1, sonOlay = '', sonOlayT = 0, izBitisT = 0, izleYukle = null, golYazi = 0, sonSkor = '0-0';

/* ---------- giriş: kumanda çubuğu bakış yönüne göre, tuşlar kenar tetiklemeli ---------- */
const onceki = new Map();
const kenar = (k, v) => { const o = onceki.get(k); onceki.set(k, v); return v && !o; };
function girisOku() {
  const s = renderer.xr.getSession();
  if (s) for (const src of s.inputSources) {
    const gp = src.gamepad; if (!gp) continue;
    if (src.handedness === 'left') {
      if (kenar('ly', gp.buttons[5]?.pressed)) menuAcKapa();
      if (kenar('lg', gp.buttons[1]?.pressed)) masa.rotation.y += Math.PI;
    }
    if (src.handedness === 'right' && !MENU && kenar('ra', gp.buttons[4]?.pressed)) hizDegis();
  }
}

/* ---------- 👁 Maçı izle ve yönet (Champion maç motoru) ---------- */
function figurTemizle() { for (const f of figurler.values()) saha.remove(f); figurler.clear(); tabelaSon = ''; sonSkor = '0-0'; sonDurum = ''; }
async function izleYeniMac(sec = null) {
  izleYukle ||= import('./izle.js');
  const mod = await izleYukle; IZM = mod;

      sonOlayT = 4;

}

/* ---------- 🧑‍💼 teknik alan panosu (izle modu): masanın sana bakan kenarında; kumanda ışınıyla ya da fareyle tıklanır ---------- */
const panelC = document.createElement('canvas'); panelC.width = 1024; panelC.height = 560; const panelT = new THREE.CanvasTexture(panelC); panelT.colorSpace = THREE.SRGBColorSpace;

let BTN = [];
function panelCiz() {
  panel.visible = MOD === 'izle' && !!IZ && BASLADI;
  if (!panel.visible) return;
  const g = panelC.getContext('2d'), M = IZ.M, T = M.T[0]; BTN = [];
  g.clearRect(0, 0, 1024, 560); g.fillStyle = '#f6efdfee'; g.beginPath(); g.roundRect(6, 6, 1012, 548, 26); g.fill();
  g.fillStyle = '#1f3b3c'; g.beginPath(); g.roundRect(6, 6, 1012, 74, [26, 26, 0, 0]); g.fill();
