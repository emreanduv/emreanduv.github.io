*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{font-family:"Rubik",sans-serif;color:var(--gold)}

canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:auto}

 background:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 45% 85%,#fff5 50%,transparent 51%),linear-gradient(180deg,#1a2350,#101633 60%,#0a0e24)}

.tp-hac.on-yukari .b1{border-bottom-color:#fff3c0}.tp-hac.on-asagi .b2{border-top-color:#fff3c0}.tp-hac.on-sol .b3{border-right-color:#fff3c0}.tp-hac.on-sag .b4{border-left-color:#fff3c0}
.tp-dug{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform-origin:100% 0;
 background:radial-gradient(circle at 35% 30%,#4f78c8,var(--btn) 60%);border:3px solid var(--gold);box-shadow:0 5px 0 var(--btnD);color:#f3d48e;font:800 28px "Rubik",sans-serif}
.tp-dug.bas{transform:translateY(4px);box-shadow:0 1px 0 var(--btnD)}
.tp-menu{position:absolute;padding:8px 30px;border-radius:999px;background:#0a0e24;border:2px solid #3a4a80;color:var(--gold);font:800 15px "Rubik",sans-serif;letter-spacing:3px;box-shadow:0 4px 0 #04060f}
.tp-menu.bas{transform:translateY(3px);box-shadow:0 1px 0 #04060f}

<script>
(()=>{
'use strict';
let W=256,VH=240;const H=240,T=16,SC=3;
const $=id=>document.getElementById(id);
const cv=$('cv');cv.width=W*SC;cv.height=VH*SC;
let ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
const FONT='"Rubik",sans-serif';

/* ---------- kayıt ---------- */
let save={};try{save=JSON.parse(localStorage.getItem('gokalp_v1')||'{}')||{};}catch(e){save={};}
save=Object.assign({sound:true,rh:[],best:{},cleared:{}},save);
save.best=Object.assign({tk:0,ay:0,ul:0,yd:0,co:0,gg:0,kp:0},save.best);save.cleared=Object.assign({tk:false,ay:false,ul:false,yd:false,co:false,gg:false,kp:false},save.cleared);
function persist(){try{localStorage.setItem('gokalp_v1',JSON.stringify(save));}catch(e){}}

/* ---------- çizim yardımcıları ---------- */
const PAL={k:'#101018',s:'#f0b088',h:'#3a2414',r:'#c83a28',g:'#f0c040',b:'#2a4aa0',m:'#a8b8d0',w:'#f8f8f8',p:'#7a38b0',P:'#3e1a62'};
function polish(c){const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),d=id.data,o=new Uint8ClampedArray(d);
 const lum=i=>(o[i]*.3+o[i+1]*.59+o[i+2]*.11);const sol=(X,Y)=>{if(X<0||Y<0||X>=w||Y>=h)return false;const i=(Y*w+X)*4;return o[i+3]>0&&lum(i)>48;};
 for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++){const i=(Y*w+X)*4;if(!o[i+3]||lum(i)<=48)continue;let f=0;if(!sol(X,Y-1))f=.3;else if(!sol(X,Y+1)||!sol(X+1,Y))f=-.24;else if(!sol(X-1,Y))f=.12;
  if(f>0){d[i]+=(255-d[i])*f;d[i+1]+=(250-d[i+1])*f;d[i+2]+=(235-d[i+2])*f;}else if(f<0){d[i]*=1+f;d[i+1]*=1+f;d[i+2]*=1+f*.7;}}
 x.putImageData(id,0,0);return c;}
function mk(rows){const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const col=PAL[r[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}}});return polish(c);}
function flip(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function tile(fn){const c=document.createElement('canvas');c.width=c.height=16;fn(c.getContext('2d'));return c;}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function txt(s,x,y,col='#eef2fb',size=8,align='left',bold=false){ctx.font=(bold?'800 ':'500 ')+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#05081a';ctx.fillText(s,x+.7,y+.7);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textAlign='left';}

/* Kahraman: sivri miğfer, kırmızı kaftan, altın kuşak */
const TOP=["....kk","...kmmk","..kmmgmk",".kmmmgmmk",".kkkkkkkkk",".khhssssk",".khssskssk",".khsssssk","..kksssk","..kkrrrkk",".krrrgrrrk","krrrrgrrrsk","ksrrrgrrrsk","kskrrgrrkk",".kkrrgrrk",".kggggggk",".krrrrrrk"];
const LA=[".kbbbkbbk",".kbbbkbbk",".kbbk.kbbk",".kbbk.kbbk",".kkkk.kkkk","kkkkk.kkkkk"];
const LB=[".kbbbbbbk","kbbbk.kbbk","kbbk...kbbk","kbk.....kbk","kkk.....kkk","kkk.....kkkk"];
const LJ=[".kbbbbbbk","..kbbbbbk","..kbbk.kbbk",".kkk...kbbk",".kkk....kkk","........kkk"];
const HERO={};[['a',LA],['b',LB],['j',LJ]].forEach(([n,l])=>{const c=mk(TOP.concat(l));HERO[n]={1:c,'-1':flip(c)};});
const HEAD=mk(TOP.slice(0,9));
const GOLGE=mk(["...kkkkkk...","..kppppppk..",".kppppppppk.","kppwkppwkppk","kppkkppkkppk","kppppppppppk","kpppPPPPpppk","kppppppppppk",".kpkppkppkpk","..k.kk.kk.k."]);
const D1=mk(["....kkk...","...kwwwkg.","kkkwwwkwk.","kmmmmwwwk.",".kmmmmwwk.","..kkkkkk..","...k..k..."]);
const D2=mk(["..........","...kkkk...","...kwwwkg.","kkkwwwkwk.","kwwmmmwwk.",".kkkkwwwk.","...kkkkk.."]);
const DOVE={1:[D1,D2],'-1':[flip(D1),flip(D2)]};
const GLYPH=[["x...x","x...x",".x.x.","..x..","..x..","..x..","..x.."],["xxx..","x..x.","x...x","x..x.","xxx..","x....","x...."],["..x..",".x.x.","x...x","..x..","..x..",".x.x.","x...x"]];
function glyph(x,g,px,py,col){x.fillStyle=col;GLYPH[g].forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='x')x.fillRect(px+i,py+j,1,1);});}
const TILES={tk:{},ay:{}};
TILES.tk.fill=tile(x=>{x.fillStyle='#4a5878';x.fillRect(0,0,16,16);x.fillStyle='#2e3850';x.fillRect(0,7,16,1);x.fillRect(0,15,16,1);x.fillRect(0,0,1,7);x.fillRect(8,8,1,7);x.fillStyle='#6a7a9c';x.fillRect(1,0,6,1);x.fillRect(9,8,6,1);x.fillRect(1,0,1,6);x.fillRect(9,8,1,6);});
TILES.tk.top=tile(x=>{x.drawImage(TILES.tk.fill,0,0);x.fillStyle='#9fb0d2';x.fillRect(0,0,16,2);x.fillStyle='#2e3850';x.fillRect(0,2,16,1);});
TILES.tk.rune=tile(x=>{x.drawImage(TILES.tk.fill,0,0);glyph(x,1,5,4,'#c79a34');});
TILES.ay.fill=tile(x=>{x.fillStyle='#9a9eab';x.fillRect(0,0,16,16);const r=rnd(7);x.fillStyle='#80848f';for(let i=0;i<12;i++)x.fillRect(r()*16|0,r()*16|0,1,1);x.fillStyle='#b4b8c4';for(let i=0;i<8;i++)x.fillRect(r()*16|0,r()*16|0,1,1);});
TILES.ay.top=tile(x=>{x.drawImage(TILES.ay.fill,0,0);x.fillStyle='#e2e6ee';x.fillRect(0,0,16,2);x.fillStyle='#c4c8d2';x.fillRect(0,2,16,1);x.fillStyle='#80848f';x.fillRect(5,4,5,1);x.fillRect(4,5,1,2);x.fillRect(10,5,1,2);x.fillRect(5,7,5,1);});
TILES.ay.rune=TILES.ay.fill;
TILES.ul={};TILES.ul.fill=tile(x=>{x.fillStyle='#463664';x.fillRect(0,0,16,16);const r=rnd(11);x.fillStyle='#34284e';for(let i=0;i<14;i++)x.fillRect(r()*16|0,r()*16|0,2,1);x.fillStyle='#6a5a92';for(let i=0;i<8;i++)x.fillRect(r()*16|0,r()*16|0,1,1);});
TILES.ul.top=tile(x=>{x.drawImage(TILES.ul.fill,0,0);x.fillStyle='#d8d0ff';x.fillRect(0,0,16,2);x.fillStyle='#9a8ad0';x.fillRect(0,2,16,1);x.fillStyle='#ffffff';x.fillRect(3,0,2,1);x.fillRect(11,0,1,1);});
TILES.ul.rune=tile(x=>{x.drawImage(TILES.ul.fill,0,0);glyph(x,2,5,4,'#b8a8ff');});
