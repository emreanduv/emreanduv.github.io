name: wikidata deneme
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 araclar/kadro_turet.py > /tmp/cikti.txt 2>&1 || true
      - run: |
          git config user.name "Mr. Anduv! veri"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/d; cp /tmp/cikti.txt /tmp/d/; cp veri/cbm/v1/dunya.json /tmp/d/ 2>/dev/null || true
          git checkout --orphan deneme-cikti; git rm -rfq .; cp /tmp/d/* .; git add -A
          git commit -qm "deneme çıktısı"; git push -f origin deneme-cikti
