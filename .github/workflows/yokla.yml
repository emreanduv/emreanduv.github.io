name: Yoklama (geçici)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 araclar/yokla.py
      - run: |
          git config user.name "yokla"; git config user.email "actions@users.noreply.github.com"
          git checkout -B deneme-cikti && git add -f yokla.json && git commit -qm yokla && git push -qf origin deneme-cikti
