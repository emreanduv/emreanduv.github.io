name: Avrupa kupaları (lig aşaması fikstürü)
on:
  schedule:
    - cron: "17 5 * * *"     # her gün
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gercek-dunya
  cancel-in-progress: false
jobs:
  avrupa:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Avrupa fikstürü
        run: python3 araclar/avrupa.py
      - name: Değiştiyse gönder
        run: |
          git add veri/gercek-dunya araclar/onbellek_kulup.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "Mr. Anduv! veri"
          git config user.email "emreanduvart@gmail.com"
          git commit -qm "Avrupa kupaları fikstürü güncellendi"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
