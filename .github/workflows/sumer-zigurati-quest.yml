name: Sümer Ziguratı VR (Meta Quest APK)
# emreanduv.github.io/sumer-zigurati PWA'sını Meta'nın bubblewrap'iyle Quest uygulamasına (TWA, immersive) paketler.
# İmzasız APK + apksigner.jar "quest-sumer" dalına yazılır; imza anahtarı (sumer-zigurati-quest.jks) depoya girmez,
# Mac'te Sumerler klasöründeki vr-imzala.sh ile atılır. sumer-zigurati/ değişince kendiliğinden de çalışır (sürüm 1.0.0/1).
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Sürüm adı", default: "1.0.0" }
      version_code: { description: "Sürüm kodu", default: "1" }
  push:
    branches: [main]
    paths: ["sumer-zigurati/**", ".github/workflows/sumer-zigurati-quest.yml"]
permissions:
  contents: write
env:
  SURUM: ${{ inputs.version_name || '1.0.0' }}
  KOD: ${{ inputs.version_code || '1' }}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @meta-quest/bubblewrap-cli@1.24.1
      - name: Bubblewrap ayarları ve TWA tanımı
        run: |
          mkdir -p ~/.bubblewrap proje
          [ -e "$ANDROID_HOME/tools" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat > proje/twa-manifest.json <<JSON
          {
            "packageId": "com.anduv.sumerzigurati",
            "host": "emreanduv.github.io",
            "name": "Sümer Ziguratı",
            "launcherName": "Sümer Ziguratı",
            "display": "standalone",
            "themeColor": "#132545",
            "navigationColor": "#132545",
            "navigationColorDark": "#132545",
            "navigationDividerColor": "#132545",
            "navigationDividerColorDark": "#132545",
            "backgroundColor": "#070d1c",
            "enableNotifications": false,
            "startUrl": "/sumer-zigurati/index.html",
            "iconUrl": "https://emreanduv.github.io/sumer-zigurati/simge-512.png",
            "maskableIconUrl": "https://emreanduv.github.io/sumer-zigurati/simge-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersionName": "${SURUM}",
            "appVersionCode": ${KOD},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://emreanduv.github.io/sumer-zigurati/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": false,
            "isChromeOSOnly": false,
            "isMetaQuest": true,
            "horizonOSAppMode": "immersive",
            "fullScopeUrl": "https://emreanduv.github.io/sumer-zigurati/",
            "minSdkVersion": 29,
            "orientation": "landscape",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "${SURUM}"
          }
          JSON
      - name: Sitenin yayına çıkmasını bekle (Pages)
        run: |
          for i in $(seq 1 40); do
            curl -fsS https://emreanduv.github.io/sumer-zigurati/manifest.webmanifest >/dev/null && curl -fsS -o /dev/null https://emreanduv.github.io/sumer-zigurati/simge-512.png && { echo "site hazır"; exit 0; }
            sleep 15
          done
          echo "site 10 dakikada yayına çıkmadı"; exit 1
      - name: Projeyi üret ve imzasız derle
        working-directory: proje
        run: |
          (yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json) 2>&1 | tee /tmp/gunluk.txt || true
          (yes | bubblewrap build --skipSigning --manifest=./twa-manifest.json) 2>&1 | tee -a /tmp/gunluk.txt || true
          test -f app-release-unsigned-aligned.apk
      - name: quest-sumer dalına yaz (imzasız APK + apksigner)
        run: |
          mkdir -p /tmp/q && cd /tmp/q
          cp "$GITHUB_WORKSPACE/proje/app-release-unsigned-aligned.apk" "sumer-zigurati-${SURUM}-${KOD}-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" apksigner.jar
          cp /tmp/gunluk.txt gunluk.txt
          git init -q -b quest-sumer && git config user.name "Mr. Anduv!" && git config user.email emreanduvart@gmail.com
          git add . && git commit -qm "Sümer Ziguratı VR ${SURUM} (${KOD}) imzasız"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" quest-sumer
