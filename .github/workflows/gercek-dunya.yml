name: Gerçek Dünya verisi (açık kaynak)
on:
  schedule:
    - cron: "7,37 * * * *"   # yarım saatte bir: güncel haftalar
    - cron: "23 3 * * *"     # her gece: bütün sezon
  workflow_dispatch:
    inputs:
      tam:
        description: "Bütün sezonu yeniden çek"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: gercek-dunya
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Veriyi çek
        run: |
          if [ "${{ github.event.schedule }}" = "23 3 * * *" ] || [ "${{ inputs.tam }}" = "true" ]; then
            python3 araclar/gercek_dunya.py --tam
          else
            python3 araclar/gercek_dunya.py
          fi
      - name: Değiştiyse gönder
        run: |
          git add veri/gercek-dunya
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "Mr. Anduv! veri"
          git config user.email "emreanduvart@gmail.com"
          git commit -qm "Gerçek Dünya verisi güncellendi"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
