<title>Sofra</title>
<style>
:root{--bg1:#121b24;--bg2:#2b3a4a;--panel:#f3eedd;--panel2:#e9e2ca;--ink:#1f2a33;--muted:#6f6852;--h1:#4d6480;--h2:#2a3a4c;--acc:#e8a33d;--grn:#4f9a2f;--red:#b8372b;--blu:#2d7fc1;--line:#d2c9aa}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#1c2834}
body{font-family:Tahoma,Verdana,"Segoe UI",system-ui,sans-serif;font-size:13px;color:var(--ink);min-height:100vh;
background:radial-gradient(900px 500px at 15% -10%,rgba(98,140,180,.35),transparent 60%),radial-gradient(700px 400px at 100% 0,rgba(232,163,61,.12),transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #a89c76;border-radius:3px;background:#fffdf5;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-weight:bold;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 3px}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#41546a,#1c2834);border-bottom:2px solid #0b1117;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:bold;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-size:10px;color:#b9c8d6;font-weight:normal;letter-spacing:.08em;text-transform:uppercase}
.datenav{display:flex;align-items:center;gap:4px;margin-left:auto;background:rgba(0,0,0,.25);border:1px solid #0b1117;border-radius:4px;padding:2px}
.datenav button{background:none;border:0;color:#fff;font-weight:bold;padding:5px 9px}
.tdy{font-style:normal}
.datenav span{white-space:nowrap;color:#ffe7b8;font-weight:bold;min-width:120px;text-align:center;font-size:12px}
.devam{white-space:nowrap;background:linear-gradient(#86c95a,#3d7d20);border:1px solid #23500f;color:#fff;font-weight:bold;padding:8px 16px;border-radius:4px;text-shadow:0 1px 0 #1d3d0c;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.4);letter-spacing:.03em}
.devam:active{transform:translateY(1px)}
/* layout */
.wrap{display:flex;align-items:flex-start}
nav.side{width:200px;flex:none;position:sticky;top:56px;margin:12px 0 12px 12px;border:1px solid #0b1117;border-radius:3px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.nb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;background:linear-gradient(#35485c,#253443);color:#dfe7ef;border:0;border-bottom:1px solid #16202a;font-weight:bold}
.nb:hover{background:linear-gradient(#41566c,#2c3d4f)}
.nb.on{background:linear-gradient(#f8dc97,#e8a33d);color:#2a1d05}
.nb .dot{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px}
main{flex:1;min-width:0;padding:12px;display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
/* panels */
.panel{background:linear-gradient(#f7f3e6,var(--panel));border:1px solid #0b1117;border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.4);overflow:hidden}
.ph{background:linear-gradient(var(--h1),var(--h2));color:#fff;font-weight:bold;text-transform:uppercase;font-size:11px;letter-spacing:.07em;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #0b1117}
.ph .r{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.pb{padding:10px}
table.fm{width:100%;border-collapse:collapse}
table.fm th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:2px solid var(--line)}
table.fm td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.fm tr:nth-child(even) td{background:rgba(201,189,150,.22)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:11px}
.btn{background:linear-gradient(#fffcf2,#dcd2b3);border:1px solid #a1946c;border-radius:3px;padding:6px 10px;font-weight:bold;color:#2b2a22;box-shadow:inset 0 1px 0 #fff}
.btn:hover{filter:brightness(1.04)}
.btn.p{background:linear-gradient(#6589b0,#34506e);color:#fff;border-color:#1f344a;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn.g{background:linear-gradient(#86c95a,#3d7d20);color:#fff;border-color:#23500f;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.o{background:linear-gradient(#f8dc97,#e09530);color:#2a1d05;border-color:#9a6417}
.btn.x{background:none;border:0;box-shadow:none;color:var(--red);padding:2px 6px}
.btn.sm{padding:3px 7px;font-size:11px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attr{display:inline-block;min-width:26px;text-align:center;font-weight:bold;border-radius:2px;padding:2px 4px;color:#fff;font-size:12px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.form{display:inline-flex;gap:3px}
.form b{width:20px;height:20px;display:inline-grid;place-items:center;border-radius:2px;color:#fff;font-size:11px}
.bar{height:10px;background:#d8cfb2;border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bar>i{display:block;height:100%;border-radius:5px;transition:width .5s}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:bold;background:#ddd3b5;color:#3a3424;margin:2px 2px 0 0}
.chip.red{background:#f3c9c3;color:#7c1d13}
.chip.grn{background:#cfe7bf;color:#285214}
.chip.blu{background:#cbdff1;color:#1b4a73}
.msg{display:flex;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.msg:hover{background:rgba(232,163,61,.12)}
.msg.unread .mt{font-weight:bold}
.msg .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;background:linear-gradient(#5d7fa3,#2a3a4c);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sig{text-align:center;color:#c9d6e2;font-size:11px;letter-spacing:.08em;padding:14px 0 22px;opacity:.9}
.sig b{color:#ffd88a}
.empty{padding:16px;text-align:center;color:var(--muted)}
.cardsel{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #a89c76;border-radius:4px;background:#fffdf5;cursor:pointer}
.opt.on{border-color:#9a6417;background:#fbe9c4;box-shadow:0 0 0 2px rgba(232,163,61,.45)}
.opt input{width:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.checks label{display:flex;gap:6px;align-items:center;padding:7px;border:1px solid #c7bc98;border-radius:3px;background:#fffdf5;cursor:pointer;font-weight:bold;font-size:12px}
.checks input{width:auto}
.photo{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:3px;background:#fffaf0;margin-top:8px}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:3px;border:1px solid #a89c76;flex:none}
.meal-h{display:flex;align-items:center;gap:8px;font-weight:bold;padding:6px 0 4px;border-bottom:2px solid var(--line);margin-top:6px}
.meal-h .k{margin-left:auto;color:var(--muted);font-weight:bold}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,15,.72);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal .panel{width:min(640px,100%)}
.tipcard{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;max-width:520px;margin:0 auto;background:linear-gradient(#41546a,#1e2a36);color:#fff;border:1px solid #0b1117;border-left:4px solid var(--acc);border-radius:4px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.55);display:flex;gap:10px;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(#3a4b5d,#1e2a36);color:#ffe7b8;border:1px solid #0b1117;padding:10px 16px;border-radius:4px;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
/* start screens */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px}
.hero{text-align:center;color:#fff;margin-bottom:18px}
.hero h1{margin:8px 0 2px;font-size:34px;letter-spacing:.04em;text-shadow:0 0 18px rgba(232,163,61,.45),0 2px 0 #000}
.hero p{margin:0;color:#b9c8d6;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.tabs{display:flex;border-bottom:1px solid #0b1117}
.tabs button{flex:1;padding:11px;border:0;background:linear-gradient(#35485c,#253443);color:#dfe7ef;font-weight:bold;letter-spacing:.03em}
.tabs button.on{background:linear-gradient(#f8dc97,#e8a33d);color:#2a1d05}
.langbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #a89c76;border-radius:4px;background:linear-gradient(#fffcf2,#e5dcc0);font-weight:bold;font-size:15px;margin-bottom:8px}
.langbtn:hover{border-color:#9a6417;background:linear-gradient(#fff6df,#f3d697)}
.flag{width:34px;height:23px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.4);flex:none}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:3px;background:#d1c7a6}
.steps i.on{background:linear-gradient(90deg,#e8a33d,#f8dc97)}
.bigtarget{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bigtarget div{background:linear-gradient(#2f4256,#1e2b38);color:#fff;border-radius:3px;padding:10px;text-align:center;border:1px solid #0b1117}
.bigtarget b{display:block;font-size:22px;color:#ffd88a}
.bigtarget span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#b9c8d6}
.warn{background:#fbe3d0;border:1px solid #d9935a;color:#6b2f08;border-radius:3px;padding:8px 10px;margin-top:8px;font-size:12px}
.info{background:#dde9f4;border:1px solid #87a9c9;color:#183b5c;border-radius:3px;padding:8px 10px;margin-top:8px;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--h2);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.wave{animation:wave 3s linear infinite}
.glow{filter:drop-shadow(0 0 6px rgba(232,163,61,.55))}
@media (max-width:760px){
 .wrap{flex-direction:column;align-items:stretch}
 nav.side{position:sticky;top:52px;z-index:15;width:auto;margin:0;border-radius:0;display:flex;overflow-x:auto;scrollbar-width:none}
 nav.side::-webkit-scrollbar{display:none}
 .nb{width:auto;white-space:nowrap;border-bottom:0;border-right:1px solid #16202a;padding:10px 12px}
 main{padding:10px}
 .brand small{display:none}
 .datenav span{min-width:86px;font-size:11px}
 .tdy{display:none}
 .brand>div{font-size:13px}
 .devam{padding:8px 11px}
 .hero h1{font-size:28px}
}
</style>
</head>

async function initCloud(){
 if(!window.claude||!claude.use)return;
 try{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;const id=await user.id();if(!id)return;DB=db;UID=id;
  const col=DB.collection("data/users/"+id);
  const snap=await Promise.race([col.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
  let pulled=false;
  for(const d of snap.docs){const v=d.data();if(!v)continue;
   if(d.id==="main"){if((v.updatedAt||0)>(S.updatedAt||0)){const lang=S.lang;Object.assign(S,v);S.lang=lang;S.hlog=Object.assign({bp:[],glu:[],sleep:[],waist:[]},S.hlog||{});pulled=true;}}
   else if(d.id.startsWith("d-")){const k=d.id.slice(2);const loc=S.days[k];if(!loc||(v.updatedAt||0)>(loc.updatedAt||0)){S.days[k]=JSON.parse(JSON.stringify(v));pulled=true;}}}
  // yerelde daha yeni olanları buluta gönder
  const remote=new Set(snap.docs.map(d=>d.id));
  if(!remote.has("main")&&S.updatedAt)dirty.add("main");
  for(const k in S.days){if(!remote.has("d-"+k)&&S.days[k].updatedAt)dirty.add("d-"+k);}
  setCloud("cloud");
  if(pulled){yerelYaz(); if(U.screen==="app")render();}
  flush();
 }catch(e){setCloud("local");}
}

function bmiOf(w,h){return w/((h/100)**2);}

function curWeight(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:(S.profile?S.profile.weight:70);}
function targets(){
 const P=S.profile;const warn=[];
 if(!P){return{free:true,kcal:2000,bmr:0,base:2000,p:75,c:250,f:67,fib:25,water:2000,steps:8000,warn};}
 const w=curWeight(),h=P.height,a=P.age,fem=P.sex==="f";
 const bmr=10*w+6.25*h-5*a+(fem?-161:5);
 const job={desk:1.2,stand:1.3,phys:1.45}[P.job]||1.2;
 const base=bmr*job;
 let goal=P.goal,rate=P.rate||0.5;const bmi=bmiOf(w,h);
 if(goal==="lose"&&bmi<18.5){goal="keep";warn.push(L("BKİ'n 18,5'in altında: kilo vermek önerilmez, hedef 'kilomu koru' olarak ayarlandı.","Your BMI is below 18.5: weight loss isn't advised, goal set to maintain."));}
 if(P.preg==="preg"){if(goal==="lose")warn.push(L("Hamilelikte kalori açığı verilmez; hedef koruma moduna alındı. Ek ihtiyaç için doktorunu dinle.","No calorie deficit during pregnancy; goal set to maintain. Follow your doctor for extra needs."));goal="keep";}
 if(a<18&&goal==="lose"){goal="keep";warn.push(L("18 yaş altı için kalori açığı uygulanmaz.","No deficit is applied under 18."));}
 let delta=0;
 if(goal==="lose")delta=-rate*7700/7;else if(goal==="gain")delta=0.25*7700/7;
 if(P.preg==="bf"&&delta<-300){delta=-300;warn.push(L("Emzirirken açık en fazla ~300 kcal tutuldu.","While breastfeeding the deficit is capped at ~300 kcal."));}
 let kcal=base+delta;const floor=P.preg==="bf"?1800:(fem?1200:1500);
 if(kcal<floor){kcal=floor;if(goal==="lose")warn.push(L(`Günlük hedef güvenli alt sınıra (${floor} kcal) çekildi; bu yüzden kilo kaybı biraz daha yavaş olabilir.`,`Daily target raised to the safe floor (${floor} kcal), so loss may be a bit slower.`));}
 kcal=Math.round(kcal/10)*10;

 let pk=goal==="lose"?1.6:1.2;if((P.conds||[]).includes("kid")){pk=0.8;}
 const p=Math.min(Math.round(pk*refW),Math.round(kcal*0.3/4)),f=Math.round(kcal*0.3/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
 const fib=fem?25:30;

 return{free:false,kcal,bmr:Math.round(bmr),base:Math.round(base),p,c,f,fib,water,steps:P.stepGoal||8000,warn,goal,delta:Math.round(kcal-base)};
}
function stepKcal(steps){const P=S.profile;const h=P?P.height:165,fem=P?P.sex==="f":true,w=curWeight();const km=steps*h*(fem?0.413:0.415)/100/1000;return Math.round(km*w*0.5);}

function dayTotals(k){const d=day(k);let t={kcal:0,p:0,c:0,f:0,fib:0};for(const s of SLOTS)for(const it of d.meals[s[0]]){t.kcal+=it.kcal;t.p+=it.p;t.c+=it.c;t.f+=it.f;t.fib+=it.fib||0;}

function weekChart(k){const T=targets();const days=[];for(let i=6;i>=0;i--){const kk=addDays(k,-i);days.push([kk,dayTotals(kk).kcal]);}
 const W=520,H=170,mx=Math.max(T.kcal*1.3,...days.map(d=>d[1]))||1,bw=W/7;const y=v=>H-24-(v/mx)*(H-40);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:190px"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cb2e0"/><stop offset="1" stop-color="#2d5f8f"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a6c"/><stop offset="1" stop-color="#a5281b"/></linearGradient></defs>`;
 days.forEach(([kk,v],i)=>{const over=v>T.kcal*1.1;const x=i*bw+bw*0.22,bwid=bw*0.56,yy=y(v);s+=`<rect x="${x}" y="${yy}" width="${bwid}" height="${H-24-yy}" rx="3" fill="url(#${over?"bg2":"bg1"})"/>`;if(v)s+=`<text x="${x+bwid/2}" y="${yy-4}" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2a33">${r0(v)}</text>`;s+=`<text x="${x+bwid/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${kk===k?"#9a6417":"#6f6852"}" font-weight="${kk===k?"bold":"normal"}">${fmtDate(kk,1)}</text>`;});
 s+=`<line x1="0" x2="${W}" y1="${y(T.kcal)}" y2="${y(T.kcal)}" stroke="#e8a33d" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-4}" y="${y(T.kcal)-4}" text-anchor="end" font-size="10" font-weight="bold" fill="#9a6417">${L("Hedef","Target")} ${T.kcal}</text></svg>`;return s;}
function weightChart(){const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);if(ws.length<2)return `<div class="empty">${L("Grafik için en az 2 tartı kaydı gir.","Log at least 2 weigh-ins for the chart.")}</div>`;
 const W=560,H=200,pad=34;const tw=S.profile&&S.profile.targetW;const vals=ws.map(w=>w.kg).concat(tw?[tw]:[]);const mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
 const t0=pd(ws[0].d).getTime(),t1=pd(ws[ws.length-1].d).getTime()||t0+1;const x=d=>pad+(pd(d).getTime()-t0)/Math.max(1,t1-t0)*(W-pad-12),y=v=>12+(mx-v)/(mx-mn)*(H-40);
 const pts=ws.map(w=>[x(w.d),y(w.kg)]);const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8a33d" stop-opacity=".45"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${pad}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#d2c9aa"/><text x="${pad-4}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#6f6852">${r1(v)}</text>`;}
 s+=`<path d="${path} L${pts[pts.length-1][0]} ${H-28} L${pts[0][0]} ${H-28}Z" fill="url(#wa)"/><path d="${path}" fill="none" stroke="#c77a14" stroke-width="3" stroke-linejoin="round" class="glow"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#c77a14" stroke-width="2"/>`;});
 if(tw)s+=`<line x1="${pad}" x2="${W-10}" y1="${y(tw)}" y2="${y(tw)}" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-12}" y="${y(tw)-4}" text-anchor="end" font-size="10" font-weight="bold" fill="#2e7d32">${L("Hedef","Target")} ${tw} kg</text>`;
 s+=`<text x="${pad}" y="${H-10}" font-size="10" fill="#6f6852">${fmtDate(ws[0].d,1)}</text><text x="${W-10}" y="${H-10}" text-anchor="end" font-size="10" fill="#6f6852">${fmtDate(ws[ws.length-1].d,1)}</text></svg>`;return s;}

function orucGunu(k){const h=hic(k);if(!h)return null;const wd=pd(k).getDay();
 if((h.ay===10&&h.gun===1)||(h.ay===12&&h.gun>=10&&h.gun<=13))return{yasak:true,ad:L(h.ay===10?"Ramazan Bayramı":"Kurban Bayramı",h.ay===10?"Eid al-Fitr":"Eid al-Adha")};

 if(h.gun>=13&&h.gun<=15)n.push(L("Eyyâm-ı bîz (ayın 13-14-15'i)","White days (13th-15th)"));if(h.ay===10&&h.gun>=2)n.push(L("Şevval'de altı gün","Six days of Shawwal"));
 if(wd===1)n.push(L("Pazartesi","Monday"));if(wd===4)n.push(L("Perşembe","Thursday"));

async function pickPhoto(file,manual){if(!file)return;try{const img=await loadImg(file);if(!manual)PH.blob=await toBlob(img,1280,0.85);PH.thumb=await toDataURL(img,160,0.6);PH.pend=!!manual;document.getElementById("pprev").innerHTML=`<img src="${PH.thumb}" style="width:100%;max-height:${manual?160:260}px;object-fit:cover;border-radius:3px;border:1px solid #a89c76">`;const b=document.getElementById("pbtn");if(b)b.disabled=false;}catch(e){toast(L("Fotoğraf açılamadı","Couldn't open the photo"));}}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);};i.onerror=rej;i.src=u;});}
function drawScaled(img,max){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;}
function toBlob(img,max,q){return new Promise(r=>drawScaled(img,max).toBlob(b=>r(b),"image/jpeg",q));}
function toDataURL(img,max,q){const c=drawScaled(img,max);return Promise.resolve(c.toDataURL("image/jpeg",q));}
async function runPhoto(){const out=document.getElementById("pout"),btn=document.getElementById("pbtn");btn.disabled=true;out.innerHTML=`<div class="info"><span class="spin"></span> ${L("Koç tabağına bakıyor… (10–40 sn)","The coach is looking at your plate… (10–40 s)")}</div>`;
 PH.ctl=new AbortController();
 try{const r=await SAMPLE.json(analysisPrompt("photo",document.getElementById("pnote").value.trim()),{images:[PH.blob],signal:PH.ctl.signal});PH.ctl=null;showAnalysis(r,"photo",document.getElementById("pslot").value);}
 catch(e){PH.ctl=null;const m=aiErr(e);if(m&&document.getElementById("pout"))out.innerHTML=`<div class="warn">${m}</div>`;btn.disabled=false;}}

function showAnalysis(r,src,slot){const out=document.getElementById("pout");if(!out)return;
 if(!r||r.isFood===false||!Array.isArray(r.items)||!r.items.length){out.innerHTML=`<div class="warn">${L("Bu fotoğrafta yemek göremedim. Tabağın net göründüğü bir fotoğraf dener misin?","I couldn't see food here. Try a photo where the plate is clearly visible.")}</div>`;document.getElementById("pbtn").disabled=false;return;}
 const myAl=(S.profile&&S.profile.allergies)||[];const codes=(r.allergenCodes||[]).filter(c=>myAl.includes(c));
 PH.res={src,slot,comment:String(r.comment||""),score:Math.max(1,Math.min(10,+r.score||0))||null,tips:(r.tips||[]).slice(0,4).map(String),alw:(r.allergenWarnings||[]).slice(0,4).map(String),codes,
  items:r.items.slice(0,12).map(i=>{const g=+i.grams||0;return{name:String(i.name||"?"),g,base:g||100,kcal:+i.kcal||0,p:+i.protein||0,c:+i.carbs||0,f:+i.fat||0,fib:+i.fiber||0,conf:String(i.confidence||""),on:true};})};
 renderAnalysis();}
function renderAnalysis(){const R=PH.res,out=document.getElementById("pout");let tot=0;const rows=R.items.map((it,i)=>{const k=it.g/it.base;const kc=it.kcal*k;if(it.on)tot+=kc;return `<tr style="${it.on?"":"opacity:.45"}"><td><input type="checkbox" style="width:auto" ${it.on?"checked":""} onchange="PH.res.items[${i}].on=this.checked;renderAnalysis()"></td><td><b>${esc(it.name)}</b><div class="small muted">P ${r1(it.p*k)} · K ${r1(it.c*k)} · Y ${r1(it.f*k)}${it.conf?` · ${esc(it.conf)}`:""}</div></td><td style="width:78px"><input type="number" value="${r0(it.g)}" onchange="PH.res.items[${i}].g=+this.value||0;renderAnalysis()" style="padding:4px"></td><td class="num"><b>${r0(kc)}</b></td></tr>`;}).join("");
 out.innerHTML=`<table class="fm" style="margin-top:10px"><tr><th></th><th>${L("Besin","Food")}</th><th>g</th><th class="num">kcal</th></tr>${rows}<tr><td></td><td><b>${L("TOPLAM","TOTAL")}</b></td><td></td><td class="num"><b>${r0(tot)}</b></td></tr></table>
 <div class="photo">${PH.thumb?`<img src="${PH.thumb}">`:""}<div><div class="row"><b>${L("Koç yorumu","Coach's note")}</b>${R.score?`<span class="attr" style="background:${attrColor(R.score*2)}">${R.score}/10</span>`:""}</div><div class="small">${esc(R.comment)}</div>${R.tips.length?`<div class="small muted" style="margin-top:4px">💡 ${R.tips.map(esc).join(" · ")}</div>`:""}</div></div>
 ${R.alw.length||R.codes.length?`<div class="warn">⚠ ${R.alw.map(esc).join(" · ")||L("Alerjen içerik olabilir.","May contain allergens.")}</div>`:""}
 <div class="small muted" style="margin-top:6px">${L("Gramajları düzeltirsen kaloriler otomatik güncellenir.","Adjust grams and calories update automatically.")}</div>
 <button class="btn g" style="width:100%;margin-top:10px;padding:11px" onclick="confirmAnalysis()">${L("Öğüne ekle","Add to meal")} ✓</button>`;}
function confirmAnalysis(){const R=PH.res;const slot=document.getElementById("pslot").value;const pid=uid();
 const items=R.items.filter(i=>i.on).map(it=>{const k=it.g/it.base;return{id:uid(),name:it.name,g:it.g,kcal:it.kcal*k,p:it.p*k,c:it.c*k,f:it.f*k,fib:it.fib*k,src:R.src,pid,al:R.codes};});

 return `<div class="g2">${panel(L("Su takibi","Water tracker"),`<div class="row" style="justify-content:space-around">${bottle(d.water,wt)}<div class="kpi"><span class="small muted">${L("İÇİLEN","DRUNK")}</span><b>${(d.water/1000).toFixed(2)} L</b><span class="small muted">${L("Hedef","Target")}: ${(wt/1000).toFixed(1)} L</span><span class="small">${d.water>=wt?"🎉 "+L("Hedef tamam!","Goal reached!"):L(`${(wt-d.water)} ml kaldı`,`${wt-d.water} ml to go`)}</span></div></div>`)}
 ${panel(L("Hızlı ekle","Quick add"),`<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${cups.map(c=>`<button class="btn" style="padding:12px" onclick="addWater(${c[0]})"><div style="font-size:22px">${c[1]}</div>${c[2]}<div class="small muted">${c[0]} ml</div></button>`).join("")}</div>
 <div class="row" style="margin-top:10px"><input id="wc" type="number" placeholder="ml" style="width:100px"><button class="btn p" onclick="addWater(+document.getElementById('wc').value||0)">${L("Ekle","Add")}</button><button class="btn" onclick="undoWater()">↶ ${L("Sonuncuyu geri al","Undo last")}</button></div>
 <div class="small muted" style="margin-top:8px">${L("Hedef: kilo başına ~30 ml (EFSA referansına göre en az 1,6 L kadın / 2,0 L erkek), egzersiz saati başına +500 ml.","Target: ~30 ml per kg (EFSA-based minimum 1.6 L women / 2.0 L men), +500 ml per hour of exercise.")}</div>`)}</div>
 ${orucMu(U.date)?`<div class="info" style="margin:0">🌙 ${L("Oruçlu gün: suyunu iftardan sahura kadar içersin; hatırlatıcılar da bu aralıkta.","Fasting day: drink between iftar and suhoor; reminders follow this window.")}</div>`:""}
 ${panel(L("Bugünün kayıtları","Today's log"),d.wlog.length?`<table class="fm">${[...d.wlog].reverse().map(w=>`<tr><td>${new Date(w.t).toLocaleTimeString(S.lang==="en"?"en-GB":"tr-TR",{hour:"2-digit",minute:"2-digit"})}</td><td class="num">${w.ml} ml</td></tr>`).join("")}</table>`:`<div class="empty">${L("Henüz su kaydı yok","No water yet")}</div>`)}`;}
function addWater(ml){if(!(ml>0))return;const d=day(U.date);const was=d.water;d.water+=ml;d.wlog.push({t:Date.now(),ml});save(U.date);render();if(U.date===dk(new Date())&&was<waterTarget(U.date)&&d.water>=waterTarget(U.date)){scheduleNotifs();toast(L("💧 Günün su hedefi tamam! Bugünkü hatırlatıcılar sustu.","💧 Water goal reached! Today's reminders are off."));return;}toast(`💧 +${ml} ml`);}
function undoWater(){const d=day(U.date);const l=d.wlog.pop();if(l){d.water=Math.max(0,d.water-l.ml);save(U.date);render();}}

 return `<div class="g2">${panel(L("Adımlar","Steps"),`<div class="row" style="justify-content:space-around">${ring(d.steps,T.steps,170,"#9ad46a","#3d7d20",d.steps.toLocaleString("tr-TR"),"/ "+T.steps.toLocaleString("tr-TR"))}<div class="kpi"><span class="small muted">${L("ADIMLA YAKILAN","BURNED BY STEPS")}</span><b>${t.stk} kcal</b><span class="small muted">${L("~","~")}${r1(d.steps*(S.profile?S.profile.height:165)*0.414/100/1000)} km</span></div></div>
 <div class="row" style="margin-top:10px"><input id="stp" type="number" inputmode="numeric" placeholder="${L("Telefondaki adım sayısı","Steps from your phone")}" style="flex:1;min-width:150px"><button class="btn g" onclick="setSteps()">${L("Kaydet","Save")}</button></div>
 <div class="row" style="margin-top:6px"><button class="btn sm" onclick="addSteps(1000)">+1000</button><button class="btn sm" onclick="addSteps(2500)">+2500</button><button class="btn sm" onclick="addSteps(5000)">+5000</button></div>
 <div class="small muted" style="margin-top:8px">${L("Sağlık uygulamandaki günlük adım sayısını buraya yaz. Günlük temel harcaman zaten ilk ~4000 adımı kapsar; fazlası ayrıca hesaplanır.","Enter your phone's daily step count. Your base burn covers the first ~4000 steps; the rest counts extra.")}</div>`)}
 ${panel(L("Egzersiz ekle","Add workout"),`<label class="f">${L("Aktivite","Activity")}</label><select id="exs">${EX.map(e=>`<option value="${e[0]}">${L(e[1],e[2])} — MET ${e[3]}</option>`).join("")}</select>
 <label class="f">${L("Süre (dakika)","Duration (min)")}</label><div class="row"><input id="exm" type="number" value="30" style="width:100px"><button class="btn g" onclick="addEx()">${L("Ekle","Add")}</button></div>
 <div class="small muted" style="margin-top:8px">${L("Hesap: (MET − 1) × kilo × saat — dinlenme harcaması çıkarılmış net kalori. MET: 2011 Compendium of Physical Activities.","Formula: (MET − 1) × weight × hours — net of resting burn. MET: 2011 Compendium of Physical Activities.")}</div>`)}</div>
 ${panel(L("Bugünün egzersizleri","Today's workouts"),d.ex.length?`<table class="fm">${d.ex.map((e,i)=>`<tr><td><b>${esc(e.name)}</b><div class="small muted">${e.min} ${L("dk","min")}</div></td><td class="num"><b>${e.kcal}</b> kcal</td><td style="width:30px"><button class="btn x" onclick="delEx(${i})">✕</button></td></tr>`).join("")}<tr><td><b>${L("Toplam (adım dahil)","Total (incl. steps)")}</b></td><td class="num"><b>${t.act}</b> kcal</td><td></td></tr></table>`:`<div class="empty">${L("Henüz egzersiz yok","No workouts yet")}</div>`)}`;}
function setSteps(){const v=+document.getElementById("stp").value;if(!(v>=0))return;day(U.date).steps=Math.round(v);save(U.date);render();toast("👟 "+v);}
function addSteps(n){day(U.date).steps+=n;save(U.date);render();}
function addEx(){const id=document.getElementById("exs").value,m=+document.getElementById("exm").value;if(!(m>0))return;const e=EX.find(x=>x[0]===id);day(U.date).ex.push({id:e[0],name:L(e[1],e[2]),min:m,kcal:exKcal(e[3],m)});save(U.date);render();toast("🔥 +"+exKcal(e[3],m)+" kcal");}
function delEx(i){day(U.date).ex.splice(i,1);save(U.date);render();}

/* ---------- kilo ---------- */
function vWeight(){const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);const P=S.profile;const cur=ws.length?ws[ws.length-1].kg:null;const first=ws.length?ws[0].kg:null;
 let weekly="–";if(ws.length>=2){const days=(pd(ws[ws.length-1].d)-pd(ws[0].d))/864e5;if(days>=6)weekly=r1((cur-first)/days*7)+" kg/"+L("hafta","week");}
 const bmi=cur&&P?bmiOf(cur,P.height):null;
 return `<div class="g2">${panel(L("Tartı kaydı","Weigh-in"),`<div class="row"><input id="wkg" type="number" step="0.1" inputmode="decimal" placeholder="kg" style="width:110px" value="${cur?r1(cur):""}"><button class="btn g" onclick="addWeight()">${L("Kaydet","Save")} (${fmtDate(U.date,1)})</button></div><div class="small muted" style="margin-top:6px">${L("En doğru sonuç için haftada 1–2 kez, sabah aç karnına ve tuvaletten sonra tartıl.","For best accuracy, weigh 1–2× a week, mornings, before eating.")}</div>
 <table class="fm" style="margin-top:8px"><tr><td>${L("Güncel","Current")}</td><td class="num"><b>${cur?r1(cur)+" kg":"–"}</b></td></tr><tr><td>${L("Başlangıçtan beri","Since start")}</td><td class="num">${cur!=null?(cur-first>0?"+":"")+r1(cur-first)+" kg":"–"}</td></tr><tr><td>${L("Ortalama değişim","Average change")}</td><td class="num">${weekly}</td></tr>
 ${P&&P.targetW?`<tr><td>${L("Hedefe kalan","To target")}</td><td class="num">${cur?r1(cur-P.targetW)+" kg":"–"}</td></tr><tr><td>${L("Tahmini varış","Estimated arrival")}</td><td class="num">${cur&&P.goal==="lose"&&cur>P.targetW?eta(cur,P.targetW,targets()):"–"}</td></tr>`:""}
 ${bmi?`<tr><td>${L("BKİ","BMI")}</td><td class="num"><b>${r1(bmi)}</b> <span class="chip ${bmiCat(bmi)[1]}">${bmiCat(bmi)[0]}</span></td></tr>`:""}</table>`)}
 ${panel(L("Kilo grafiği","Weight chart"),weightChart())}</div>
 ${panel(L("Geçmiş","History"),ws.length?`<table class="fm">${[...ws].reverse().slice(0,30).map((w,i,arr)=>{const prev=arr[i+1];const df=prev?w.kg-prev.kg:0;return `<tr><td>${fmtDate(w.d)}</td><td class="num"><b>${r1(w.kg)} kg</b></td><td class="num" style="color:${df<0?"#2e7d32":df>0?"#b03a2e":"#6f6852"}">${prev?(df>0?"▲ +":df<0?"▼ ":"")+r1(df):""}</td><td style="width:30px"><button class="btn x" onclick="delWeight('${w.d}')">✕</button></td></tr>`;}).join("")}</table>`:`<div class="empty">${L("Henüz tartı kaydı yok","No weigh-ins yet")}</div>`)}`;}
function addWeight(){const v=+document.getElementById("wkg").value;if(!(v>=30&&v<=300)){toast(L("Geçerli bir kilo gir","Enter a valid weight"));return;}
 const prevKg=S.weights.length?curWeight():null;const e=S.weights.find(w=>w.d===U.date);if(e)e.kg=v;else S.weights.push({d:U.date,kg:v});
 const first=[...S.weights].sort((a,b)=>a.d<b.d?-1:1)[0].kg;const lost=first-v;
 if(prevKg!=null&&Math.floor(first-prevKg)<Math.floor(lost)&&lost>=1)pushMsg("🏆",L("Beslenme Koçu","Nutrition Coach"),L(`Tebrikler: ${Math.floor(lost)} kg geride kaldı!`,`Congrats: ${Math.floor(lost)} kg down!`),L("Sabırla ve dengeli ilerliyorsun. Protein ve suyu korumaya devam et; hızdan çok sürdürülebilirlik kazandırır.","Steady and balanced progress. Keep protein and water up; consistency beats speed."));
 if(S.profile&&S.profile.targetW&&v<=S.profile.targetW&&S.profile.goal==="lose")pushMsg("🎉",L("Beslenme Koçu","Nutrition Coach"),L("Hedef kiloya ulaştın!","Target weight reached!"),L("Muhteşem! Şimdi profilinden hedefini 'Koru' yaparak yeni kilonu sabitleyebilirsin.","Amazing! Switch your goal to 'Maintain' in your profile to hold it."));
 save();render();toast("⚖️ "+v+" kg");}
function delWeight(d){S.weights=S.weights.filter(w=>w.d!==d);save();render();}

/* ---------- sağlık ---------- */
function vHealth(){const P=S.profile;if(!P)return `${freeBanner()}${panel(L("Sağlık","Health"),`<div class="empty">${L("Sağlık takibi kişisel profil ister: boy, kilo, yaş, cinsiyet, alerjiler.","Health tracking needs a personal profile: height, weight, age, sex, allergies.")}<br><br><button class="btn o" onclick="newProfile()">${L("Programını kur","Set up your program")}</button></div>`)}`;
 const w=curWeight(),bmi=bmiOf(w,P.height);const fem=P.sex==="f";const waist=S.hlog.waist.length?S.hlog.waist[S.hlog.waist.length-1].cm:P.waist;
 const wRisk=waist?(waist>(fem?88:102)?[L("Yüksek risk","High risk"),"red"]:waist>(fem?80:94)?[L("Artmış risk","Increased risk"),""]:[L("Normal","Normal"),"grn"]):null;const whtr=waist?waist/P.height:null;
 const bp=S.hlog.bp.slice(-1)[0];const bpCat=bp?(bp.s>=140||bp.di>=90?[L("Hipertansiyon aralığı","Hypertension range"),"red"]:bp.s>=130||bp.di>=85?[L("Yüksek-normal","High-normal"),""]:bp.s>=120||bp.di>=80?[L("Normal","Normal"),"grn"]:[L("Optimal","Optimal"),"grn"]):null;
 const glu=S.hlog.glu.slice(-1)[0];const gluCat=glu?(glu.v>=126?[L("Diyabet aralığı (açlık)","Diabetes range (fasting)"),"red"]:glu.v>=100?[L("Bozulmuş açlık glukozu","Impaired fasting glucose"),""]:glu.v>=70?[L("Normal","Normal"),"grn"]:[L("Düşük","Low"),"red"]):null;
 const sl=S.hlog.sleep.slice(-7);const slAvg=sl.length?sl.reduce((a,x)=>a+x.h,0)/sl.length:null;
 const A=(P.allergies||[]).map(a=>L(ALLERG.find(x=>x[0]===a)?.[1],ALLERG.find(x=>x[0]===a)?.[2])).concat(P.allergyOther?[P.allergyOther]:[]);
 const row=(lab,val,cat)=>`<tr><td>${lab}</td><td class="num"><b>${val}</b> ${cat?`<span class="chip ${cat[1]}">${cat[0]}</span>`:""}</td></tr>`;
 return `<div class="g2">${panel(L("Sağlık özeti","Health summary"),`<table class="fm">${row(L("Vücut kitle indeksi","BMI"),r1(bmi),bmiCat(bmi))}${row(L("Bel çevresi","Waist"),waist?waist+" cm":"–",wRisk)}${row(L("Bel / boy oranı","Waist-to-height"),whtr?whtr.toFixed(2):"–",whtr?(whtr<0.5?[L("İyi (<0,5)","Good (<0.5)"),"grn"]:[L("Riskli (≥0,5)","At risk (≥0.5)"),"red"]):null)}${row(L("Son tansiyon","Last blood pressure"),bp?bp.s+"/"+bp.di:"–",bpCat)}${row(L("Son açlık şekeri","Last fasting glucose"),glu?glu.v+" mg/dL":"–",gluCat)}${row(L("Uyku (7 gün ort.)","Sleep (7-day avg)"),slAvg?r1(slAvg)+" "+L("saat","h"):"–",slAvg?(slAvg>=7&&slAvg<=9?[L("Önerilen aralık","Recommended"),"grn"]:[L("7–9 saat önerilir","7–9 h advised"),""]):null)}</table>
 <div class="row" style="margin-top:8px">${A.length?A.map(a=>`<span class="chip red">⚠ ${esc(a)}</span>`).join(""):`<span class="chip grn">${L("Kayıtlı alerji yok","No allergies on file")}</span>`}${(P.conds||[]).map(c=>`<span class="chip blu">${L(CONDS.find(x=>x[0]===c)?.[1],CONDS.find(x=>x[0]===c)?.[2])}</span>`).join("")}</div>`)}
 ${panel(L("Ölçüm ekle","Add measurement")+" · "+fmtDate(U.date,1),`<label class="f">${L("Tansiyon (büyük / küçük)","Blood pressure (sys / dia)")}</label><div class="row" style="flex-wrap:nowrap"><input id="bps" type="number" placeholder="120"><input id="bpd" type="number" placeholder="80"><button class="btn g" onclick="addBp()">＋</button></div>
 <label class="f">${L("Açlık kan şekeri (mg/dL)","Fasting glucose (mg/dL)")}</label><div class="row" style="flex-wrap:nowrap"><input id="glv" type="number" placeholder="90"><button class="btn g" onclick="addLog('glu','glv','v')">＋</button></div>
 <label class="f">${L("Uyku (saat)","Sleep (hours)")}</label><div class="row" style="flex-wrap:nowrap"><input id="slh" type="number" step="0.5" placeholder="7.5"><button class="btn g" onclick="addLog('sleep','slh','h')">＋</button></div>
 <label class="f">${L("Bel çevresi (cm)","Waist (cm)")}</label><div class="row" style="flex-wrap:nowrap"><input id="wsc" type="number" placeholder="80"><button class="btn g" onclick="addLog('waist','wsc','cm')">＋</button></div>`)}</div>
 ${panel(L("Son ölçümler","Recent measurements"),healthHistory())}
 <div class="small" style="color:#c9d6e2">${L("Eşikler: DSÖ (BKİ, bel çevresi), ESC/ESH (tansiyon), ADA (açlık glukozu). Bu uygulama tıbbi tanı koymaz; değerlerin aralık dışındaysa doktoruna danış.","Thresholds: WHO (BMI, waist), ESC/ESH (blood pressure), ADA (fasting glucose). This app doesn't diagnose; see your doctor if values are out of range.")}</div>`;}
function healthHistory(){const rows=[];for(const b of S.hlog.bp)rows.push([b.d,L("Tansiyon","Blood pressure"),b.s+"/"+b.di,"bp",b.id]);for(const g of S.hlog.glu)rows.push([g.d,L("Açlık şekeri","Glucose"),g.v+" mg/dL","glu",g.id]);for(const s of S.hlog.sleep)rows.push([s.d,L("Uyku","Sleep"),s.h+" "+L("sa","h"),"sleep",s.id]);for(const w of S.hlog.waist)rows.push([w.d,L("Bel","Waist"),w.cm+" cm","waist",w.id]);
 rows.sort((a,b)=>a[0]<b[0]?1:-1);return rows.length?`<table class="fm">${rows.slice(0,25).map(r=>`<tr><td>${fmtDate(r[0],1)}</td><td>${r[1]}</td><td class="num"><b>${r[2]}</b></td><td style="width:30px"><button class="btn x" onclick="delLog('${r[3]}','${r[4]}')">✕</button></td></tr>`).join("")}</table>`:`<div class="empty">${L("Henüz ölçüm yok","No measurements yet")}</div>`;}
function addBp(){const s=+document.getElementById("bps").value,di=+document.getElementById("bpd").value;if(!(s>60&&s<260&&di>30&&di<160)){toast(L("Geçerli değer gir","Enter valid values"));return;}upsertLog("bp",U.date,{s,di});save();render();}
function addLog(kind,inp,key){const v=+document.getElementById(inp).value;if(!(v>0))return;upsertLog(kind,U.date,{[key]:v});save();render();}
function delLog(kind,id){S.hlog[kind]=S.hlog[kind].filter(x=>x.id!==id);save();render();}

/* ---------- diyet listesi ---------- */
function vPlan(){const P=S.profile;if(!P)return `${freeBanner()}${panel(L("Diyet listesi","Diet plan"),`<div class="empty">${L("Kişisel diyet listesi için önce programını kur (alerji ve hedeflerin dikkate alınır).","Set up your program first for a personal plan (allergies and goals are used).")}<br><br><button class="btn o" onclick="newProfile()">${L("Programını kur","Set up your program")}</button></div>`)}`;
 const T=targets();const pl=S.plan;
 const ctrl=`<div class="row"><select id="pdays" style="width:auto"><option value="1">${L("1 günlük","1 day")}</option><option value="3" selected>${L("3 günlük","3 days")}</option><option value="7">${L("7 günlük","7 days")}</option></select>

 ${SAMPLE?`<button class="btn g" id="planbtn" onclick="genPlan()">✨ ${L("Claude ile hazırla","Create with Claude")}</button>`:""}<button class="btn" onclick="genPlanOffline()">⚡ ${L("Hızlı liste","Quick plan")}</button></div>
 <div class="small muted" style="margin-top:6px">${L(`Hedef ${T.kcal} kcal · protein ${T.p} g · alerjiler ve beslenme tarzın otomatik dikkate alınır.`,`Target ${T.kcal} kcal · protein ${T.p} g · your allergies and eating style are applied automatically.`)}</div><div id="planout"></div>`;

  return `<div class="meal-h">${sl[3]} ${esc(m.name||L(sl[1],sl[2]))}<span class="k">${r0(sk)} kcal</span><button class="btn sm" onclick="planToDay(${di},${mi})">＋ ${L("Bugüne","To today")}</button></div><table class="fm small">${(m.items||[]).map(i=>`<tr><td>${esc(i.name)} <span class="muted">${esc(i.amount||"")}${i.grams?" ("+r0(i.grams)+" g)":""}</span></td><td class="num">${r0(i.kcal)}</td></tr>`).join("")}</table>`;}).join(""))).join("");
  if((pl.notes||[]).length||(pl.shopping||[]).length)view+=`<div class="g2">${(pl.notes||[]).length?panel(L("Koç notları","Coach notes"),`<ul style="margin:0;padding-left:18px">${pl.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`):""}${(pl.shopping||[]).length?panel(L("Alışveriş listesi","Shopping list"),`<div>${pl.shopping.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div><button class="btn sm" style="margin-top:8px" onclick="copyShop()">📋 ${L("Kopyala","Copy")}</button>`):""}</div>`;}
 return panel(L("Diyet listesi oluştur","Create diet plan"),ctrl,pl?`<span class="small">${esc(pl.src==="ai"?"✨ Claude":"⚡ "+L("Hızlı","Quick"))} · ${new Date(pl.ts).toLocaleDateString(S.lang==="en"?"en-GB":"tr-TR")}</span>`:"")+view;}
function planPrompt(n,wish){const lang=S.lang==="en"?"English":"Türkçe";const T=targets();
 return `Sen deneyimli bir diyetisyensin. ${n} günlük, Türk mutfağına uygun, gerçekçi ve sürdürülebilir bir diyet listesi hazırla.
${profileCtx()}
Günlük hedef: ${T.kcal} kcal (±5%), protein ≈${T.p} g, karbonhidrat ≈${T.c} g, yağ ≈${T.f} g, lif ≥${T.fib} g.
Kurallar: alerjen içeren hiçbir besini koyma; beslenme tarzına ve sağlık durumlarına uy; sevmediklerini koyma; mevsimine uygun (Kasım: mandalina, portakal, ıspanak, pırasa, karnabahar, lahana, hamsi vb.) besinler kullan; porsiyonları ev ölçüsü ve gram olarak yaz; kalorileri USDA/TÜRKOMP değerlerine dayandır; günler birbirinden farklı olsun; 4 öğün (kahvaltı b, öğle l, akşam d, ara öğün s).
${wish?"Kullanıcının isteği: "+wish:""}
Tüm metinler ${lang}. Yalnızca şu JSON'u döndür, açıklama yazma:
{"days":[{"label":"1. Gün","meals":[{"slot":"b","name":"Kahvaltı","items":[{"name":"Haşlanmış yumurta","amount":"2 adet","grams":100,"kcal":155,"protein":13,"carbs":1,"fat":11}]}]}],"shopping":["yumurta"],"notes":["kısa ipucu"]}`;}

const COMBOS={b:[["yumurta","beyazpeynir","domates","salatalik","tamekmek","yesilzeytin"],["yulaf","sut","muz","ceviz"],["menemen","tamekmek","salatalik"],["suzme","cilek","yulaf","bal"],["lor","domates","tamekmek","yesilzeytin","yumurta"]],

 d:[["levrek","yesilsalata","patates"],["kofte","coban","yogurt"],["tazefasulye","yogurt","tamekmek"],["ispanak","yogurt","bulgur"],["somon","brokoli","kinoa"],["imam","bulgur","cacik"],["tavukgogus","brokoli","patates"]],
 s:[["elma","badem"],["kefir","mandalina"],["yogurt","ceviz"],["portakal","findik"],["muz","fistikezmesi"],["havuc","humus"]]};
function okFood(id){const f=FMAP[id];if(!f)return false;if(hasAllergen(f[11]).length||dietBlocks(f[11]))return false;const dis=norm((S.profile&&S.profile.dislikes)||"");if(dis&&dis.split(/[,;]+/).map(s=>s.trim()).filter(Boolean).some(x=>norm(f[1]).includes(x)))return false;return true;}
function genPlanOffline(){const n=+document.getElementById("pdays").value;const T=targets();const share={b:0.25,l:0.35,d:0.3,s:0.1};const days=[];
 for(let di=0;di<n;di++){const meals=[];for(const s of SLOTS){const k=s[0];let pool=COMBOS[k].map(c=>c.filter(okFood)).filter(c=>c.length>=2);if(!pool.length)pool=[FOODS.filter(f=>okFood(f[0])&&f[3]<200).slice(0,3).map(f=>f[0])];
  const combo=pool[(di+(k==="l"?1:k==="d"?2:0))%pool.length];const base=combo.reduce((a,id)=>a+FMAP[id][3]*FMAP[id][8]/100,0)||1;const fac=Math.max(0.5,Math.min(1.8,T.kcal*share[k]/base));
  meals.push({slot:k,name:L(s[1],s[2]),items:combo.map(id=>{const f=FMAP[id];const gr=f[8]*fac;const kk=gr/100;return{name:fname(f),amount:"",grams:Math.round(gr/5)*5,kcal:f[3]*kk,protein:f[4]*kk,carbs:f[5]*kk,fat:f[6]*kk};})});}
  days.push({label:`${di+1}. ${L("Gün","Day")}`,meals});}
 S.plan={src:"quick",ts:Date.now(),days,shopping:[],notes:[L("Hızlı liste hazır kombinasyonlardan oluşturuldu; daha çeşitli ve kişisel liste için 'Claude ile hazırla'yı kullan.","Quick plan built from preset combos; use 'Create with Claude' for a richer personal plan.")]};save();render();}
function planToDay(di,mi){const m=S.plan.days[di].meals[mi];const slot=SLOTS.some(s=>s[0]===m.slot)?m.slot:"s";const items=(m.items||[]).map(i=>({id:uid(),name:i.name+(i.amount?` (${i.amount})`:""),g:i.grams||0,kcal:+i.kcal||0,p:+i.protein||0,c:+i.carbs||0,f:+i.fat||0,fib:0,src:"plan"}));
 const d=day(U.date);d.meals[slot].push(...items);save(U.date);render();toast(L("Öğün güne eklendi","Meal added to the day"));}

function devam(){const k=U.date,T=targets(),t=dayTotals(k),a=attrs(k);const wt=waterTarget(k);
 if(!t.kcal&&!t.water&&!t.steps&&!day(k).ex.length){toast(L("Bu gün için henüz kayıt yok","Nothing logged for this day yet"));return;}
 const budget=T.kcal+Math.round(t.act*0.5);const lines=[];
 lines.push(L(`Kalori: ${r0(t.kcal)} / ${budget} kcal (hareket bonusu dahil).`,`Calories: ${r0(t.kcal)} / ${budget} kcal (incl. activity bonus).`));
 if(t.kcal<budget*0.75&&t.kcal>0)lines.push(L("⚠ Hedefinin epey altında kaldın. Çok düşük kalori kas kaybına ve yorgunluğa yol açar; yarın öğünleri atlamamaya çalış.","⚠ Well under target. Very low intake costs muscle and energy; try not to skip meals tomorrow."));
 else if(t.kcal>budget*1.1)lines.push(L("Hedefin biraz üstündesin — sorun değil, tek gün sonucu belirlemez. Yarın sebze ve proteini öne al.","A bit over target — no problem, one day doesn't decide it. Lead with veggies and protein tomorrow."));
 else lines.push(L("✓ Kalori hedefine uyumlu bir gün.","✓ On target with calories."));
 lines.push(L(`Protein: ${r0(t.p)} / ${T.p} g ${t.p>=T.p*0.8?"✓":"— yumurta, yoğurt, baklagil veya tavukla artırabilirsin."}`,`Protein: ${r0(t.p)} / ${T.p} g ${t.p>=T.p*0.8?"✓":"— boost with eggs, yogurt, legumes or chicken."}`));
 lines.push(L(`Lif: ${r0(t.fib)} / ${T.fib} g ${t.fib>=T.fib*0.8?"✓":"— sebze, meyve ve tam tahıl ekle."}`,`Fiber: ${r0(t.fib)} / ${T.fib} g ${t.fib>=T.fib*0.8?"✓":"— add veg, fruit, whole grains."}`));
 lines.push(L(`Su: ${(t.water/1000).toFixed(2)} / ${(wt/1000).toFixed(1)} L ${t.water>=wt?"✓":""}`,`Water: ${(t.water/1000).toFixed(2)} / ${(wt/1000).toFixed(1)} L ${t.water>=wt?"✓":""}`));
 lines.push(L(`Hareket: ${t.steps.toLocaleString("tr-TR")} adım, ${t.exm} dk egzersiz, ${t.act} kcal.`,`Activity: ${t.steps.toLocaleString("en-GB")} steps, ${t.exm} min workout, ${t.act} kcal.`));
 const res=dayResult(k);lines.push("");lines.push(L(`Günün sonucu: ${res==="G"?"GALİBİYET 🏆":res==="B"?"BERABERLİK 🤝":"MAĞLUBİYET — yarın rövanş!"}`,`Day result: ${res==="G"?"WIN 🏆":res==="B"?"DRAW 🤝":"LOSS — rematch tomorrow!"}`));
 lines.push(L(`Puanlar — Kalori ${a.kc} · Protein ${a.pr} · Lif ${a.fb} · Su ${a.wa} · Hareket ${a.mv}`,`Ratings — Calories ${a.kc} · Protein ${a.pr} · Fiber ${a.fb} · Water ${a.wa} · Movement ${a.mv}`));
 S.inbox=S.inbox.filter(m=>m.report!==k);
 pushMsg("📊",L("Beslenme Koçu","Nutrition Coach"),L(`Gün raporu — ${fmtDate(k)}`,`Day report — ${fmtDate(k)}`),lines.join("\n"),{report:k});save();
 const today=dk(new Date());if(k<today)U.date=addDays(k,1);

const TIPS={ov:["Genel Bakış: halka günün kalori dengesini gösterir. Ramazan'da ve nafile oruç günlerinde Oruç kartı çıkar; iftara kalan süre ve su planı orada. Akşam 'Devam'a basınca gün raporun gelir.","Overview: the ring shows today's calorie balance. In Ramadan and on voluntary fasting days a Fasting card shows time to iftar and your water plan. Press 'Continue' in the evening for your day report."],
 meals:["Öğünler: besin ara, paketli ürünü barkodla ekle, fotoğraf çek ya da elle gir. Oruçlu günlerde öğünler Sahur ve İftar olur. Yanlış eklediğini ✕ ile silebilirsin.","Meals: search foods, add packaged products by barcode, take a photo or enter manually. On fasting days meals become Suhoor and Iftar. Remove mistakes with ✕."],
 water:["Su: her bardakta ilgili düğmeye dokun. Hedefin kilona ve egzersizine göre ayarlanır.","Water: tap a button for each glass. Your target follows your weight and workouts."],
 move:["Hareket: telefonundaki günlük adım sayısını gir, egzersizlerini dakikasıyla ekle.","Activity: enter your phone's step count and add workouts with minutes."],
 weight:["Kilo: haftada 1–2 kez, sabah aç karnına tartılıp gir; grafik ve hedef tarihi buna göre çıkar.","Weight: weigh in 1–2× a week in the morning; the chart and target date follow."],
 health:["Sağlık: tansiyon, açlık şekeri, uyku ve bel ölçünü kaydet; değerler bilinen eşiklere göre işaretlenir.","Health: log blood pressure, glucose, sleep and waist; values are marked against standard thresholds."],
 plan:["Diyet Listesi: alerjilerine ve hedefine uygun liste hazırlar; öğünü '+ Bugüne' ile güne eklersin.","Diet Plan: builds a plan around your allergies and goal; add a meal to today with '+ To today'."],
 inbox:["Gelen Kutusu: gün raporların, kilo başarıların ve alerjen uyarıların burada.","Inbox: your day reports, milestones and allergen warnings live here."]};
function tipsSeen(){try{return JSON.parse(localStorage.getItem(LS+".tips")||"{}");}catch(e){return {};}}
function coachTick(tab){if(U.screen!=="app")return;const seen=tipsSeen();const t=TIPS[tab];const el=document.getElementById("tip");if(!t||seen[tab]){el.innerHTML="";return;}
 el.innerHTML=`<div class="tipcard"><div style="font-size:20px">💡</div><div style="flex:1"><div class="small">${esc(L(t[0],t[1]))}</div></div><button class="btn sm o" onclick="tipOk('${tab}')">${L("Anladım","Got it")}</button></div>`;}
function tipOk(tab){const s=tipsSeen();s[tab]=1;try{localStorage.setItem(LS+".tips",JSON.stringify(s));}catch(e){}document.getElementById("tip").innerHTML="";}
function openHelp(){openModal("❔ "+L("Nasıl kullanılır","How to use"),`<table class="fm">${Object.keys(TIPS).map(k=>{const t=TABS.find(x=>x[0]===k);return `<tr><td style="width:34px;font-size:18px">${t[1]}</td><td><b>${L(t[2],t[3])}</b><div class="small">${esc(L(TIPS[k][0],TIPS[k][1]))}</div></td></tr>`;}).join("")}</table>
 <div class="small muted" style="margin-top:8px">${L("Klavye: ← → ya da A / D ile gün değiştir, Enter ile Devam.","Keyboard: ← → or A / D to change day, Enter for Continue.")}</div>
 <button class="btn" style="margin-top:10px" onclick="try{localStorage.removeItem(LS+'.tips')}catch(e){};closeModal();coachTick(U.tab)">↺ ${L("Rehberi baştan göster","Show the guide again")}</button>`);}
addEventListener("keydown",e=>{if(U.screen!=="app"||/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||""))return;if(["ArrowLeft","KeyA"].includes(e.code))shiftDate(-1);if(["ArrowRight",'KeyD'].includes(e.code))shiftDate(1);if(e.code==="Enter")devam();if(e.code==="Escape")closeModal();});

/* ================= HATIRLATICILAR: su + motivasyon (yerel bildirim, @capacitor/local-notifications, ücretsiz/açık kaynak) =================
 iOS en fazla 64 bekleyen bildirim tutar: önümüzdeki 6 gün için tek seferlik bildirimler kurulur, uygulama her açıldığında yenilenir.
 Günün su hedefi tamamlanınca o günün kalan su hatırlatıcıları iptal edilir. */
const NOTIF_DEF={water:true,wEvery:2,wFrom:9,wTo:21,moti:true,mHour:11};
function NS(){S.notif=Object.assign({},NOTIF_DEF,S.notif||{});return S.notif;}
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const WATER_MSG=[["Bir bardak su vakti 💧","Vücudun teşekkür edecek. Bir bardak su iç, Sofra'ya ekle."],["Su molası 💧","Masadan kalk, bir bardak su iç; zihnin de tazelensin."],["Susuzluk açlık gibi hissedilebilir","Atıştırmadan önce bir bardak su dene."],["Hedefe bir bardak daha yaklaş 💧","Su şişeni doldurma zamanı."],["Küçük yudum, büyük fark","Gün içine yayılan su, enerjini dengede tutar."],["Su içtin mi? 💧","İçtiysen Sofra'da işaretle, içmediysen tam zamanı."],["Bir bardak su = bir adım","Bugünkü su hedefin seni bekliyor."]];
const WATER_MSG_EN=[["Time for a glass of water 💧","Your body will thank you. Drink a glass and log it."],["Water break 💧","Stand up, drink a glass of water, refresh your mind."],["Thirst can feel like hunger","Try a glass of water before snacking."],["One glass closer 💧","Time to refill your bottle."],["Small sips, big difference","Water spread through the day keeps your energy steady."],["Had water yet? 💧","Log it in Sofra — or drink one now."],["One glass = one step","Today's water goal is waiting."]];
const MOTI_MSG=[["Bugün de buradasın 🌱","Mükemmel gün yok, istikrarlı gün var. Bugünün ilk öğününü ekle."],["Küçük adımlar","Haftada yarım kilo, bir yılda 26 kilo eder. Acele yok, devam var."],["Tabağını renklendir 🥗","Bugün öğünlerinden birine bir avuç sebze ekle."],["Yürüyüş zamanı 👟","10 dakikalık bir yürüyüş bile günün dengesini değiştirir."],["Dün dünde kaldı","Dün nasıl geçtiyse geçti; bugün yeni bir maç."],["Protein unutulmasın","Yumurta, yoğurt, baklagil ya da tavuk: tok tutar, kası korur."],["Kendine iyi davran 💛","Hedefin ceza değil, kendine gösterdiğin özen."],["Akşam Devam'a bas","Gün sonunda raporuna bak, yarının planını kur."],["Uyku da diyetin parçası 🌙","7–9 saat uyku iştahı ve enerjiyi dengeler."],["Yavaş ye","Doyduğunu fark etmek 20 dakika sürer; çatalı ara ara bırak."],["Tartı her şey değil","Bel ölçün, enerjin ve uykun da ilerlemeni gösterir."],["Merdiveni seç 🏃","Bugün bir kez asansör yerine merdiven."],["Seninle gurur duyuyoruz","Buraya kadar gelen her gün sayılır. Devam!"],["Hafta sonu da hafta","Keyif yap ama tabağını yine Sofra'ya ekle."]];
const MOTI_MSG_EN=[["You're here again 🌱","No perfect days, just consistent ones. Log your first meal."],["Small steps","Half a kilo a week is 26 kilos a year. No rush, just keep going."],["Color your plate 🥗","Add a handful of vegetables to one meal today."],["Walk time 👟","Even a 10-minute walk shifts the day's balance."],["Yesterday is done","Whatever happened yesterday, today is a new match."],["Don't forget protein","Eggs, yogurt, legumes or chicken: keeps you full, protects muscle."],["Be kind to yourself 💛","Your goal isn't a punishment; it's self-care."],["Press Continue tonight","Check your day report and plan tomorrow."],["Sleep is part of the diet 🌙","7–9 hours of sleep balances appetite and energy."],["Eat slowly","It takes 20 minutes to feel full; put your fork down now and then."],["The scale isn't everything","Waist, energy and sleep show progress too."],["Take the stairs 🏃","Once today, stairs instead of the lift."],["Proud of you","Every day you showed up counts. Keep going!"],["Weekends are days too","Enjoy, but still log your plate in Sofra."]];
function hashDay(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function buildNotifs(){const N=NS(),out=[];const now=new Date();const today=dk(now);const nm=S.profile&&S.profile.name?S.profile.name.split(" ")[0]:"";
 for(let d=0;d<3;d++){const k=addDays(today,d);const base=pd(k);const h=hashDay(k);
  if(N.water){const done=d===0&&day(today).water>=waterTarget(today);if(!done){const W=S.lang==="en"?WATER_MSG_EN:WATER_MSG;let i=0;
   const oruc=orucMu(k),v=oruc?vakitOf(k):null,vy=oruc?vakitOf(addDays(k,1)):null;
   const anlar=[];if(oruc&&v&&vy){for(let t=v.aksam.getTime()+20*60000;t<=vy.imsak.getTime()-30*60000;t+=N.wEvery*3600000)anlar.push(new Date(t));}else if(!oruc){for(let t=N.wFrom;t<=N.wTo+0.01;t+=N.wEvery){const at=new Date(base);at.setHours(Math.floor(t),Math.round((t%1)*60),0,0);anlar.push(at);}}
   for(const at of anlar){if(at<=now)continue;const m=oruc?(S.lang==="en"?["Water between iftar and suhoor 💧","One glass now keeps tomorrow's fast easier."]:["İftar ile sahur arası su 💧","Şimdi bir bardak, yarınki orucu kolaylaştırır."]):W[(h+i)%W.length];i++;
    out.push({id:100000+d*100+i,title:m[0],body:m[1],schedule:{at,allowWhileIdle:true},extra:{kind:"water",d:k}});}}}
  if(N.moti){const M=S.lang==="en"?MOTI_MSG_EN:MOTI_MSG;const m=M[(h>>3)%M.length];const at=new Date(base);at.setHours(N.mHour,(h%4)*10,0,0);
   if(at>now)out.push({id:200000+d,title:(nm&&d%2===0?nm+", ":"")+m[0],body:m[1],schedule:{at,allowWhileIdle:true},extra:{kind:"moti",d:k}});}}
 return out.slice(0,24);} /* iOS 64 bildirim sınırını Yaşam Rehberi'nin vakit bildirimleriyle paylaşır */
let notifBusy=false;
async function scheduleNotifs(){const P=LN();if(!P||!CAP()||notifBusy)return;notifBusy=true;
 try{const pend=await P.getPending();const biz=((pend&&pend.notifications)||[]).filter(n=>n.id>=100000&&n.id<300000);if(biz.length)await P.cancel({notifications:biz.map(n=>({id:n.id}))});
  const N=NS();if(!N.water&&!N.moti)return;const perm=await P.checkPermissions();if(perm.display!=="granted")return;
  const list=buildNotifs();if(list.length)await P.schedule({notifications:list});}
 catch(e){}finally{notifBusy=false;}}
async function askNotifs(){const P=LN();if(!P||!CAP()){toast(L("Bildirimler mağaza sürümünde çalışır","Notifications work in the store app"));return false;}
 try{let perm=await P.checkPermissions();if(perm.display!=="granted")perm=await P.requestPermissions();S.notifAsked=1;save();
  if(perm.display==="granted"){await scheduleNotifs();toast(L("Hatırlatıcılar açık 🔔","Reminders on 🔔"));render();return true;}
  toast(L("İzin verilmedi; Ayarlar → Bildirimler → Yaşam Rehberi'nden açabilirsin.","Not allowed; enable in Settings → Notifications → Yaşam Rehberi."));return false;}catch(e){return false;}}
function setNotif(k,v){NS()[k]=v;save();scheduleNotifs();render();}
function notifPanel(){const N=NS();const hrs=a=>Array.from({length:17},(_,i)=>i+6).map(h=>`<option value="${h}" ${h===a?"selected":""}>${String(h).padStart(2,"0")}:00</option>`).join("");
 return panel("🔔 "+L("Hatırlatıcılar","Reminders"),`${CAP()?"":`<div class="info" style="margin:0 0 8px">${L("Bildirimler telefona kurulan mağaza sürümünde çalışır; burada ayarlarını hazırlayabilirsin.","Notifications run in the installed store app; you can set them up here.")}</div>`}
 <label class="checks" style="display:block"><label><input type="checkbox" ${N.water?"checked":""} onchange="setNotif('water',this.checked)">💧 ${L("Su iç hatırlatıcıları","Drink water reminders")}</label></label>
 <div class="g3" style="margin-top:6px"><div><label class="f">${L("Sıklık","Every")}</label><select onchange="setNotif('wEvery',+this.value)">${[1,1.5,2,3].map(v=>`<option value="${v}" ${v===N.wEvery?"selected":""}>${String(v).replace(".",",")} ${L("saatte bir","hours")}</option>`).join("")}</select></div>
 <div><label class="f">${L("Başlangıç","From")}</label><select onchange="setNotif('wFrom',+this.value)">${hrs(N.wFrom)}</select></div><div><label class="f">${L("Bitiş","Until")}</label><select onchange="setNotif('wTo',+this.value)">${hrs(N.wTo)}</select></div></div>
 <div class="small muted" style="margin-top:4px">${L("Günün su hedefi tamamlanınca o günün kalan hatırlatıcıları susar.","Once today's water goal is reached, the rest of today's reminders stop.")}</div>
 <label class="checks" style="display:block;margin-top:10px"><label><input type="checkbox" ${N.moti?"checked":""} onchange="setNotif('moti',this.checked)">🌱 ${L("Günlük motivasyon mesajı","Daily motivation message")}</label></label>
 <div style="max-width:200px"><label class="f">${L("Saat","Time")}</label><select onchange="setNotif('mHour',+this.value)">${hrs(N.mHour)}</select></div>
 ${CAP()?`<button class="btn p" style="margin-top:10px" onclick="askNotifs()">🔔 ${L("Bildirim iznini kontrol et","Check notification permission")}</button>`:""}`);}
function notifIntro(){if(!CAP()||S.notifAsked||!LN())return;S.notifAsked=1;save();
 openModal("🔔 "+L("Hatırlatıcılar","Reminders"),`<p style="margin-top:0">${L("Gün içinde su içmeni hatırlatalım ve ara sıra motive edici bir mesaj gönderelim mi?","Shall we remind you to drink water during the day and send an encouraging note now and then?")}</p>
 <ul style="margin:0 0 10px;padding-left:18px;line-height:1.6"><li>💧 ${L("09:00–21:00 arası 2 saatte bir su (ayarlanabilir)","Water every 2 hours, 09:00–21:00 (adjustable)")}</li><li>🌱 ${L("Günde bir motivasyon mesajı","One motivation message a day")}</li></ul>
 <div class="row"><button class="btn g" onclick="closeModal();askNotifs()">${L("Evet, aç","Yes, turn on")}</button><button class="btn" onclick="closeModal();setNotif('water',false);setNotif('moti',false)">${L("Şimdi değil","Not now")}</button></div>
 <div class="small muted" style="margin-top:8px">${L("Profil → Hatırlatıcılar'dan istediğin zaman değiştirebilirsin.","Change any time in Profile → Reminders.")}</div>`);}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleNotifs();});
setTimeout(()=>{const P=LN();if(P&&CAP()){scheduleNotifs();try{P.addListener("localNotificationActionPerformed",a=>{const k=a&&a.notification&&a.notification.extra&&a.notification.extra.kind;if(U.screen==="app"&&k==="water")go("water");});}catch(e){}}},1500);
