/* Layout: Malazgirt çizgisinde sade oyun menüsü — ortada logo, altta büyük altın düğme ve iki yan düğme; alt ekranlarda üst bar + geri. Zemin çim şeritleri. */

.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(14px + var(--safe-t)) max(16px,env(safe-area-inset-right,0px)) calc(18px + var(--safe-b)) max(16px,env(safe-area-inset-left,0px));gap:14px;max-width:620px;margin:0 auto}

.stars{color:#e0a020;letter-spacing:-1px;font-size:11px}
.sticky{position:sticky;bottom:calc(10px + var(--safe-b));width:100%;max-width:440px;z-index:5}
/* tablo */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:800;text-align:left;padding:4px 5px;white-space:nowrap;border-bottom:2px solid #eadfc6}

.pts{font-weight:900}
tr.z1 td:first-child{box-shadow:inset 4px 0 var(--gold)} tr.z4 td:first-child{box-shadow:inset 4px 0 var(--navy)} tr.zd td:first-child{box-shadow:inset 4px 0 var(--red)}

function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

function shade(h,f){const[r,g,b]=hexRgb(h);const m=v=>clamp(Math.round(f<0?v*(1+f):v+(255-v)*f),0,255);return'#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}

const NUMS=[1,3,5,4,2,9,6,8,7,10,11]; /* 4-2-3-1: sol bek 3, stoperler 5-4, sağ bek 2, ikinci forvet 9, 6, 8, sağ açık 7, 10, santrfor 11 */
function squad(t){
  if(t.kadro&&t.kadro.length===11){const R=rng(hashStr(t.id+'yuz'));return t.kadro.map(([no,n,k],i)=>({id:t.id+'-'+i,n,no:+no||NUMS[i],pos:POS[i],st:k?clamp(k/100,.4,1):1,skin:['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b','#f5d6b8'][Math.floor(R()*5)],hair:['#2a1a10','#4a2e1a','#1a1a1a','#7a4a20','#c8a050'][Math.floor(R()*5)]}))} /* CBM 4: gerçek ilk 11 */
  const L=LEAGUES[t.lg],R=rng(hashStr(t.lg+t.id+'kadro')),used=new Set(),out=[];
  for(let i=0;i<11;i++){let n;do{n=L.fn[Math.floor(R()*L.fn.length)]+' '+L.ln[Math.floor(R()*L.ln.length)]}while(used.has(n));used.add(n);
    out.push({id:t.id+'-'+i,n,no:NUMS[i],pos:POS[i],st:1,skin:['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b','#f5d6b8'][Math.floor(R()*5)],hair:['#2a1a10','#4a2e1a','#1a1a1a','#7a4a20','#c8a050'][Math.floor(R()*5)]})}
  return out;
}

/* yedek kulübesi: CBM'den gelen gerçek yedekler (t.yedek) ya da kurmaca 7 kişi (1 kaleci, 2 defans, 2 orta saha, 2 forvet) */
const SKINS=['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b','#f5d6b8'],HAIRS=['#2a1a10','#4a2e1a','#1a1a1a','#7a4a20','#c8a050'];
function bench(t){
  const R=rng(hashStr(t.id+'yedek'+(t.lg||'')));
  if(Array.isArray(t.yedek))return t.yedek.map(([no,n,pos,k],i)=>({id:t.id+'-y'+i,n,no:+no||12+i,pos:'KDOF'.includes(pos)?pos:'O',st:k?clamp(k/100,.4,1):1,skin:SKINS[Math.floor(R()*5)],hair:HAIRS[Math.floor(R()*5)]}));
  const L=LEAGUES[t.lg]||LEAGUES.tr,used=new Set(squad(t).map(p=>p.n)),nums=[12,13,14,16,17,18,19],out=[];
  ['K','D','D','O','O','F','F'].forEach((pos,i)=>{let n;do{n=L.fn[Math.floor(R()*L.fn.length)]+' '+L.ln[Math.floor(R()*L.ln.length)]}while(used.has(n));used.add(n);
    out.push({id:t.id+'-y'+i,n,no:nums[i],pos,st:1,skin:SKINS[Math.floor(R()*5)],hair:HAIRS[Math.floor(R()*5)]})});
  return out;
}

function fixturesFor(ids){
  const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const w=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];w.push(r%2===0?{h:a,a:b,hs:null,as:null}:{h:b,a:a,hs:null,as:null})}rounds.push(w);arr.splice(1,0,arr.pop())}
  const second=rounds.map(w=>w.map(m=>({h:m.a,a:m.h,hs:null,as:null})));
  return rounds.concat(second);
}
function newCareer(lg,id){
  const ids=LEAGUES[lg].t.map(r=>r[0]);
  const R=rng(Date.now()&0xffffffff);const sh=ids.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  S.car={lg,id,year:(S.car&&S.car.lg===lg&&S.car.id===id)?S.car.year+1:2026,week:1,fx:fixturesFor(sh),goals:{},last:null,done:false,history:(S.car&&S.car.history)||[]};
  persist();
}
function table(c){
  c=c||S.car;const T={};LEAGUES[c.lg].t.forEach(r=>T[r[0]]={id:r[0],o:0,g:0,b:0,m:0,a:0,y:0,p:0,form:[]});
  c.fx.forEach(w=>w.forEach(m=>{if(m.hs===null)return;const H=T[m.h],A=T[m.a];H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    if(m.hs>m.as){H.g++;A.m++;H.p+=3;H.form.push('G');A.form.push('M')}else if(m.hs<m.as){A.g++;H.m++;A.p+=3;A.form.push('G');H.form.push('M')}else{H.b++;A.b++;H.p++;A.p++;H.form.push('B');A.form.push('B')}}));
  return Object.values(T).sort((x,y)=>y.p-x.p||(y.a-y.y)-(x.a-x.y)||y.a-x.a||team(c.lg,x.id).name.localeCompare(team(c.lg,y.id).name,'tr'));
}
function simScore(h,a){const lh=clamp(1.4+(h.str-a.str)*.16+.15,.25,4),la=clamp(1.1+(a.str-h.str)*.16,.2,4);return[poisson(lh),poisson(la)]}
function addGoals(c,tm,n){if(!n)return;const sq=squad(tm);const w={K:0,D:1,O:3,F:6};for(let i=0;i<n;i++){const tot=sq.reduce((s,p)=>s+w[p.pos],0);let r=Math.random()*tot;let pick=sq[10];for(const p of sq){r-=w[p.pos];if(r<=0){pick=p;break}}c.goals[pick.id]=(c.goals[pick.id]||0)+1}}
function myMatch(c){c=c||S.car;if(!c||c.week>c.fx.length)return null;return c.fx[c.week-1].find(m=>m.h===c.id||m.a===c.id)}
function finishWeek(myH,myA,scorers){
  const c=S.car,w=c.fx[c.week-1];
  for(const m of w){const H=team(c.lg,m.h),A=team(c.lg,m.a);
    if(m.h===c.id||m.a===c.id){m.hs=myH;m.as=myA;
      if(scorers){for(const pid of scorers.h)c.goals[pid]=(c.goals[pid]||0)+1;for(const pid of scorers.a)c.goals[pid]=(c.goals[pid]||0)+1}
      else{addGoals(c,H,m.hs);addGoals(c,A,m.as)}}
    else{const[x,y]=simScore(H,A);m.hs=x;m.as=y;addGoals(c,H,x);addGoals(c,A,y)}}
  c.last=c.week;c.week++;
  if(c.week>c.fx.length){c.done=true;const t=table(c);const pos=t.findIndex(r=>r.id===c.id)+1;c.history.push({year:c.year,team:c.id,lg:c.lg,pos,champ:team(c.lg,t[0].id).name});}
  persist();
}
function leaders(c,n=10){const all={};LEAGUES[c.lg].t.forEach(r=>{const t=team(c.lg,r[0]);[...squad(t),...bench(t)].forEach(p=>all[p.id]={p,t})});return Object.entries(c.goals).filter(([k])=>all[k]).map(([k,g])=>({...all[k],g})).sort((a,b)=>b.g-a.g||a.p.n.localeCompare(b.p.n,'tr')).slice(0,n)}

const PW=68,PL=105,GW=7.32,GX0=PW/2-GW/2,GX1=PW/2+GW/2,GH=2.44,BOXW=40.3,BOXD=16.5;
const SC=4; /* piksel / metre */
const FORM=[[.5,.02],[.12,.2],[.37,.15],[.63,.15],[.88,.2],[.2,.42],[.44,.3],[.6,.36],[.88,.42],[.5,.43],[.5,.47]];
let M=null; /* aktif maç */
const cv=$('#cv'),cx=cv.getContext('2d');
let IW=168,IH=320,pitchImg=null;

function kitFor(A,B){ /* deplasman forması çakışırsa ikinci renk */
  let a={c1:A.c1,c2:A.c2},b={c1:B.c1,c2:B.c2};
  if(cdist(a.c1,b.c1)<120){b={c1:B.c2,c2:B.c1};if(cdist(a.c1,b.c1)<120)b={c1:'#f4f4f4',c2:'#222222'};if(cdist(a.c1,b.c1)<120)b={c1:'#222222',c2:'#f4f4f4'}}
  return[a,b];
}
function startMatch(me,opp,career,demo,opts){opts=opts||{};ledReset();
  SND.init();
  const [k0,k1]=kitFor(me,opp);
  const diff=S.set.diff;
  M={T:[{t:me,kit:k0,score:0,human:!demo},{t:opp,kit:k1,score:0,human:false}],career,demo:!!demo,
     clock:0,dur:(demo?1.2:S.set.dur)*60,half:1,state:'pre',stateT:1.2,after:null,events:[],
     ball:{x:PW/2,y:PL/2,z:0,vx:0,vy:0,vz:0,owner:null,last:null,lastTeam:0,kicker:null,shot:null,intended:null,gkTried:false},
     P:[],ctrl:null,cam:{x:PW/2,y:PL/2},diff,input:{x:0,y:0,pas:false,sut:false,pasE:false,sutE:false},kickTeam:0,paused:false,acc:0,lastT:0,setPiece:null};
  for(let ti=0;ti<2;ti++){const sq=squad(M.T[ti].t);const DZ=Array.isArray(M.T[ti].t.dz)&&M.T[ti].t.dz.length===11?M.T[ti].t.dz:null; /* CBM'den gelen diziliş: [fx,fy,rol,yer] */
    sq.forEach((s,i)=>M.P.push({team:ti,i,role:i===0?'G':DZ?DZ[i][2]:POS[i],pos:DZ?DZ[i][3]:ROLES[i],no:s.no,n:s.n,id:s.id,skin:s.skin,hair:s.hair,st:s.st??1,inj:false,dz:!!DZ,fx:DZ?DZ[i][0]:FORM[i][0],fy:DZ?DZ[i][1]:FORM[i][1],x:0,y:0,vx:0,vy:0,dx:0,dy:ti===0?-1:1,anim:0,cd:0,slide:0,stun:0,hold:0,dec:0}))}
  /* oyuncu değişikliği: 90 dakikada 5 hak / 3 ara, uzatmada 6 / 4; devre arası ara sayılmaz */
  M.B=[bench(M.T[0].t),bench(M.T[1].t)];M.hak={n:5,w:3};M.sub=[{n:0,win:new Set()},{n:0,win:new Set()}];M.out=[];M.inj=[];M.subLog=[];M.otoT=[0,0];
  M.asist=[opts.asist!=null?!!opts.asist:!!S.set.asist,true];M.uzFark=opts.uzFark!=null?opts.uzFark:null;M.sel={};
  M.mac=!!opts.mac;M.kart=[];M.faul=[0,0];M.ofs=[0,0];M.korner=[0,0];M.atilan=[];M.rb=[];M.tkT=[0,0];M.tkSay=[0,0];applyDiff(diff);

  if(!M.demo){M.paused=true;showIntro()}else{banner(`${esc(M.T[0].t.short)} - ${esc(M.T[1].t.short)}`,'BAŞLAMA VURUŞU',null,true);SND.whistle(1)}
  SND.ambStart();

}
function applyDiff(diff){M.diff=diff;M.T.forEach((T,ti)=>{T.str=T.t.str;T.spd=1+(T.t.str-6)*.018+(ti===1&&!M.demo?DIFF.spd[diff]:0);T.skill=clamp(.45+T.t.str*.05+(ti===1&&!M.demo?DIFF.skill[diff]:0),.3,.98)})}
/* ilk yarıda 0. takım y=0 kalesine hücum eder; ikinci yarıda kaleler değişir (M.flip) */
const goalYOf=ti=>((ti===0)!==!!(M&&M.flip))?0:PL;        /* hücum edilen kale */
const ownGoalY=ti=>PL-goalYOf(ti);
const fwdOf=ti=>goalYOf(ti)===0?-1:1;

function buildPitch2D(){
  const w=(PW+MRG*2)*SC,h=(PL+MRG*2)*SC,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const X=x=>Math.round((x+MRG)*SC),Y=y=>Math.round((y+MRG)*SC);
  /* stadyum (tepeden): sahaya yakın dik tribünler, kapalı köşeler; yanlarda iki kat ve arada camlı loca kuşağı, kuzey kale arkasında tek parça dev tribün */
  g.fillStyle='#3a3f45';g.fillRect(0,0,w,h);
  const cols=[M.T[0].kit.c1,M.T[0].kit.c2,M.T[1].kit.c1,M.T[1].kit.c2,'#f1c9a5','#c68a5a','#e8e8e8','#2a2a2a','#d33a2e'];
  const IX0=-STD.side-2,IX1=PW+STD.side+2,IY0=-STD.end-.5,IY1=PL+STD.end+.5; /* tribün iç kenarı (panoların ardı) */
  for(let y=0;y<h;y+=3)for(let x=0;x<w;x+=3){const mx=x/SC-MRG,my=y/SC-MRG;
    const dx=Math.max(IX0-mx,mx-IX1,0),dy=Math.max(IY0-my,my-IY1,0),r=Math.hypot(dx,dy);if(r===0)continue;
    const north=my<IY0&&dx===0;const ring=Math.floor(r/.75);
    if(r<1){g.fillStyle='#7b8187';g.fillRect(x,y,3,3);continue} /* ön duvar */
    if(!north&&r>=13&&r<15.5){ /* loca kuşağı: koyu cam, yanan pencereler */
      g.fillStyle=r>=14.2&&r<15&&((Math.floor((mx+my)/2.2))%3!==0)?'#ffd98a':'#18222b';g.fillRect(x,y,3,3);continue}
    g.fillStyle=ring%7===6?'#2f3439':(ring%2?(r>15.5?'#454a50':'#4b5056'):(r>15.5?'#3f4449':'#454a50'));g.fillRect(x,y,3,3); /* basamak sırası */
    if(Math.random()<(r>15.5?.78:.86)){const home=(my<PL/2)?0:2;g.fillStyle=Math.random()<.6?cols[(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0)]:cols[4+Math.floor(Math.random()*5)];g.fillRect(x,y,2,2)}}
  g.fillStyle='#2b6328';g.fillRect(X(IX0),Y(IY0),X(IX1)-X(IX0),Y(IY1)-Y(IY0));
  for(let i=0;i<15;i++){g.fillStyle=i%2?'#3c8a36':'#45983d';g.fillRect(X(-3),Y(i*7),X(PW+3)-X(-3),Y((i+1)*7)-Y(i*7))}
  /* reklam panoları: yalnız Türk devletine ve milletine faydalı kamu ürünleri ve kampanyaları (logo yok, yalnız yazı) */
  KB2=[];
  const band=(x0,y0,len,vert)=>{const n=Math.max(1,Math.round(len/35)),seg=len/n;for(let k=0;k<n;k++){
      const a=Math.round(k*seg*SC),w=Math.round(seg*SC)-2;KB2.push(vert?{x:x0,y:y0+a,len:w,vert:1,i:KB2.length}:{x:x0+a,y:y0,len:w,vert:0,i:KB2.length})}};
band(X(-1),Y(-7),PW+2,false);band(X(-1),Y(PL+4),PW+2,false);band(X(-8),Y(-1),PL+2,true);band(X(PW+5),Y(-1),PL+2,true);
  g.fillStyle='#f2f2ea';
  const L=(x0,y0,x1,y1)=>{g.fillRect(Math.min(X(x0),X(x1)),Math.min(Y(y0),Y(y1)),Math.abs(X(x1)-X(x0))||1,Math.abs(Y(y1)-Y(y0))||1)};
  const rect=(x0,y0,x1,y1)=>{L(x0,y0,x1,y0);L(x0,y1,x1+1/SC,y1);L(x0,y0,x0,y1);L(x1,y0,x1,y1)};
  rect(0,0,PW,PL);L(0,PL/2,PW,PL/2);
  const arc=(cx0,cy0,r,a0,a1,clip)=>{for(let a=a0;a<=a1;a+=.01){const x=cx0+Math.cos(a)*r,y=cy0+Math.sin(a)*r;if(clip&&!clip(x,y))continue;g.fillRect(X(x),Y(y),1,1)}};

    arc(PW/2,py,9.15,0,Math.PI*2,(x,y)=>top?y>BOXD:y<PL-BOXD);
    /* kale ağı */
    const y0=top?-2.2:PL,y1=top?0:PL+2.2;g.fillStyle='#cfd6cf';for(let x=GX0;x<=GX1;x+=.75)L(x,y0,x,y1);for(let y=y0;y<=y1;y+=.75)L(GX0,y,GX1,y);
    g.fillStyle='#ffffff';g.fillRect(X(GX0)-1,Y(y0),2,Y(y1)-Y(y0)+1);g.fillRect(X(GX1),Y(y0),2,Y(y1)-Y(y0)+1);g.fillRect(X(GX0)-1,Y(top?y0:y1),X(GX1)-X(GX0)+3,2);g.fillStyle='#f2f2ea'}

/* ===================== OYUNCU DEĞİŞİKLİĞİ · KONDİSYON · SAKATLIK · UZATMA · PENALTI ===================== */
function kmMolada(){return M.state==='half'}
function kmKalan(ti){return{hak:M.hak.n-M.sub[ti].n,ara:M.hak.w-M.sub[ti].win.size}}
function kmDegisebilir(ti){const d=M.sub[ti],mn=minute();return !M.pen&&M.state!=='over'&&d.n<M.hak.n&&(d.win.size<M.hak.w||d.win.has(mn)||kmMolada())&&M.B[ti].length>0}
function kmDegistir(ti,p,b,why){
  if(!kmDegisebilir(ti)||!p||p.team!==ti||!M.B[ti].includes(b))return false;
  const d=M.sub[ti];if(!kmMolada())d.win.add(minute());d.n++;
  M.out.push([ti,p.id,Math.round(p.st*100)]);M.subLog.push({team:ti,min:Math.max(1,minute()),out:p.n,in:b.n});
  if(M.ball.owner===p){M.ball.owner=null}
  const eski=p.n;Object.assign(p,{n:b.n,no:b.no,id:b.id,skin:b.skin,hair:b.hair,st:b.st,inj:false,stun:0,slide:0});
  M.B[ti]=M.B[ti].filter(x=>x!==b);
  if(!M.demo&&M.state!=='half')banner('DEĞİŞİKLİK',`${esc(M.T[ti].t.short)} · ${b.no} ${esc(b.n)} ↔ ${esc(eski)}${why?' · '+why:''}`,M.T[ti].kit.c1,true);
  return true}
function kmYedekSec(ti,want,gk,plan){const B=M.B[ti].filter(b=>(gk?b.pos==='K':b.pos!=='K')&&!(plan||[]).some(x=>x.b===b));return B.sort((a,b)=>((b.pos===want)-(a.pos===want))||b.st-a.st)[0]}
function kmPlan(ti,kac){
  const m=minute(),f=M.T[ti].score-M.T[1-ti].score,uz=M.half>=3,son=uz?m>=112:m>=82;
  const on=M.P.filter(p=>p.team===ti&&p.role!=='G'&&!p.inj),used=new Set(),out=[];
  for(let k=0;k<kac;k++){
    const c=on.filter(p=>!used.has(p)).sort((a,b)=>a.st-b.st);let p=null,want=null,why='';
    if(f<0&&m>=(uz?95:60)){p=c.find(q=>q.role==='D'&&on.filter(x=>x.role==='D'&&!used.has(x)).length>3)||c[0];want='F';why='SKOR İÇİN HÜCUM'}
    else if(f>0&&son){p=c.find(q=>q.role==='F'&&q.st<.9)||c[0];want=p&&p.role==='F'?'D':p&&p.role;why='SKORU KORUMAK'}
    else{p=c[0];if(!p||p.st>=(m>=75?.84:.8))break;want=p.role;why='YORGUNLUK %'+Math.round(p.st*100)}
    if(!p)break;const b=kmYedekSec(ti,want,false,out);if(!b)break;used.add(p);out.push({p,b,why})}
  return out}
function kmOtoDeg(){
  if(M.demo)return;const m=minute(),E=M.half>=3?[91,98,106,112]:[58,66,74,81,86];
  for(let ti=0;ti<2;ti++){if(!M.asist[ti]||!kmDegisebilir(ti))continue;const p=M.P.find(q=>q.team===ti&&q.inj);if(p){const b=kmYedekSec(ti,p.role==='G'?'K':p.role,p.role==='G')||kmYedekSec(ti,'O',false);if(b)kmDegistir(ti,p,b,ti===0?'🤖 SAKATLIK':'SAKATLIK')}}
  for(let ti=0;ti<2;ti++){
    if(!M.asist[ti])continue;
    const e=E.find(x=>m>=x&&M.otoT[ti]<x);if(!e||M.ball.owner&&M.ball.owner.team!==ti&&Math.abs(M.ball.y-goalYOf(M.ball.owner.team))<PL*.35)continue;  /* tehlikede değişiklik yok */
    M.otoT[ti]=e;if(!kmDegisebilir(ti))continue;
    const k=kmKalan(ti),sakla=M.half>=3||m>=84?0:1,kac=Math.max(0,Math.min(k.hak-sakla,k.ara<=1?k.hak-sakla:(e===58||e===91?2:1),3));
    if(kac)for(const x of kmPlan(ti,kac))kmDegistir(ti,x.p,x.b,ti===0?'🤖 '+x.why:'')}}
function kmMola(kac){if(M.demo)return;for(let ti=0;ti<2;ti++){if(!M.asist[ti]||!kmDegisebilir(ti))continue;const k=kmKalan(ti);for(const x of kmPlan(ti,Math.min(kac,k.hak-(M.half>=3?0:1))))kmDegistir(ti,x.p,x.b,ti===0?'🤖 '+x.why:'')}}
/* kondisyon: koştukça düşer (≈90 dakikada %20–25), düşük kondisyon hız keser; sakatlık riski yorgunlukla artar */
function kmKondisyon(dt){if(M.demo)return;const gm=dt/M.dur*90;
  for(const p of M.P){const v=Math.hypot(p.vx,p.vy);p.st=Math.max(.3,(p.st??1)-gm*(.0016+.0013*Math.min(1.3,v/6.6))*(p.role==='G'?.35:1));
    if(!p.inj&&p.role!=='G'&&Math.random()<gm*.00009*(1.6-p.st))kmSakat(p)}}
function kmSakat(p){if(p.inj||M.demo)return;p.inj=true;p.st=Math.min(p.st,.4);M.inj.push([p.team,p.id,Math.max(1,minute())]);

  banner('SAKATLIK',`${esc(p.n)} · ${esc(M.T[ti].t.short)}`,'#7a1f1f',true);
  if(ti===0&&!M.asist[0]&&kmDegisebilir(0)&&M.state==='play'){M.paused=true;M.sel={out:M.P.filter(q=>q.team===0).indexOf(p)};setTimeout(()=>{if(M&&M.paused)showSubs()},350)}}

function kmBitir(){M.state='over';SND.whistle(3);SND.ambStop();const a=M.T[0],b=M.T[1];
  banner('MAÇ SONU',`${esc(a.t.short)} ${a.score} - ${b.score} ${esc(b.t.short)}${M.pen?` · PEN ${M.pen.g[0]}-${M.pen.g[1]}`:''}`,null,true);setTimeout(()=>endMatch(false),2600)}
/* ===================== HAKEM: FAUL · KART · PENALTI · OFSAYT · VAR · TEKRAR · ASİSTAN TAKTİĞİ ===================== */
const kutudaMi=(ti,x,y)=>Math.abs(y-goalYOf(ti))<BOXD&&x>(PW-BOXW)/2&&x<(PW+BOXW)/2;   /* ti'nin hücum ettiği ceza sahası */
function kmKaymaFaul(p,o){if(M.demo||M.pen)return false;   /* kayarak müdahale: arkadan ya da topa değmeden gelirse faul */
  const arkadan=(o.dx*(o.x-p.x)+o.dy*(o.y-p.y))/(Math.hypot(o.x-p.x,o.y-p.y)||1)>.35,topYakin=Math.hypot(M.ball.x-p.x,M.ball.y-p.y)<Math.hypot(o.x-p.x,o.y-p.y)-.1;
  const f=(topYakin?.1:.3)+(arkadan?.35:0)+(p.sari?-.08:0);if(Math.random()>f)return false;kmFaul(p,o,arkadan,true);return true}
function kmMudahaleFaul(q,p){if(M.demo||M.pen)return false;   /* omuz/çekme: top kapma denemelerinin küçük bir kısmı faul */
  if(Math.random()>(q.sari?.05:.11))return false;kmFaul(q,p,false,false);return true}
function kmFaul(o,p,arkadan,kayma){
  const ti=p.team,b=M.ball;M.faul[o.team]++;
  const kutu=kutudaMi(ti,p.x,p.y),dg=Math.abs(goalYOf(ti)-p.y);
  const onunde=M.P.filter(q=>q.team!==ti&&q!==o&&q.role!=='G'&&Math.abs(goalYOf(ti)-q.y)<dg).length;
  const sonAdam=dg<28&&onunde===0&&Math.abs(p.x-PW/2)<16&&b.owner===p&&Math.abs(p.vy)>3;
  const sari=(.05+(arkadan?.13:0)+(kayma?.05:0)+(kutu?.2:0))*(o.sari?.35:1),kirmizi=.0015+(arkadan&&kayma?.006:0)+(sonAdam?(kutu?.04:.14):0);
  const kart=()=>{const r=Math.random();if(r<kirmizi)kmKart(o,'K',sonAdam?'NET GOL FIRSATI':'SERT MÜDAHALE');else if(r<kirmizi+sari)kmKart(o,'S')};
  if(!kutu&&dg<55&&b.owner===p&&Math.random()<.3){o.cd=1.2;o.stun=.5;o.slide=0;flash('AVANTAJ');kart();return}   /* hücum sürer; faulcü bir an oyun dışı */

  if(!M.demo)banner('FAUL',`${esc(o.n)} · ${esc(M.T[ti].t.short)} serbest vuruş`,'#3a4148',true)}

    for(const q of M.P){if(q===at)continue;if(q.role==='G'&&q.team!==ti){q.x=PW/2;q.y=gy===0?.4:PL-.4;continue}
      if(Math.abs(q.y-gy)<BOXD+1.5){q.y=gy===0?BOXD+rand(1.8,6):PL-BOXD-rand(1.8,6);q.x=clamp(q.x,6,PW-6)}}

function kmAt(p){

/* ofsayt: pas anında alıcı, toptan ve sondan ikinci rakipten daha ilerideyse (rakip yarı sahada). Dönüş: çizgiyi kaç metre geçtiği */
function kmOfsaytMi(p,q){if(!q||q.team!==p.team)return -9;const ti=p.team,dq=depthOf(ti,q.y);if(dq<=PL/2)return -9;
  const rk=M.P.filter(o=>o.team!==ti).map(o=>depthOf(ti,o.y)).sort((a,b)=>b-a),cz=Math.max(rk[1]??PL/2,depthOf(ti,M.ball.y),PL/2);return dq-cz}
function kmOfsaytBak(p,q){const b=M.ball;b.ofs=null;if(M.demo||!q||q.team!==p.team||M.setPiece&&M.setPiece.p===p&&(isCorner(p)||M.setPiece.ko))return;

/* tekrar: son ~3,5 saniye halka kayıtta; gol olunca yarı hızda yeniden oynatılır (gerçek zamanlı maçta ağır çekim), ekranda kırmızı R */

  if(!b.owner&&Math.sign(b.vy)===-s&&Math.abs(b.vy)>6){const t=(p.y-b.y)/b.vy;if(t>0&&t<1.6){const xc=b.x+b.vx*t;if(xc>GX0-2.5&&xc<GX1+2.5){p.tx=clamp(xc,GX0-1,GX1+1);p.ty=p.y;p.run=1.25;p.dive=1;return}}}
  p.dive=0;
  const sweep=!b.owner&&!inBox&&depthOf(p.team,b.y)<19&&Math.abs(b.x-PW/2)<20;
  if(!b.owner&&(inBox||sweep)){const near=chasers(p.team)[0];const myd=Math.hypot(p.x-b.x,p.y-b.y);const[,od]=[0,M.P.filter(q=>q.team!==p.team).reduce((m,q)=>Math.min(m,Math.hypot(q.x-b.x,q.y-b.y)),99)];
    if(myd<od+(sweep?-2:1.5)||(!sweep&&myd<4)){const t=interceptPoint(p);p.tx=t.x;p.ty=t.y;p.run=1;return}}
  if(b.owner&&b.owner.team!==p.team&&inBox&&Math.hypot(p.x-b.x,p.y-b.y)<7){p.tx=b.x;p.ty=b.y;p.run=.95;return}
  /* çizgi ile top arasında konum */

}

/* ---------- Eylemler ---------- */
function release(p,vx,vy,vz,intended){const b=M.ball;kmOfsaytBak(p,intended);b.owner=null;b.x=p.x+p.dx*.5;b.y=p.y+p.dy*.5;b.vx=vx;b.vy=vy;b.vz=vz;b.z=Math.max(b.z,.05);b.last=p;b.lastTeam=p.team;b.kicker=p;b.intended=intended||null;b.gkTried=false;b.cross=false;p.cd=.35;p.hold=0;M.setPiece=null}
function doPass(p,dx,dy,target){
  const q=target||bestPass(p,dx,dy,true);
  if(!q){const n=Math.hypot(dx,dy)||1;release(p,dx/n*14,dy/n*14,.5);SND.kick(.6);return}
  const d=Math.hypot(q.x-p.x,q.y-p.y);const lead=clamp(d/16,.2,1.1);
  let tx=q.x+q.vx*lead,ty=q.y+q.vy*lead;const D=Math.hypot(tx-p.x,ty-p.y);
  const T=M.T[p.team];const[,odP]=nearestOpp(p);const err=(1-T.skill)*D*(D>22?.15:.08)*(odP<2.5?1.4:1);tx+=rand(-err,err);ty+=rand(-err,err);
  const ux=(tx-p.x)/D,uy=(ty-p.y)/D;
  let v,vz=0;
  if(D>22){vz=4.5+D*.07;const ta=2*vz/18;v=D/(ta+.75)}else v=clamp(D*1.1+3.5,8,25);
  p.dx=ux;p.dy=uy;release(p,ux*v,uy*v,vz,q);SND.kick(.7);
}
function doShoot(p,aimX,pow){pow=pow||1;
  const gy=goalYOf(p.team),f=fwdOf(p.team),T=M.T[p.team];
  const dG=Math.hypot(PW/2-p.x,gy-p.y);
  if(dG>36){/* uzun top */const q=bestPass(p,0,f,true);if(q&&Math.random()<.6){doPass(p,q.x-p.x,q.y-p.y,q);return}release(p,rand(-3,3),f*22,7);SND.kick(.9);return}
  const human=T.human&&p===M.ctrl;
  let ax=PW/2+(human?aimX*2.9:rand(-2.6,2.6));
  const gk=M.P.find(q=>q.team!==p.team&&q.role==='G');
  if(!human&&gk){ax=gk.x>PW/2?PW/2-rand(1.4,3.1):PW/2+rand(1.4,3.1)}
  const acc=T.skill*(human?1.02:1);const[,odS]=nearestOpp(p);const press=odS<2.5?1.35:1;
  const err=(1.15-acc)*(1.2+dG*.13)*press;ax+=rand(-err,err)+(Math.random()<.12+(1-acc)*.3?rand(-1,1)*rand(2.5,5):0);
  const tz=Math.random()<.1+dG*.006?rand(2.6,3.6):rand(.2,2.2);
  const dx=ax-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);const v=(22+T.str*.5)*pow;
  const t=d/v;const vz=(tz+9*t*t)/t;
  p.dx=dx/d;p.dy=dy/d;release(p,dx/d*v,dy/d*v,clamp(vz,1,8));M.ball.shot={team:p.team,t:0};SND.kick(1.2);
}
function doSlide(p,dx,dy){const n=Math.hypot(dx,dy)||1;p.dx=dx/n;p.dy=dy/n;p.slide=.42;p.scd=1.1;p.vx=p.dx*10.5;p.vy=p.dy*10.5;SND.noise(.18,.08,700)}

/* ---------- Hareket ---------- */
function movePlayer(p,dt){
  const T=M.T[p.team];let vx,vy;
  if(p.slide>0){p.slide-=dt;p.vx*=Math.pow(.15,dt);p.vy*=Math.pow(.15,dt);vx=p.vx;vy=p.vy;
    const b=M.ball;const d=Math.hypot(b.x-p.x,b.y-p.y);
    if(d<1.45&&b.z<1&&b.owner!==p){if(b.owner&&b.owner.team!==p.team&&kmKaymaFaul(p,b.owner)){p.slide=0;return}if(b.owner&&b.owner.team!==p.team){const o=b.owner;o.stun=.8;o.cd=.9;b.owner=null;if(!M.demo&&o.role!=='G'&&Math.random()<.025)kmSakat(o)}if(!b.owner){const hum=!M.demo&&p===M.ctrl;if(hum){take(p);p.won=1;SND.kick(.5)}else{b.vx=p.dx*7+rand(-3,3);b.vy=p.dy*7+rand(-3,3);b.vz=.8;b.lastTeam=p.team;b.last=p;b.intended=null;b.shot=null;SND.kick(.5)}}}
    if(p.slide<=0){p.stun=M.ball.owner===p?0:.35;p.won=0}
  }else if(p.stun>0){vx=p.vx*.8;vy=p.vy*.8}
  else{
    const hum=!M.demo&&p===M.ctrl;const top=6.6*(T.spd+tr(p,'spd',0))*(hum?1.1:(M.ball.owner===p?.9:1))*(p.role==='G'&&p.dive?1.15:1)*(.72+.28*(p.st??1))*(p.inj?.6:1);
    let mx=0,my=0,sp=0;
    if(p.tx!=null){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.35){mx=dx/d;my=dy/d;sp=top*p.run*Math.min(1,d/1.5)}}
    else if(p.mx||p.my){mx=p.mx;my=p.my;sp=top*(p.run||1)*Math.min(1,Math.hypot(p.mx,p.my)*1.15)}
    const tvx=mx*sp,tvy=my*sp,k=Math.min(1,dt*(M.ball.owner===p?7:9));
    p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;vx=p.vx;vy=p.vy;

  }

  if(p.role==='G'){const og=ownGoalY(p.team);if(og===PL)p.y=Math.max(p.y,PL-BOXD-2);else p.y=Math.min(p.y,BOXD+2);}

}
function separate(){const P=M.P;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<.9){const o=(.9-d)/2,ux=dx/d,uy=dy/d;if(a.slide<=0){a.x-=ux*o;a.y-=uy*o}if(b.slide<=0){b.x+=ux*o;b.y+=uy*o}}}}

/* ---------- Top ---------- */
function ballStep(dt){
  const b=M.ball;
  if(b.owner){const p=b.owner;const ph=p.anim*1.6;const off=.62+Math.sin(ph)*.12;b.x=p.x+p.dx*off;b.y=p.y+p.dy*off;b.z=0;b.vx=p.vx;b.vy=p.vy;b.vz=0;b.lastTeam=p.team;b.last=p;
    /* topla çizgiyi geçmek: taç / aut / korner, kale ağzından girerse gol */
    if(!M.setPiece&&p.role!=='G'&&(b.x<-.15||b.x>PW+.15||b.y<-.15||b.y>PL+.15)){b.owner=null;b.kicker=p;if(outOfPlay(b))return}
    /* top kapma */
    for(const q of M.P){if(q.team===p.team||q.stun>0||q.slide>0||q.cd>0)continue;const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<.85){
      const Tq=M.T[q.team],Tp=M.T[p.team];
      if(Tp.human&&p===M.ctrl&&p.hold<.6)continue;
      let rate=(1.1+Tq.skill-Tp.skill*.6)*(Tq.human?(q===M.ctrl?2.6:1.25):1)*(Tp.human&&p===M.ctrl?DIFF.steal[M.diff]:1);
      if(p.role==='G')rate*=.2;rate*=(1-tr(p,'hold',0))*(1+tr(q,'tackle',0));if(!(Tp.human&&p===M.ctrl))rate*=.55; /* yapay zekâ topçusu da topu biraz saklayabilsin */
      if(Math.random()<rate*dt*2.2){if(kmMudahaleFaul(q,p))return;b.owner=q;q.hold=0;p.cd=.7;p.stun=.25;b.intended=null;M.setPiece=null;SND.kick(.4);break}}}
    return;
  }
  const sp0=Math.hypot(b.vx,b.vy);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.z>0||b.vz>0){b.vz-=18*dt;b.z+=b.vz*dt;const dr=Math.pow(.88,dt);b.vx*=dr;b.vy*=dr;if(b.z<=0){b.z=0;if(b.vz<-2.5){b.vz=-b.vz*.42;SND.bounce()}else b.vz=0}}
  else{const f=Math.exp(-1.15*dt);b.vx*=f;b.vy*=f}
  if(b.shot)b.shot.t+=dt;

  /* kaleci kurtarışı */
  for(const g of M.P){if(g.role!=='G'||g.cd>0)continue;const d=Math.hypot(g.x-b.x,g.y-b.y);const reach=1.25+(g.dive?.9:0);
    if(d<reach&&b.z<2.7){if(b.gkTried&&b.gkTried===g)continue;b.gkTried=g;
      const towards=ownGoalY(g.team)===PL?b.vy>0:b.vy<0;const sp=Math.hypot(b.vx,b.vy);
      if(!towards||sp<9){take(g);return}
      /* çerçeveyi bulmayacak şutu bırakır (direk dibinden geçmiyorsa) */
      {const ly=ownGoalY(g.team),tt=(ly-b.y)/b.vy;if(tt>0&&tt<2){const xc=b.x+b.vx*tt,zc=b.z+b.vz*tt-9*tt*tt;if((xc<GX0-.35||xc>GX1+.35||zc>GH+.25)&&d>.6){b.gkTried=g;continue}}}
      const Tg=M.T[g.team];let ps=.56+Tg.skill*.36-(sp-20)*.011-(b.z>1.9?.1:0)+(d<.8?.18:0);if(Tg.human)ps+=[.14,.07,.02][M.diff];if(!Tg.human&&M.T[1-g.team].human)ps+=DIFF.gk[M.diff];
      if(Math.random()<ps){if(sp<21&&Math.random()<.55){take(g);SND.ooh()}
        else if(Math.random()<.45){/* direğin yanından kornere çeler */const sx=b.x<PW/2?-1:1;b.vx=sx*rand(7,11);b.vy=b.vy*.35;b.vz=rand(1.5,3);b.shot=null;b.lastTeam=g.team;b.last=g;b.intended=null;SND.kick(.6);SND.ooh()}
        else{b.vx=-b.vx*.25+rand(-6,6);b.vy=-b.vy*.35;b.vz=2.5;b.shot=null;b.lastTeam=g.team;b.last=g;b.intended=null;SND.kick(.6);SND.ooh()}g.cd=.4;return}
      else{g.cd=.6}}}
  /* gol / out */
  if(outOfPlay(b))return;
  /* topu alma */

      const sp=Math.hypot(b.vx,b.vy);if(sp>17&&p!==b.intended&&Math.random()>.12)continue;

}
function outOfPlay(b){

function take(p){const b=M.ball;if(b.ofs&&!b.ofs.yakin&&b.ofs.q===p&&p.team===b.ofs.team&&!M.demo){kmOfsayt(p);return}if(b.ofs&&b.ofs.yakin&&b.ofs.q===p)M.yakinOfs={team:p.team,t:M.clock};b.ofs=null;if(b.cross&&p.role!=='G')p.firstTime=1;b.cross=false;b.owner=p;p.hold=0;b.intended=null;b.shot=null;b.vx=b.vy=b.vz=0;b.z=0;b.lastTeam=p.team;b.last=p;p.dec=rand(.15,.35)}

/* ===================== YAYIN MOTORU =====================

  2:{ad:'Tele',yaw:.42,h:24,R:56,wl:46,wp:30,cyl:.58,cyp:.56,HK:1.15},

function bcMask(){const m=camMode();return m===1?(M.flip?{W:1,E:1,S:1}:{W:1,E:1,N:1}):m===2?{W:1,N:1,S:1,cutE:1}:{W:1,N:1,S:1}} /* Tele: kameraya çok yakın kale arkası uçları kesilir */

/* izdüşüm: dünya (x en, y boy, z yükseklik) -> [ekranX, ekranY, ölçek px/m, derinlik] ; kameranın arkası null */

/* TV: yan tribünün üstünden dümdüz, ray üstünde kayan kamera */
function cameraTV(dt){

/* tribün sıra şeritleri: her sıra önceden çizilmiş görüntü, kamera açısına göre dilimlenip eğilerek çizilir */
function drawStrips(g,list,pr,cel,tt){
  for(const S of list){const ax=S.a[0],ay=S.a[1],bx=S.b[0],by=S.b[1];
    const par=Math.abs((bx-ax)*BC.f[0]+(by-ay)*BC.f[1])<.02*S.len;let n=par?1:S.n;if(cel)n=Math.max(n,18);
    const img=S.img,sx0=S.sx||0,sw=(S.sw||img.width)/n,ih=img.height;

}

    const cvs=ledCanvas(B.i),h=1.1*(A[2]+Z[2])/2;g.setTransform((Z[0]-A[0])/cvs.width,(Z[1]-A[1])/cvs.width,0,h/cvs.height,A[0],A[1]-h);g.drawImage(cvs,0,0);g.setTransform(1,0,0,1,0,0)}

      const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f;const[a,b]=ringPts(p,o);const len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/(.8*step)));
      for(let i=0;i<n;i++){if(Math.random()>.93)continue;const t=(i+.5+rand(-.2,.2))/n,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
        const home=(y<PL/2)===(M&&!M.flip)?0:2; /* ev sahibi seyircisi bir yarıda, deplasman öbüründe yoğun */
        const ci=Math.random()<.6?(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0):4+Math.floor(Math.random()*7);out.push([x,y,h+.05,ci,Math.random()*6.28])}}
    out.sort((u,v)=>u[3]-v[3]);return out};
  const noDots=p=>strips&&(!p.arc||p.side==='NW'&&mask.W||p.side==='SW'&&mask.W||p.side==='NE'&&mask.E||p.side==='SE'&&mask.E);
  for(const p of ring){const W=p.side==='N'?STD.wall:null;
    if(W){const[o1,h1,o2,h2]=W.tier;L.roof.push({q:bandQuad(p,W.roof[0],W.roof[1],W.roof[2],W.roof[3]),c:'#262b31'},{q:bandQuad(p,W.back[0],W.back[1],W.back[0],W.back[2]),c:'#3d4349'});
      L.upper.push({q:bandQuad(p,o1,h1,o2,h2),c:'#4b5056',fans:noDots(p)?null:fans(p,o1,h1,o2,h2)});
      L.fasc.push({q:bandQuad(p,W.fasc[0],W.fasc[1],W.fasc[0],W.fasc[2]),c:'#d9dde1',p,o:W.fasc[0],h:W.fasc[1]});continue}
    const[l1,lh1,l2,lh2]=STD.low,[u1,uh1,u2,uh2]=STD.up,R=STD.roof,B=STD.back,V=STD.vip,F=STD.fasc;
    L.roof.push({q:bandQuad(p,R[0],R[1],R[2],R[3]),c:'#262b31'},{q:bandQuad(p,B[0],B[1],B[0],B[2]),c:'#3d4349'});
    L.upper.push({q:bandQuad(p,u1,uh1,u2,uh2),c:'#4b5056',fans:noDots(p)?null:fans(p,u1,uh1,u2,uh2)});
    L.vip.push({q:bandQuad(p,V[0],V[1],V[0],V[2]),c:'#18222b',p,o:V[0],h:(V[1]+V[2])/2},{q:bandQuad(p,l2,lh2,u1,uh1),c:'#6d737a'});
    L.lower.push({q:bandQuad(p,l1,lh1,l2,lh2),c:'#575c62',fans:noDots(p)?null:fans(p,l1,lh1,l2,lh2)},{q:bandQuad(p,0,0,0,l1+lh1),c:'#7b8187'});
    L.fasc.push({q:bandQuad(p,F[0],F[1],F[0],F[2]),c:'#d9dde1',p,o:F[0],h:F[1]})}
  /* loca camlarında ışık, saçakta projektör, çatı altında makas */
  for(const v of L.vip){if(!v.p)continue;const[a,b]=ringPts(v.p,v.o-.3),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/2.2));
    v.win=[];for(let i=0;i<n;i++){const t=(i+.5)/n;if(Math.random()<.78)v.win.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,v.h])}}
  for(const f of L.fasc){const[a,b]=ringPts(f.p,f.o-.05),len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(len/3.2));
    for(let i=0;i<n;i++){const t=(i+.5)/n;L.lights.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,f.h-.15])}
    if(!f.p.arc){const W=f.p.side==='N'?STD.wall:STD,R=W.roof,k=Math.max(1,Math.floor(len/6));
      for(let i=0;i<=k;i++){const t=i/k;const[fa,fb]=ringPts(f.p,R[2]),[ba,bb]=ringPts(f.p,R[0]);
        const F0=[fa[0]+(fb[0]-fa[0])*t,fa[1]+(fb[1]-fa[1])*t,R[3]-.6],B0=[ba[0]+(bb[0]-ba[0])*t,ba[1]+(bb[1]-ba[1])*t,R[1]-.6];
        L.truss.push([F0,B0]);if(i<k){const t2=(i+1)/k;L.truss.push([F0,[ba[0]+(bb[0]-ba[0])*t2,ba[1]+(bb[1]-ba[1])*t2,R[1]-1.8]])}}}}
  /* batı tribünü sıra şeritleri (TV: her sıra önceden çizilmiş tek görüntü, kare başına binlerce nokta yerine ~50 çizim) */
  /* tribün sıra şeritleri (düz kenarlar): her kenar ve kat için birkaç hazır sıra deseni; kare başına binlerce nokta yerine sıra başına birkaç çizim */
  L.strips={up:[],low:[]};
  if(strips){const ppm=10,k12=ppm/12,K=6,skins=['#f1c9a5','#e0ac7e','#c68a5a','#8d5a3b'];
    for(const sd of['W','N','E','S']){if(!mask[sd])continue;const ps=ring.filter(p=>p.side===sd);if(!ps.length)continue;
      for(const[key,[o1,h1,o2,h2]]of sd==='N'?[['up',STD.wall.tier]]:[['up',STD.up],['low',STD.low]]){
        const A=ringPts(ps[0],o1)[0],B=ringPts(ps[ps.length-1],o1)[1],len=Math.hypot(B[0]-A[0],B[1]-A[1]),wpx=Math.round(len*ppm),pats=[];
        for(let q=0;q<K;q++){const c=document.createElement('canvas');c.width=wpx;c.height=11;const g=c.getContext('2d');
          for(let x=2;x<wpx;x+=.8*step*ppm){if(Math.random()>.93)continue;const ym=A[1]+(B[1]-A[1])*x/wpx,home=(ym<PL/2)===(M&&!M.flip)?0:2;
            const ci=Math.random()<.6?(Math.random()<.72?home:2-home)+(Math.random()<.3?1:0):4+Math.floor(Math.random()*7);const jx=x+rand(-1,1)*k12;
            g.fillStyle=cols[ci];g.fillRect(jx-2.6*k12,3.5,5.2*k12,7.5);g.fillStyle=skins[Math.floor(Math.random()*4)];g.fillRect(jx-1.7*k12,0,3.4*k12,3.4)}
          pats.push(c)}
        const rows=Math.max(1,Math.round((o2-o1)/(.95*step)));
        for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f;
          const a=ringPts(ps[0],o)[0],b=ringPts(ps[ps.length-1],o)[1];
          L.strips[key].push({a,b,z:h,len,n:Math.max(1,Math.ceil(len/10)),r,img:pats[r%K],m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}
        /* köşe yayları da aynı desenlerle (yay parçaları kısa kirişler); batı NW/SW, doğu NE/SE yaylarını üstlenir */
        for(const ap of ring.filter(p=>p.arc&&({W:['NW','SW'],E:['NE','SE']}[sd]||[]).includes(p.side)))
          for(let r=rows-1;r>=0;r--){if(r%7===6)continue;const f=(r+.5)/rows,o=o1+(o2-o1)*f,h=h1+(h2-h1)*f,[a,b]=ringPts(ap,o),l=Math.hypot(b[0]-a[0],b[1]-a[1]);
            const sw=Math.max(4,Math.round(l*ppm)),sx=Math.floor(Math.random()*Math.max(1,wpx-sw));
            L.strips[key].push({a,b,z:h,len:l,n:1,r,img:pats[(r+3)%K],sx,sw,m:[(a[0]+b[0])/2,(a[1]+b[1])/2]})}}}}
  return{L,cols,heads:!!heads}}
/* canvas üzerinde boya: pr(x,y,z) -> [sx,sy,s] | null ; poly(points,color) dolu çokgen ; cam:[x,y] uzaktan yakına sıralama için */
function drawStadium(g,ST,pr,poly,cam,cel,above){
  if(!ST)return;const L=ST.L,far=o=>{let x=0,y=0;for(const p of o.q){x+=p[0];y+=p[1]}x/=o.q.length;y/=o.q.length;return-Math.hypot(x-cam[0],y-cam[1])};
  const sorted=a=>(a._s||(a._s=a.slice())).sort((u,v)=>far(u)-far(v));
  if(!above)for(const o of sorted(L.roof))poly(o.q,o.c);
  if(!above){g.strokeStyle='rgba(120,128,138,.55)';g.lineWidth=1;g.beginPath();
  for(const[A,B]of L.truss){const a=pr(...A),b=pr(...B);if(a&&b){g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}}g.stroke()}
  const tt=performance.now()/1000;
  const dots=fs=>{let last=-1;for(const d of fs){const q=pr(d[0],d[1],d[2]+(cel&&d[4]<4.2?Math.max(0,Math.sin(tt*(6+d[4])+d[4]*7))*.45:0));
      if(!q||q[0]<-4||q[0]>g.canvas.width+4||q[1]<-4||q[1]>g.canvas.height+4)continue;if(d[3]!==last){last=d[3];g.fillStyle=ST.cols[last]}
      const w=Math.max(1,.46*q[2]),h=Math.max(1.2,.62*q[2]);g.fillRect(q[0]-w/2,q[1]-h,w,h);
      if(ST.heads&&q[2]>9){g.fillStyle=d[4]<2?'#e0ac7e':d[4]<4?'#c68a5a':'#f1c9a5';g.fillRect(q[0]-w*.32,q[1]-h-.3*q[2],w*.64,.3*q[2]);g.fillStyle=ST.cols[last]}}};
  const strip=a=>drawStrips(g,a.slice().sort((u,v)=>Math.hypot(v.m[0]-cam[0],v.m[1]-cam[1])-Math.hypot(u.m[0]-cam[0],u.m[1]-cam[1])),pr,cel,tt);
  for(const o of sorted(L.upper)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.up);
  for(const o of sorted(L.vip)){poly(o.q,o.c);if(o.win){g.fillStyle='#ffd98a';for(const w of o.win){const q=pr(...w);if(q){const ww=Math.max(1,1.1*q[2]),hh=Math.max(1,.9*q[2]);g.fillRect(q[0]-ww/2,q[1]-hh/2,ww,hh)}}}}
  for(const o of sorted(L.lower)){poly(o.q,o.c);if(o.fans)dots(o.fans)}
  if(L.strips)strip(L.strips.low);
  if(above)for(const o of sorted(L.roof))poly(o.q,o.c==='#262b31'?'#9aa2aa':o.c); /* yukarıdan: çatı üstü açık gri */
  for(const o of sorted(L.fasc))poly(o.q,o.c);
  g.fillStyle='#fffbe8';for(const l of L.lights){const q=pr(...l);if(q){const w=Math.max(1.5,1*q[2]),h=Math.max(1,.45*q[2]);g.fillRect(q[0]-w/2,q[1]-h/2,w,h)}}
}
