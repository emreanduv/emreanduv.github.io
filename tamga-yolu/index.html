":`DEDE KORKUT: {0} companions are written in your Bitig. {1}`,"DEDE KORKUT: Bu diyarda kimse tek başına yol yürümez. Her yiğidin bir yoldaşı olur.":`DEDE KORKUT: In this land no one walks a road alone. Every hero has a companion.`,"DEDE KORKUT: Bu diyarın bütün yoldaşlarını Bitig'e yazmak benim ömürlük düşümdü. Artık bu iş senin!":`DEDE KORKUT: Writing every companion of this land into the Bitig was my lifelong dream. Now the task is yours!`,"DEDE KORKUT: Bu yolu ben yürüyemedim evlat. Sen yürüdün. Senden sonra gelenler de yürüyecek.":`DEDE KORKUT: I could not walk this road, child. You did. Those after you will walk it too.`,"DEDE KORKUT: Bunlar da KEMENT. Yabani yoldaşa atarsan seninle gelir. Önce biraz yormayı unutma!":`DEDE KORKUT: And these are LASSOS. Throw one at a wild companion and it comes with you. Don't forget to tire it first!`,"DEDE KORKUT: Burası Şeref Odası. Kurultayın başına geçenler ve yoldaşları burada anılır.":`DEDE KORKUT: This is the Hall of Honor. Those who head the Kurultay and their companions are remembered here.`,"DEDE KORKUT: Gök yeli yönetir, yel odu söndürür, od da göğü tutuşturur. Her birinin ötekine üstünlüğü var.":`DEDE KORKUT: Sky rules wind, wind snuffs out fire, and fire sets the sky ablaze. Each has the upper hand over another.`,"DEDE KORKUT: Hangisi gönlüne yatarsa yanına git ve seç.":`DEDE KORKUT: Go to whichever one your heart chooses.`,"DEDE KORKUT: Hazır olunca gel.":`DEDE KORKUT: Come back when you're ready.`,"DEDE KORKUT: Her basamakta bir yiğit, her yiğitte bir yoldaş, her yoldaşta bir destan gördün.":`DEDE KORKUT: On every step a hero, in every hero a companion, in every companion a legend. You've seen them all.`,"DEDE KORKUT: Kalan yavruyu ben büyütürüm. Belki bir gün yolunuz kesişir.":`DEDE KORKUT: I'll raise the cub that's left. Perhaps your paths will cross one day.`,"DEDE KORKUT: Karşılığında sana bunu vereyim. Al bu BİTİG'i. Gördüğün her yoldaş buna yazılır.":`DEDE KORKUT: In return, let me give you this. Take this BITIG. Every companion you see is written in it.`,"DEDE KORKUT: Kimi basamakta efsaneler yolunu keser. Son basamakta ise... beni bulursun.":`DEDE KORKUT: On some steps legends will block your way. And on the last step... you will find me.`,"DEDE KORKUT: Kopuzumun teli koptu... Ama destan tamamlandı.":`DEDE KORKUT: My kopuz string has snapped... But the legend is complete.`,"DEDE KORKUT: Kurultayın başı! Ozanlar şimdiden destanını söylüyor.":`DEDE KORKUT: Head of the Kurultay! The bards are already singing your legend.`,"DEDE KORKUT: Kuzeyde, Bozkır Yolu'nun ucunda Yeşil Oba var. Oranın pazarından bir emanetim gelecekti. Bir bakıver!":`DEDE KORKUT: North, at the end of the Steppe Road, lies Yeşil Oba. I was expecting a parcel from its bazaar. Would you go and check?`,"DEDE KORKUT: Masada üç yavru var. Hangisi seninle yürüyecek? Yanına git, bak.":`DEDE KORKUT: There are three cubs on the table. Which one will walk with you? Go over and look.`,"DEDE KORKUT: Masada üç yavru var: bir kurt yavrusu, bir tay ve bir atmaca.":`DEDE KORKUT: There are three cubs on the table: a wolf cub, a foal and a hawk chick.`,"DEDE KORKUT: Ooo, kopuzumun telleri gelmiş! Eline sağlık yiğit.":`DEDE KORKUT: Oho, my kopuz strings have come! Bless your hands, brave one.`,"DEDE KORKUT: Sabret, Tarhan. Önce {0} seçecek.":`DEDE KORKUT: Patience, Tarhan. {0} chooses first.`,"DEDE KORKUT: Sekiz tamgayı toplayan yiğidin adını ben koyarım, türküsünü ben söylerim!":`DEDE KORKUT: The hero who gathers the eight tamgas, I shall name and sing of!`,"DEDE KORKUT: Tarhan seni bekliyor gibi...":`DEDE KORKUT: Tarhan seems to be waiting for you...`,"DEDE KORKUT: Tarhan, sen de iyi dövüştün. Ama yoldaşın gönlünü kazanmadan kurultayın başı kazanılmaz.":`DEDE KORKUT: You fought well too, Tarhan. But the head of the Kurultay can't be won without winning your companion's heart.`,"DEDE KORKUT: Yeşil Oba'nın kuzeyindeki Kayın Ormanı'nı geçince Orhun Obası'na varırsın. Basat'ın tamgası orada.":`DEDE KORKUT: Past the Birch Forest north of Yeşil Oba lies Orhun Oba. Basat's tamga is there.`,"DEDE KORKUT: Yeşil Oba'nın pazarına uğradın mı? Emanetim orada.":`DEDE KORKUT: Did you stop by the bazaar in Yeşil Oba? My parcel is there.`,"DEDE KORKUT: Yol tamam evlat. Ama yolcu hiç durmaz.":`DEDE KORKUT: The road is complete, child. But the traveler never stops.`,"DEDE KORKUT: Yola çıkalım mı? {0} başlarsın.":`DEDE KORKUT: Shall we set out? You start {0}.`,"DEDE KORKUT: Yoldaşın yorulursa annene uğra, o iyileştirir.":`DEDE KORKUT: If your companion gets tired, see your mother. She'll heal it.`,"DEDE KORKUT: Yoldaşına iyi bak. O seni, sen onu korursun.":`DEDE KORKUT: Take good care of your companion. It protects you, you protect it.`,"DEDE KORKUT: Yoldaşına sahip çık, yurduna sahip çık. Destanın bundan sonrasını sen yazacaksın.":`DEDE KORKUT: Stand by your companion, stand by your homeland. The rest of the legend is yours to write.`,"DEDE KORKUT: Yolun burada bitmedi evlat. Ozanlar bu destanı söyledikçe sen de yürümeye devam edeceksin.":`DEDE KORKUT: Your road doesn't end here, child. As long as the bards sing this legend, you will keep walking.`,"DEDE KORKUT: Yolun sonuna vardın evlat. Ama dilersen yine yürü; yol yürüyene açıktır.":`DEDE KORKUT: You have reached the end of the road, child. But walk again if you wish; the road is open to those who walk it.`,"DEDE KORKUT: {0}! Seni ilk gördüğüm günü hatırlıyorum. Kopuzumun yanında {1} ile tanışmıştın.":`DEDE KORKUT: {0}! I remember the day I first saw you. You met {1} beside my kopuz.`,"DEDE KORKUT: {0}, kurultayın başı artık sensin! Gel, adını yoldaşlarınla birlikte Şeref Defteri'ne yazalım.":`DEDE KORKUT: {0}, you are the head of the Kurultay now! Come, let's write your name in the Book of Honor with your companions.`,"DEDE KORKUT: Şimdi son basamaktasın. Ben de kopuzumu bırakıp yoldaşlarımla karşına çıkıyorum!":`DEDE KORKUT: Now you stand on the last step. I set down my kopuz and face you with my own companions!`,DEMİR:`IRON`,"DEMİR ANAHTAR":`IRON KEY`,"DEMİR KAFA":`IRON HEAD`,"DEMİR TAMGA OTAĞI":`IRON TAMGA TENT`,"DEMİRCİ KAYAN":`SMITH KAYAN`,"DEMİRCİ KAYAN: Al bu DEMİR TAMGASI'nı. Ocağımda senin için dövdüm.":`SMITH KAYAN: Take this IRON TAMGA. I forged it for you in my hearth.`,"DEMİRCİ KAYAN: Ben Demirci Kayan. Atalarım Ergenekon'un demir dağını eritenlerin soyundandır.":`SMITH KAYAN: I am Smith Kayan. My ancestors were among those who melted the iron mountain of Ergenekon.`,"DEMİRCİ KAYAN: Bir de ÖĞRETİ: DEMİR KAFA al. Ocakta dövülmüş bir hamledir!":`SMITH KAYAN: Take LORE: IRON HEAD as well. A move forged in the hearth!`,"DEMİRCİ KAYAN: Demir sabırla dövülür. Bakalım sen ateşe dayanabilecek misin?":`SMITH KAYAN: Iron is forged with patience. Let's see if you can stand the fire.`,"DEMİRCİ KAYAN: Güneyde İdil akar. Orada suyun yoldaşları seni sınayacak. Sal yapmayı öğrenmen gerek!":`SMITH KAYAN: The İdil flows to the south. Water's companions will test you there. You'll need to learn to build a raft!`,"DEMİRCİ KAYAN: Hah! Demiri eriten ateş senin yüreğindeymiş!":`SMITH KAYAN: Hah! The fire that melts iron was in your heart!`,"DEMİRCİ KAYAN: İdil'in suyu derin, akıntısı serttir. Sal yapmayı bilen birini bul.":`SMITH KAYAN: The İdil's water is deep and its current strong. Find someone who knows how to build a raft.`,"DEMİRCİ OBASI":`SMITHS' OBA`,"DEMİRCİ OBASI\nErgenekon'dan çıkanların ilk yurdu. Örslerin sesi hiç dinmez.":`SMITHS' OBA
First home of those who left Ergenekon. The anvils never fall silent.`,"DEMİRCİ USTA: Atalarımız Ergenekon'da demir dağı eritip yol açmış. Demir sabırla dövülür, yiğit de.":`MASTER SMITH: Our ancestors melted the iron mountain in Ergenekon and opened a road. Iron is forged with patience, and so is a hero.`,"DEMİRCİ USTA: Kara Tümen'e karşı yola çıkanı eli boş göndermem. Al bunu.":`MASTER SMITH: I never send off empty-handed one who rides against the Black Legion. Take this.`,"DEMİRCİ USTA: Örsüm her sabah öter. Demircinler de sesine koşar gelir!":`MASTER SMITH: My anvil rings every morning. The ironlings come running at the sound!`,DEMİRCİN:`IRONLING`,DENİZCİ:`SAILOR`,"DENİZCİ YAMAN":`SAILOR YAMAN`,"DENİZCİ YAMAN: Batıyorum!":`SAILOR YAMAN: I'm sinking!`,"DENİZCİ YAMAN: Gemide kim olduğumuzu göstereyim!":`SAILOR YAMAN: I'll show you who we are aboard this ship!`,"DENİZCİ YAMAN: Kaptan güverte altında yatıyor. Deniz tutmuş!":`SAILOR YAMAN: The captain is lying below deck. Seasick!`,"DENİZCİ ÖZGÜR":`SAILOR ÖZGÜR`,"DENİZCİ ÖZGÜR: Bu gemi ne taşıyor bilmiyorum... Kara Tümen'ciler sandıkları açtırmıyor.":`SAILOR ÖZGÜR: I don't know what this ship carries... The Black Legion won't let anyone open the crates.`,"DENİZCİ ÖZGÜR: Dalgalar seni sever!":`SAILOR ÖZGÜR: The waves love you!`,"DENİZCİ ÖZGÜR: Güvertede dövüşmeden geçilmez!":`SAILOR ÖZGÜR: No one crosses the deck without a fight!`,"DENİZCİ: Büyük gemi demir aldı, gitti. Yine gelir mi bilinmez.":`SAILOR: The great ship weighed anchor and left. Who knows if it'll be back.`,"DENİZCİ: Hop! Davetiyen var mı? Yoksa gemiye binemezsin!":`SAILOR: Hold on! Do you have an invitation? You can't board without one!`,"DENİZCİ: Kara Tümen'in gemisinde şölen var. Davetiyesi olan biner!":`SAILOR: There's a feast aboard the Black Legion's ship. Only guests with invitations may board!`,DERMAN:`CURE-ALL`,DERVİŞ:`DERVISH`,"DERVİŞ: Al şu ardıç tütsülerini. Uyuyan uyanır, zehirlenen ferahlar.":`DERVISH: Take these juniper incenses. The sleeping wake, the poisoned feel relief.`,"DERVİŞ: Ağacın meyvesi dalındadır, yiğidin meyvesi yoldaşındadır.":`DERVISH: A tree's fruit is on its branch; a hero's fruit is in their companion.`,"DERVİŞ: Yolda olan yorulmaz evlat. Yoldaşını incitmeyen hiç yalnız kalmaz.":`DERVISH: One on the road never tires, child. One who never hurts their companion is never alone.`,DEVAM:`CONTINUE`,DNM:`FRZ`,DOĞANCIK:`HAWKLET`,"Daha yakından tanımak için yoldaş edinmelisin.":`You need to make it your companion to know it better.`,"Davulum bu yolun sonunu gördü. Ama sana söylemem!":`My drum has seen the end of this road. But I won't tell you!`,"Dağ yamaçlarında taş gibi uyur. Üzerine basan yolcuyu bir silkinmede yere serer.":`It sleeps like a stone on mountain slopes. It throws travelers who step on it to the ground with one shake.`,"Dağların ardından gelen kır at. Yiğidini kırk gün kırk gece taşıdığı, bir sıçrayışta derin vadileri aştığı anlatılır.":`A gray horse from beyond the mountains. They say it carried its hero forty days and forty nights and leapt deep valleys in a single bound.`,"Dağların deniz olduğu çağdan kalma. Kabuğundaki halkaları sayan, dünyanın yaşını bilirmiş.":`Left over from the age when mountains were sea. Whoever counts the rings on its shell knows the age of the world.`,"Dağların yalnız gezgini. Kışı uyuyarak geçirir, baharda balın kokusuna uyanır.":`The lone wanderer of the mountains. It sleeps through winter and wakes in spring to the smell of honey.`,"Dede Korkut kopuzunu aldı ve otağına döndü. Kopuzdan yeni bir ezgi yükseliyor...":`Dede Korkut took up his kopuz and returned to his tent. A new melody rises from the strings...`,"Dede Korkut'un otağından 1923 basamaklı yola çıkarsın. Her 25 basamakta bir yiğit, her 100 basamakta eski bir tanıdık bekler.":`You set out from Dede Korkut's tent onto the 1923-step road. Every 25 steps a challenger, every 100 an old acquaintance awaits.`,"Dede Korkut'un yaptırdığı yeni kopuz telleri. Ona götürülmeli.":`New kopuz strings Dede Korkut ordered. They should be taken to him.`,"Dede Korkut'un yolu bu. Kolay geçilmez!":`This is Dede Korkut's road. It isn't easy to pass!`,"Demek sen {0}sin. Doğru mu?":`So you are {0}. Right?`,"Demir duvar kıpkırmızı kızardı ve eridi! Ergenekon'dan dışarı bir yol açıldı!":`The iron wall glowed red hot and melted! A way out of Ergenekon opened up!`,"Demir dövüldükçe sertleşir. Bakalım sen ne kadar dövüldün!":`Iron grows harder the more it is forged. Let's see how forged you are!`,"Demirci Obası":`Smiths' Oba`,"Demirci ocaklarını üfleyen ruh. Yetmiş körüğün bir arada öttüğü gün dağın eridiği anlatılır.":`The spirit that blows the smiths' hearths. They say the mountain melted on the day seventy bellows blew together.`,"Dev bir Tepegöz uyuyor. ESKİ KOPUZ çalınsın mı?":`A giant Tepegöz is sleeping. Play the OLD KOPUZ?`,"Dev bir Tepegöz yolun ortasında horul horul uyuyor. Kımıldamıyor bile!":`A giant Tepegöz is snoring in the middle of the road. It doesn't even twitch!`,"Dikili taşta eski harflerle kazınmış satırlar var. Dokununca içine bir güç doluyor.":`An ancient stele carved with old letters. When you touch it, power flows into you.`,"Dut yapraklarıyla beslenir. Ördüğü ipek, kervanlarla dünyanın öbür ucuna kadar gider.":`It feeds on mulberry leaves. The silk it weaves travels with caravans to the other end of the world.`,"Duvarda kopuz çalan bir ozanın tablosu... Arkasında bir düğme var!":`A painting of a bard playing the kopuz on the wall... There's a switch behind it!`,"DÖRDÜNCÜ YOL SONU":`END OF THE FOURTH ROAD`,DÖRTNALA:`GALLOP`,DÖVÜŞ:`FIGHT`,"Dünyanın en işe yaramaz yoldaşı diye bilinir. Bütün gün çırpınır durur. Ama sabredene büyük bir sır saklar.":`Known as the most useless companion in the world. It flops about all day. But it keeps a great secret for the patient.`,"Dünyanın öbür ucundaki Kaf Dağı'nda yaşar. Ona ulaşan yolcu aradığını kendinde bulur.":`It lives on Mount Kaf at the far end of the world. The traveler who reaches it finds within what the "Kaşgar'a git: Kara Tümen kalesini temizle, YEL tamgasını al.":`Go to Kashgar: clear out Kara Tümen's fortress and earn the WIND tamga.`,"Kaşgar'daki Bilgi Evi'ne uğra, Kuşçu Baba'dan Kartal Tüyü'nü al. Yeşil Oba'daki OD otağında Karaçor Han'la yüzleş.":`Visit the House of Learning in Kashgar and get the Eagle Feather from Old Falconer. Face Karaçor Han in the FIRE tent in Green Oba.`,"Sekiz tamga tamam! Kurultay Yolu'ndan Kurultay Otağı'na çık: Ozan, Alp, Kam, Bilge ve şampiyon.":`All eight tamgas! Climb the Kurultay Road to the Kurultay Tent: the Bard, the Warrior, the Shaman, the Sage and the champion.`,"Dede Korkut'un 1923 basamaklı yolu seni bekliyor. Bitig'ini de tamamlamayı unutma.":`Dede Korkut's 1923-step road awaits you. Don't forget to complete your Bitig.`,"Yolun sonuna vardın. Bitig'i tamamlamak için yabanilerin peşine düş!":`You've reached the end of the road. Chase the wild ones to complete your Bitig!`,"KIZIL GEYİK":`RED DEER`,"Yazıtlı taşlara kazınan geyik. Boynuzlarını göğe kaldırınca dalları yıldızlara değermiş.":`The deer carved on inscribed stones. When it raises its antlers to the sky, its tines touch the stars.`,KAPLANCIK:`TIGER CUB`,"Sazlıkta pusuya yatmayı öğrenen çizgili yavru. Kuyruğunu oynatmadan bekleyebilir.":`A striped cub learning to lie in wait in the reeds. It can wait without twitching its tail.`,"TURAN KAPLANI":`TURAN TIGER`,"Bir zamanlar Hazar'dan Ağrı'ya kadar dolaşırdı. Bugün yalnız eski anlatılarda yaşıyor.":`It once roamed from the Caspian to Mount Ağrı. Today it lives only in old tales.`,GULYABANİ:`GULYABANI`,"Issız yollarda yolcuyu şaşırtan çöl ve harabe hayaleti. Yolunu bilen yolcudan korkar.":`A ghoul of deserts and ruins that leads travellers astray. It fears a traveller who knows the way.`,BÜRKÜT:`BURKUT`,"Altay'da kartalcıların koluna konan dev kartal. Kurt avına bile çıkar.":`The giant eagle that perches on the arm of Altai falconers. It will even hunt wolves.`,KULAN:`KULAN`,"Bozkırın yaban eşeği. Sürüsüyle ufka doğru koşunca toz bulutu günlerce dinmez.":`The wild ass of the steppe. When its herd races toward the horizon, the dust takes days to settle.`,ARGALİ:`ARGALI`,"Altay'ın dev yaban koçu. Kıvrık boynuzları bir yiğidin kolundan kalındır.":`The giant wild ram of the Altai. Its curled horns are thicker than a warrior's arm.`,İRBİS:`IRBIS`,"Karlı dağların gri benekli kedisi. Kayalara karışır, nefes alışını bile duyamazsın.":`The grey-spotted cat of the snowy peaks. It melts into the rocks; you can't even hear it breathe.`,AHALTEKE:`AKHAL-TEKE`,"Kumların altın atı. Güneşte tüyü maden gibi parlar, çölde günlerce susuz koşar.":`The golden horse of the sands. Its coat gleams like metal in the sun, and it runs for days without water.`,ALABALIK:`TROUT`,"Soğuk dağ derelerinin benekli balığı. Şelaleye karşı bile yüzer.":`The spotted fish of cold mountain streams. It swims even against waterfalls.`,MERSİN:`STURGEON`,"İdil'in dibindeki kadim dev balık. Yüz yıl yaşadığı söylenir.":`The ancient giant fish at the bottom of the İdil. They say it lives a hundred years.`,KUNDUZ:`BEAVER`,"Dere ağzına dallardan bent kurar. Ustalığını gören ahşap ustaları ona hayran kalır.":`It builds dams of branches at the mouths of streams. Woodworkers who see its craft are full of admiration.`,"GELİN BÖCEĞİ":`LADYBUG`,"Eline konarsa uğur getirir derler. Kanatlarındaki benekleri sayan yaşını bilir.":`They say it brings luck if it lands on your hand. Count the spots on its wings and you'll know its age.`,"ATEŞ BÖCEĞİ":`FIREFLY`,"Yaz gecelerinde çayırları fenerle doldurur. Çocuklar onun ışığıyla masal dinler.":`On summer nights it fills the meadows with lanterns. Children listen to tales by its light.`,GÜVERCİN:`PIGEON`,"Avlulu cami bahçelerinin sakin konuğu. Yem atana kanat çırparak teşekkür eder.":`The calm guest of mosque courtyards. It flaps its wings in thanks to whoever scatters grain.`,TEKİR:`TABBY`,"Şehrin sokaklarının sahibi. Her kapının önünde ona ayrılmış bir kap su vardır.":`The owner of the city's streets. Every doorstep keeps a bowl of water for it.`,MARTI:`GULL`,"Vapurun peşinden gelir, havada simit kapar. Boğaz'ın sesi onun çığlığıdır.":`It follows the ferry and snatches simit in midair. Its cry is the voice of the Bosphorus.`,KİRPİ:`HEDGEHOG`,"Bahçelerin gece bekçisi. Tehlike görünce dikenli bir top olur.":`The night watchman of gardens. At the first sign of danger it becomes a prickly ball.`,CARETTA:`CARETTA`,"Doğduğu kumsala dönüp yumurtlar. Yavruları ayın ışığına doğru denize koşar.":`It returns to the beach where it hatched to lay its eggs. Its hatchlings race to the sea toward the moonlight.`,FLAMİNGO:`FLAMINGO`,"Tuz gölünün pembe kuşu. Binlercesi birden havalanınca göl kızıla boyanır.":`The pink bird of the salt lake. When thousands take off at once, the lake turns crimson.`,"ANKARA TAVŞANI":`ANGORA RABBIT`,"Yünü buluttan yumuşaktır. Kulaklarını dikince bütün çayırı dinler.":`Its wool is softer than a cloud. When it pricks up its ears, it listens to the whole meadow.`,TURNACIK:`CRANELET`,"Uzun bacaklı gri yavru. Daha uçmayı bilmeden sürünün türküsünü öğrenir.":`A long-legged grey chick. It learns the flock's song before it can even fly.`,YUNUS:`DOLPHIN`,"Karadeniz'in neşeli dalgıcı. Balıkçı teknelerinin önünde dalgalara takla atar.":`The cheerful diver of the Black Sea. It somersaults through the waves ahead of fishing boats.`,SÜLÜN:`PHEASANT`,"Karadeniz ormanlarının renkli kuşu. Kuyruğu bir kilim kadar desenlidir.":`The colourful bird of the Black Sea forests. Its tail is as patterned as a kilim.`,KUZGUN:`RAVEN`,"Ozanların türkülerinde haber getiren kara kuş. Gözünden hiçbir şey kaçmaz.":`The black bird that brings news in the bards' songs. Nothing escapes its eye.`,"ODUNCU DERVİŞ":`WOODCARRIER DERVISH`,NEYZEN:`NEY PLAYER`,"NASREDDİN HOCA":`NASREDDIN HODJA`,"ODUNCU DERVİŞ: Gelin tanış olalım, işi kolay kılalım. Sevelim, sevilelim; dünya kimseye kalmaz.":`WOODCARRIER DERVISH: Come, let us get to know each other and make the work easy. Let us love and be loved; this world is left to no one.`,"ODUNCU DERVİŞ: Hocamın dergâhına odun taşırım. Kırk yıldır sırtımda hep doğru dal var.":`WOODCARRIER DERVISH: I carry firewood to my master's lodge. For forty years I have carried only straight branches.`,'ODUNCU DERVİŞ: Bir gün sordular: "Ormanda hiç eğri odun yok mu?" Dedim: "Bu kapıya eğri odun yakışmaz."':`WOODCARRIER DERVISH: One day they asked, "Is there no crooked wood in the forest?" I said, "Crooked wood does not befit this door."`,"ODUNCU DERVİŞ: Yoldaşlarına da doğru davran yiğit. Onlar seni yolda bırakmaz.":`WOODCARRIER DERVISH: Be straight with your companions too, young hero. They will never leave you on the road.`,"{0}, 3 ŞİFALI OT aldı!":`{0} received 3 HEALING HERBS!`,"NEYZEN: Dinle bu neyi. Kamışlıktan koparıldığından beri ayrılığı anlatır, kavuşmayı özler.":`NEY PLAYER: Listen to this reed flute. Ever since it was cut from the reed bed, it tells of separation and longs for reunion.`,"NEYZEN: Takımındaki her yoldaş da bir yerden koparılıp sana geldi. Onları sev, yolunuz bir olsun.":`NEY PLAYER: Every companion in your team was also taken from somewhere to come to you. Love them, and let your roads be one.`,"NEYZEN: Ne kadar yol yürürsen yürü, gönül yolu hepsinden uzundur.":`NEY PLAYER: However far you walk, the road of the heart is the longest of all.`,'NASREDDİN HOCA: Bir gün kürsüye çıktım, sordum: "Ne anlatacağımı biliyor musunuz?" "Hayır" dediler.':`NASREDDIN HODJA: One day I stepped up to preach and asked, "Do you know what I'm going to tell you?" "No," they said.`,'NASREDDİN HOCA: "Bilmeyenlere ne anlatayım!" deyip indim. Bir dahaki sefere "Biliyoruz" dediler.':`NASREDDIN HODJA: "What can I tell people who don't know!" I said, and stepped down. The next time they said, "We know."`,'NASREDDİN HOCA: "Bilenlere ne anlatayım!" Yarısı bilsin, yarısı bilmesin dediler; bilenler bilmeyenlere anlatsın dedim.':`NASREDDIN HODJA: "Then what can I tell people who know!" So half said they knew and half didn't. Then let those who know tell those who don't, I said.`,'NASREDDİN HOCA: Göle maya çalıyordum. "Hocam, göl hiç yoğurt olur mu?" dediler.':`NASREDDIN HODJA: I was stirring yogurt culture into the lake. "Hodja, how can a lake turn into yogurt?" they asked.`,'NASREDDİN HOCA: "Ya tutarsa!" dedim. Sen de yabaniye kementi atmadan vazgeçme.':`NASREDDIN HODJA: "But what if it works!" I said. Don't give up on a wild one before you throw your lasso, either.`,'NASREDDİN HOCA: Komşu kazanımı istedi, geri verirken içine küçük bir tencere koydu: "Kazanın doğurdu" dedi.':`NASREDDIN HODJA: I borrowed my neighbour's cauldron and returned it with a little pot inside: "Your cauldron gave birth," I said.`,'NASREDDİN HOCA: Sonra ben onun kazanını aldım, vermedim. "Kazanın öldü" dedim. "Kazan ölür mü?" dedi.':`NASREDDIN HODJA: Later I borrowed it again and kept it. "Your cauldron died," I said. "How can a cauldron die?" he asked.`,'NASREDDİN HOCA: "Doğurduğuna inandın da öldüğüne neden inanmazsın?"':`NASREDDIN HODJA: "You believed it could give birth, so why not that it could die?"`,"NASREDDİN HOCA: Eşeğime ters bindiğimi görüp güldüler.":`NASREDDIN HODJA: They laughed when they saw me riding my donkey backwards.`,"NASREDDİN HOCA: Ben ters binmedim, eşek ters duruyor! Hem böylece arkamdan gelenlerle de konuşabiliyorum.":`NASREDDIN HODJA: I'm not riding backwards, the donkey is facing the wrong way! Besides, this way I can talk to the people behind me.`,"NASREDDİN HOCA: Gülmek de şifadır. Al şu kımızı, yolda içersin.":`NASREDDIN HODJA: Laughter is a cure too. Take this kumis to drink on the road.`,"Bir posta güvercini geldi. Ayağındaki mektupta Dede Korkut yazıyor:":`A carrier pigeon has arrived. The letter on its leg is from Dede Korkut:`,KELOĞLAN:`KELOĞLAN`,"KELOĞLAN: Anam bir tas çorba, bir dilim ekmekle yola saldı beni. Dünyayı gezmeden kel kafama akıl girmez!":`KELOĞLAN: My mother sent me on my way with a bowl of soup and a slice of bread. My bald head won't get wise until I've seen the world!`,"KELOĞLAN: Bak yiğit, yolda kimsesiz kalmış bir yavru görürsen sahip çık. Bir gün o da sana sahip çıkar.":`KELOĞLAN: Listen, friend: if you find a little one left all alone on the road, look after it. One day it will look after you.`,"KELOĞLAN: Yine karşılaştık! Devin ağzından, cadının kazanından kurtuldum da geldim.":`KELOĞLAN: We meet again! I escaped a giant's jaws and a witch's cauldron to get here.`,"KELOĞLAN: Obanın yetimlerine balık tuttum. Kimsesizin kimsesi olmak kelin işidir.":`KELOĞLAN: I caught fish for the village orphans. Standing by those who have no one is a bald lad's job.`,"KELOĞLAN: Kaşgar'a kadar geldim, daha da giderim! Duydum ki uzak diyarlarda efsaneler kafa topu oynuyormuş.":`KELOĞLAN: I've come as far as Kashgar, and I'll go further! I hear that in faraway lands the legends play head soccer.`,"KELOĞLAN: Bir gün hepsine meydan okuyacağım. Kel kafa parlar, top ağlara gider!":`KELOĞLAN: One day I'll challenge them all. The bald head shines, the ball hits the net!`,"KELOĞLAN: Al şu kementleri, ben iyi niyetimle idare ederim.":`KELOĞLAN: Take these lassos; I get by on good intentions.`,"DELİ DUMRUL":`DELI DUMRUL`,HACİVAT:`HACIVAT`,KARAGÖZ:`KARAGÖZ`,KÖROĞLU:`KÖROĞLU`,KIRAT:`KIRAT`,"DELİ DUMRUL: Köprü herkesin, yol herkesin. Selametle geç, yiğit!":`DELI DUMRUL: The bridge belongs to all, the road belongs to all. Go in peace, young hero!`,"DELİ DUMRUL: Bir zamanlar kuru çayın üstüne köprü kurdum. Geçenden otuz üç akçe, geçmeyenden döve döve kırk akçe alırdım.":`DELI DUMRUL: Once I built a bridge over a dry stream. I took thirty-three coins from those who crossed, and beat forty out of those who didn't.`,"DELİ DUMRUL: Kendimi dünyanın en yiğidi sanırdım. Sonra öğrendim ki canı veren de alan da Yaradan'dır.":`DELI DUMRUL: I thought I was the bravest man in the world. Then I learned that it is the Creator who gives life and takes it.`,"DELİ DUMRUL: Şimdi köprümden geçene akçe değil, azık veririm. Al, yolun uzun.":`DELI DUMRUL: Now I give provisions, not tolls, to those who cross my bridge. Take this, your road is long.`,"HACİVAT: Karagöz'üm, şu yolcuya bir hoş geldin diyelim. Uzak yollardan gelmiş, tamga peşindeymiş.":`HACIVAT: My dear Karagöz, let us welcome this traveller. They have come a long way in search of tamgas.`,"KARAGÖZ: Damga mı? Benim alnımda zaten mahallenin damgası var!":`KARAGÖZ: A stamp? I've already got the whole neighbourhood's stamp on my forehead!`,"HACİVAT: Damga değil efendim, TAMGA! Boyların, obaların nişanı.":`HACIVAT: Not a stamp, sir, a TAMGA! The emblem of clans and camps.`,"KARAGÖZ: Nişan mı? Kimin nişanı? Davetiye gelmedi bana!":`KARAGÖZ: An engagement? Whose engagement? Nobody sent me an invitation!`,"HACİVAT: Yoldaşlarını iyi besle, yolcu. Hazmı kolay şeyler ver.":`HACIVAT: Feed your companions well, traveller. Give them things that are easy to digest.`,"KARAGÖZ: Hazır mı? Ben de hazırım, aç kalmaktan hazırım!":`KARAGÖZ: Ready? I'm ready too, ready from starving!`,"HACİVAT: Hazır değil, HAZIM! Sindirmek, mideyi yormamak.":`HACIVAT: Not ready, DIGEST! To not tire the stomach.`,"KARAGÖZ: Benim midem yorulmaz Hacivat, yorulan cebim!":`KARAGÖZ: My stomach never gets tired, Hacivat, it's my pocket that does!`,"HACİVAT: Bu yolcu sekiz tamgayı toplayıp Kurultay'a çıkacakmış, ne dersin?":`HACIVAT: This traveller will gather eight tamgas and go up to the Kurultay. What do you say?`,"KARAGÖZ: Kuru tay mı? Islak tayı yok mu, ben atı sulu severim!":`KARAGÖZ: A dry foal? Haven't they got a wet one? I like my horses juicy!`,"HACİVAT: Kurultay efendim, kurultay! Boyların büyük toplantısı.":`HACIVAT: Kurultay, sir, kurultay! The great assembly of the clans.`,"KARAGÖZ: Yıktın perdeyi, eyledin viran; varayım sahibine haber vereyim heman!":`KARAGÖZ: You've torn down the screen and left it in ruins; I'll run and tell its owner at once!`,"KÖROĞLU: Çamlıbel'den indim, Kurultay'ı görmeye geldim. Atım Kırat'ı tanır mısın?":`KÖROĞLU: I've come down from Çamlıbel to see the Kurultay. Do you know my horse, Kırat?`,"KÖROĞLU: Babam onu karanlık ahırda büyüttü, denizden çıkan taydan doğdu. Şimdi yeli bile geçer.":`KÖROĞLU: My father raised him in a dark stable; he was born of a foal that came out of the sea. Now he outruns the wind itself.`,"KÖROĞLU: Senin yanındaki de bir KIRAT! Bak, benimki ona kişniyor. Onlar kardeş gibi.":`KÖROĞLU: The one beside you is a KIRAT too! Look, mine is neighing at it. They're like brothers.`,"KÖROĞLU: Unutma yiğit: mertlik silahta değil, yürektedir.":`KÖROĞLU: Remember, young hero: courage is not in the weapon, it's in the heart.`,"KIRAT: Hıııı!":`KIRAT: Neeeigh!`},i=`tamga-yolu-dil`,a=`tr`;try{a=localStorage.getItem(i)||((navigator.language||``).toLowerCase().startsWith(`tr`)?`tr`:`en`)}catch{}var o=()=>a;function s(e){a=e,te.clear();try{localStorage.setItem(i,e)}catch{}try{document.documentElement.lang=e}catch{}for(let t of c)t(e)}var c=[],l=e=>c.push(e),u=new Map,d=[],ee=e=>e.replace(/[.*+?^${}()|[\]\\]/g,`\\$&`);for(let[e,t]of Object.entries(r)){if(!/\{\d\}/.test(e)){u.set(e,t);continue}let n=e.replace(/\{\d\}/g,``);if(!n.trim())continue;let r=e.split(/(\{\d\})/),i=`^`,a=[];r.forEach((e,t)=>{let n=/^\{(\d)\}$/.exec(e);n?(a.push(+n[1]),i+=/^\{\d\}$/.test(r[t+2]||``)&&r[t+1]===``?`([\\s\\S]*?)`:`([\\s\\S]*)`):i+=ee(e)}),d.push({re:RegExp(i+`$`),en:t,sira:a,uzun:n.length})}d.sort((e,t)=>t.uzun-e.uzun);var te=new Map;function ne(e){if(u.has(e))return u.get(e);let t=/^(\d+ ×? ?)(.+)$/.exec(e);if(t&&u.has(t[2]))return t[1]+u.get(t[2]);for(let t of d){let n=t.re.exec(e);if(!n)continue;let r={};return t.sira.forEach((e,t)=>{r[e]=n[t+1]}),t.en.replace(/\{(\d)\}/g,(e,t)=>re(r[t]??``))}return e}function re(e){if(a===`tr`||typeof e!=`string`||!e)return e;let t=te.get(e);return t===void 0&&(t=ne(e),te.size>4e3&&te.clear(),te.set(e,t)),t}var ie={k:`#1a120a`,h:`#6b4423`,H:`#8a5a2e`,s:`#e8b98a`,e:`#1a120a`,r:`#a8322a`,R:`#c94a35`,y:`#e0a83a`,b:`#3a2a1c`,c:`#5a4030`,g:`#8d8d86`,G:`#b4b2a8`,w:`#e9e6dc`,n:`#2a2a2a`,m:`#d08a4a`,v:`#4e7d3a`,V:`#77a
