<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#e0b048;--gold2:#c99a4a;--ink:#1a0f0a;--cream:#f4ecd8;--red:#a3372b;--redD:#6e1f18;--panel:#2a1d14}
html,body{height:100%;background:#120b07;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Pixelify Sans",monospace;color:var(--gold)}
#frame{position:fixed;left:6px;right:6px;top:6px;bottom:6px;padding:7px;border:2px solid var(--gold);border-radius:14px;background:#000;box-shadow:0 0 0 3px #3a2618,0 0 0 5px var(--gold2)}
#screen{position:relative;width:100%;height:100%;background:#000;border-radius:7px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* overlays inside the screen */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;text-align:center}
.ov[hidden]{display:none!important}
.ov.dim{background:rgba(18,11,7,.9)}
.ov h2{font:700 22px "Pixelify Sans",monospace;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.ov p{color:var(--cream);font-size:13px;line-height:1.4;max-width:320px}
.mb{min-width:62%;max-width:340px;padding:11px 14px;border:2px solid var(--gold);border-radius:10px;background:rgba(58,38,24,.92);color:#f3d48e;font:700 19px "Pixelify Sans",monospace;box-shadow:0 3px 0 var(--ink)}
.mb.sm{font-size:15px;padding:9px 12px;min-width:0}
.mb[disabled]{opacity:.5;border-color:#7a6040;color:#c9a46a}
.mb:active{transform:translateY(2px)}
.row2{display:flex;gap:10px;justify-content:center;width:100%;max-width:420px}
.row2 .mb{flex:1;min-width:0}
#ovTitle{justify-content:flex-start;padding-top:12px}
#ovTitle .top{display:flex;justify-content:space-between;width:100%}
#ovTitle .logo{margin-top:auto;font:700 46px "Pixelify Sans",monospace;color:var(--gold);letter-spacing:2px;text-shadow:3px 3px 0 var(--ink),0 0 18px rgba(224,176,72,.35)}
#ovTitle .sub{font:400 16px "Pixelify Sans",monospace;color:var(--cream);margin-top:-6px;margin-bottom:auto;text-shadow:1px 1px 0 var(--ink)}
#ovTitle .imza{font-size:12px;color:var(--gold);opacity:.85;margin-top:2px}
.lnk{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--gold);opacity:.7}
#ovHelp{justify-content:flex-start;overflow:auto}
#ovHelp .list{width:100%;max-width:440px;text-align:left;display:flex;flex-direction:column;gap:7px;margin:4px 0}
#ovHelp .it{background:rgba(58,38,24,.85);border:1px solid #6a4a2a;border-radius:8px;padding:7px 9px;color:var(--cream);font-size:13px;line-height:1.35}
#ovHelp .it b{color:var(--gold)}
#ovSel .lvl{font:700 20px "Pixelify Sans",monospace;color:var(--cream)}
#coach{position:absolute;left:8px;right:8px;top:30px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;background:rgba(18,11,7,.93);border:2px solid var(--gold);border-radius:10px;color:var(--cream);font-size:14px;line-height:1.4;text-align:center}
#coach[hidden]{display:none}
#coach b{color:var(--gold)}
#coach.soft{pointer-events:none;background:rgba(18,11,7,.8)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(18,11,7,.92);border:1px solid var(--gold);color:var(--cream);font-size:13px;white-space:nowrap}
#toast[hidden]{display:none}
.tp-odak{outline:3px solid #fff3c0!important;outline-offset:3px}
/* classic controller shell */
.tp-kabuk{position:fixed;left:0;right:0;bottom:0;top:0;z-index:0;touch-action:none;overflow:hidden;
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),linear-gradient(180deg,#3a2a1e,#2a1d14 60%,#20160f)}
.tp-kabuk[hidden]{display:none}
#frame{z-index:1}
.tp-ad{position:absolute;color:var(--gold);font:700 17px "Pixelify Sans",monospace;letter-spacing:8px;white-space:nowrap;opacity:.9;text-shadow:1px 1px 0 var(--ink)}
.tp-imza{position:absolute;color:var(--gold);opacity:.75;font:400 12px "Pixelify Sans",monospace;white-space:nowrap;pointer-events:none}
.tp-hac{position:absolute;width:130px;height:130px;transform-origin:0 0}
.tp-hac i{position:absolute;background:#1c130d;border:2px solid #5a3a22;box-sizing:border-box}
.tp-hac i.d{left:43px;top:0;width:44px;height:130px;border-radius:9px}
.tp-hac i.y{left:0;top:43px;width:130px;height:44px;border-radius:9px}
.tp-hac i.m{left:45px;top:45px;width:40px;height:40px;border:0;border-radius:0}
.tp-hac b{position:absolute;width:0;height:0;border:9px solid transparent}
.tp-hac .b1{left:56px;top:9px;border-bottom-color:var(--gold)}.tp-hac .b2{left:56px;bottom:9px;border-top-color:var(--gold)}
.tp-hac .b3{left:9px;top:56px;border-right-color:var(--gold)}.tp-hac .b4{right:9px;top:56px;border-left-color:var(--gold)}
.tp-hac.on-yukari .b1{border-bottom-color:#fff3c0}.tp-hac.on-asagi .b2{border-top-color:#fff3c0}.tp-hac.on-sol .b3{border-right-color:#fff3c0}.tp-hac.on-sag .b4{border-left-color:#fff3c0}
.tp-dug{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform-origin:100% 0;
 background:radial-gradient(circle at 35% 30%,#c4483a,var(--red) 60%);border:3px solid var(--gold);box-shadow:0 5px 0 var(--redD);color:#f3d48e;font:700 28px "Pixelify Sans",monospace}
.tp-dug.bas{transform:translateY(4px);box-shadow:0 1px 0 var(--redD)}
.tp-menu{position:absolute;padding:8px 30px;border-radius:999px;background:#1c130d;border:2px solid #5a3a22;color:var(--gold);font:700 15px "Pixelify Sans",monospace;letter-spacing:3px;box-shadow:0 4px 0 #0c0805}
.tp-menu.bas{transform:translateY(3px);box-shadow:0 1px 0 #0c0805}

const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,f)=>[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*f));
const lit=(c,f)=>mix(c,[255,250,235],f),drk=(c,f)=>mix(c,[16,10,20],f);
function hsh(a){a=(a^61)^(a>>>16);a=a+(a<<3)|0;a^=a>>>4;a=Math.imul(a,0x27d4eb2d);a^=a>>>15;return (a>>>0)/4294967296;}
function raster(w,h,fn,wrap){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const id=x.createImageData(w,h),d=id.data;
 const P=(X,Y,col)=>{X=Math.round(X);Y=Math.round(Y);if(wrap)X=((X%w)+w)%w;if(X<0||X>=w||Y<0||Y>=h)return;const i=(Y*w+X)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3]==null?255:col[3];};
 fn(P,w,h);x.putImageData(id,0,0);return c;}
const C=(s)=>hx(s);
// yuvarlak, konturlu, sol üstten ışık alan küme
function blob(P,cx,cy,r,base,ol,maxY,lt=.32,dk=.22){const L=lit(base,lt),D=drk(base,dk);for(let y=-r-1;y<=r+1;y++){if(maxY!=null&&cy+y>maxY)continue;for(let x=-r-1;x<=r+1;x++){const d=Math.hypot(x,y);if(d>r+.5)continue;
 let col;if(d>r-.9)col=ol;else if(Math.hypot(x+r*.38,y+r*.42)<r*.42)col=L;else if((x*.55+y)/r>.5)col=D;else col=base;P(cx+x,cy+y,col);}}}
function pineHD(P,x,base,h,c1,ol,trunk){const L=lit(c1,.22),D=drk(c1,.25);const tw=Math.max(2,h*.08|0);for(let y=base-6;y<base;y++)for(let i=-tw;i<=tw;i++)P(x+i,y,i===-tw||i===tw?ol:trunk);
 for(let k=0;k<3;k++){const top=base-6-h*(.42+k*.29),bot=base-4-h*k*.26,half=h*(.36-k*.07);for(let y=Math.floor(top);y<=bot;y++){const f=(y-top)/(bot-top),wd=Math.max(0,half*f);for(let i=-Math.ceil(wd);i<=Math.ceil(wd);i++){
  const edge=Math.abs(i)>=wd-.6||y===Math.floor(top)||y>=bot-.5;const col=edge?ol:(i<-wd*.25?L:(i>wd*.35?D:c1));if(y>=bot-.5&&Math.abs(i)<wd-1)P(x+i,y,D);else P(x+i,y,col);}}}}
const LW=512;
function cloudsL(wh,ol,n=5,ymax=58,flat){return raster(LW,130,(P)=>{for(let i=0;i<n;i++){const x=i*LW/n+hsh(i*7)*40,y=18+hsh(i*13)*ymax;const s=.8+hsh(i*3)*.6;
 if(flat){for(let k=0;k<3;k++){const w=(40+hsh(i*5+k)*50)*s,yy=y+k*5,xx=x+k*9-hsh(i+k)*12;for(let xx2=0;xx2<w;xx2++){P(xx+xx2,yy,k?wh:lit(wh,.4));P(xx+xx2,yy+1,wh);P(xx+xx2,yy+2,ol);}}continue;}
 [[0,6,9],[12,0,12],[26,4,10],[38,8,8],[-10,10,7]].forEach(([dx,dy,r])=>blob(P,x+dx*s,y+dy*s,Math.round(r*s),wh,ol,y+16*s,.05,.12));}},true);}
function mtnL(p){return raster(LW,192,(P)=>{const pk=[];for(let i=0;i<7;i++)pk.push([i*LW/7+hsh(i*11+p.seed)*30,p.lo+hsh(i*5+p.seed)*p.span]);
 for(let x=0;x<LW;x++){let best=-1,bi=0;for(let k=0;k<pk.length;k++)for(const o of[-LW,0,LW]){const dx=x-(pk[k][0]+o);const hh=pk[k][1]-Math.abs(dx)*p.slope;if(hh>best){best=hh;bi=k*10+(dx<0?0:1);}}
  const top=Math.round(p.base-best),left=bi%10===0,pkH=pk[Math.floor(bi/10)][1];
  for(let y=Math.max(0,top);y<192;y++){let col=left?p.c:p.sh;if(y===top)col=p.ol;else if(p.sn&&pkH>p.snowMin&&y<p.base-pkH+18+[0,1,2,3,2,1][x%6]*2)col=left?p.sn:p.snD;P(x,y,col);}}},true);}
function hillsL(c,ol,base,rMin,rSpan,seed=0){return raster(LW,192,(P)=>{for(let i=0;i<6;i++){const x=i*LW/6+hsh(i*17+seed)*40,r=rMin+hsh(i*23+seed)*rSpan;blob(P,x,base-r*.35,Math.round(r),c,ol,null,.25,.25);}
 for(let x=0;x<LW;x++)for(let y=base;y<192;y++)P(x,y,c);},true);}
function pinesL(c,c2,ol,floor,trunk,base=162){return raster(LW,192,(P)=>{for(let x=0;x<LW;x++)for(let y=base-4;y<192;y++)P(x,y,floor);

function steppeL(c,ol,tuft,yurt){return raster(LW,192,(P)=>{const L=lit(c,.25),D=drk(c,.18);const yAt=x=>Math.round(146+Math.sin(x*2*Math.PI/LW*3)*6+Math.sin(x*2*Math.PI/LW*5+1)*3);
 for(let x=0;x<LW;x++){const t=yAt(x);for(let y=t;y<192;y++)P(x,y,y===t?ol:(y<t+3?L:(((x*7+y*3)%23===0)?D:c)));if(hsh(x*3)>.86){P(x,t-1,tuft);P(x,t-2,tuft);if(hsh(x*5)>.5)P(x+1,t-1,tuft);}}
 for(let i=0;i<3;i++){const x=Math.round(i*LW/3+60+hsh(i*41)*60),b=yAt(x+12)+2;const W2=24,wc=yurt,wl=lit(wc,.3),wd=drk(wc,.2),okc=C('#2a1810'),red=C('#b8352b');

  for(let y=0;y<5;y++)for(let k=-2;k<=2;k++)P(x+12+k,b-5+y,Math.abs(k)===2||y===0?okc:C('#3a2414'));for(let y=0;y<4;y++)P(x+12,b-16+y,C('#6a4426'));P(x+12,b-17,C('#e0b048'));}},true);}
function islandsL(){return raster(LW,192,(P)=>{for(let i=0;i<3;i++){const x=i*LW/3+40+hsh(i*9)*80,y=34+hsh(i*13)*30,w=18+hsh(i*5)*14;const hz=c=>mix(C(c),C('#9ccff4'),.5);const g=hz('#8fcf6a'),gO=hz('#3e7a3a'),r=hz('#a8907a'),rD=hz('#6e5c4c');
 for(let k=0;k<w;k++){P(x+k,y,gO);P(x+k,y+1,g);P(x+k,y+2,g);const dep=Math.round((1-Math.abs(k/w*2-1))*14);for(let j=3;j<3+dep;j++)P(x+k,y+j,j===2+dep?rD:(k<w/2?r:rD));}

function pillarsL(c,ol,dark){return raster(LW,192,(P)=>{const L=lit(c,.18),D=drk(c,.3);for(let i=0;i<8;i++){const x0=i*64+10,w=18;for(let y=0;y<192;y++)for(let k=0;k<w;k++){let col=k===0||k===w-1?ol:(k<4?L:(k>w-5?D:c));if(y%16===0)col=ol;else if(y%16===1&&k>0&&k<w-1)col=L;P(x0+k,y,col);}
 for(let y=4;y<192;y+=32){P(x0+w/2,y,dark);P(x0+w/2+1,y+1,dark);}}},true);}
function stalL(c,ol,len,seed){return raster(LW,192,(P)=>{const L=lit(c,.2),D=drk(c,.25);for(let i=0;i<22;i++){const x=i*LW/22+hsh(i*5+seed)*10,h=len*(.4+hsh(i*11+seed)),w=5+hsh(i*3+seed)*6;

function castleL(c,ol,win){return raster(LW,192,(P)=>{const L=lit(c,.15),D=drk(c,.25);for(let y=24;y<192;y++)for(let x=0;x<LW;x++){const row=Math.floor((y-24)/12),bx=(x+(row%2)*12)%24,by=(y-24)%12;P(x,y,by===0||bx===0?ol:(by===1||bx===1?L:(by===11||bx===23?D:c)));}

 for(let i=0;i<4;i++){const x0=i*128+48;for(let y=60;y<104;y++)for(let k=0;k<20;k++){const arch=y<70&&Math.hypot(k-9.5,y-70)>10;if(arch)continue;const e=k===0||k===19||(y<70&&Math.hypot(k-9.5,y-70)>8.6);P(x0+k,y,e?ol:mix(win,[40,10,4],(y-60)/60));}
  for(let k=0;k<20;k++)P(x0+k,104,ol);
  const tx=x0+44;for(let y=86;y<100;y++){P(tx,y,C('#4a2a14'));P(tx+1,y,C('#6a4426'));}}},true);}
